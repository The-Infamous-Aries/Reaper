    <script>
        // Block Cloudflare analytics and other unwanted scripts
        (function() {
            const originalAppendChild = Element.prototype.appendChild;
            const originalInsertBefore = Node.prototype.insertBefore;
            
            function blockAnalyticsScript(element) {
                if (element.tagName === 'SCRIPT') {
                    const src = element.src || '';
                    const content = element.textContent || '';
                    
                    // Block Cloudflare Insights and other analytics
                    if (src.includes('cloudflareinsights.com') || 
                        src.includes('beacon.min.js') ||
                        content.includes('cloudflareinsights') ||
                        content.includes('__cfBeacon')) {
                        console.log('Blocked analytics script:', src || 'inline script');
                        return true;
                    }
                }
                return false;
            }
            
            Element.prototype.appendChild = function(element) {
                if (blockAnalyticsScript(element)) {
                    return element; // Return the element but don't actually append it
                }
                return originalAppendChild.call(this, element);
            };
            
            Node.prototype.insertBefore = function(newNode, referenceNode) {
                if (blockAnalyticsScript(newNode)) {
                    return newNode; // Return the element but don't actually insert it
                }
                return originalInsertBefore.call(this, newNode, referenceNode);
            };
            
            console.log('Analytics blocking initialized');
        })();
    </script>
    <script>
        const contentDiv = document.getElementById('content');
        const navLinks = document.querySelectorAll('.nav-link');

        // Removed fetchBotInfo function - bot avatar/banner no longer displayed on dashboard

        function initializeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            const sidebarCollapseToggle = document.querySelector('.sidebar-collapse-toggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            
            if (!sidebar) return;
            
            // Mobile sidebar toggle
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-hidden');
                    if (sidebarOverlay) {
                        sidebarOverlay.classList.toggle('active');
                    }
                });
            }
            
            // Desktop sidebar collapse
            if (sidebarCollapseToggle) {
                sidebarCollapseToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
                });
                
                // Restore collapsed state from localStorage
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebar.classList.add('collapsed');
                }
            }
            
            // Overlay click to close mobile sidebar
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    sidebar.classList.add('mobile-hidden');
                    sidebarOverlay.classList.remove('active');
                });
            }
            
            console.log('Sidebar initialized successfully');
        }

        let currentLoadedPage = null;

        function loadPage(page, scriptPath, scriptType, cssPath) {
            let pageFile = page.split('?')[0];
            if (!pageFile.endsWith('.html')) {
                pageFile += '.html';
            }

            if (currentLoadedPage === pageFile) {
                return;
            }
            
            currentLoadedPage = pageFile;

            if (typeof scriptManager !== 'undefined') {
                scriptManager.unloadAll();
            }

            if (cssPath && typeof scriptManager !== 'undefined') {
                scriptManager.loadCSS(cssPath);
            }

            const cacheBuster = `?v=${new Date().getTime()}`;
            fetch(`Pages/${pageFile}${cacheBuster}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(html => {
                    contentDiv.innerHTML = html;

                    const dispatchPageLoadedEvent = () => {
                        const pageLoadedEvent = new CustomEvent('dashboardPageLoaded', {
                            detail: { page: pageFile }
                        });
                        document.dispatchEvent(pageLoadedEvent);
                        console.log(`Dispatched dashboardPageLoaded for ${pageFile}`);
                    };

                    function runInlineScripts(callback) {
                        const scripts = Array.from(contentDiv.querySelectorAll("script"));
                        function runNext(index) {
                            if (index >= scripts.length) {
                                if (callback) callback();
                                return;
                            }
                            const oldScript = scripts[index];
                            const newScript = document.createElement("script");
                            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                            runNext(index + 1);
                        }
                        runNext(0);
                    }

                    runInlineScripts(() => {
                        if (scriptPath && typeof scriptManager !== 'undefined') {
                            scriptManager.loadScript(scriptPath, scriptType, dispatchPageLoadedEvent);
                        } else {
                            dispatchPageLoadedEvent();
                        }
                    });
                })
                .catch(error => {
                    console.warn(`Error loading page: ${pageFile}`, error);
                    contentDiv.innerHTML = `<div class="alert alert-danger">Error loading page: ${pageFile}</div>`;
                    currentLoadedपीage = null;
                });
        }

        function navigateTo(page, params = {}, pushState = true) {
            if (pushState) {
                const url = new URL(window.location);
                url.searchParams.set('page', page);

                // Clean up old params and add new ones
                const oldParams = Array.from(url.searchParams.keys());
                oldParams.forEach(key => {
                    if(key !== 'page') url.searchParams.delete(key);
                });
                for(const [key, value] of Object.entries(params)){
                    url.searchParams.set(key, value);
                }
                history.pushState({page: page, params: params}, "", url.toString());
            }
            
            // Update active link and get the script path
            navLinks.forEach(l => l.classList.remove('active'));
            const activeLink = document.querySelector(`.nav-link[data-page='${page}']`);
            let scriptPath = null;
            let scriptType = 'script'; // Default to 'script'
            if (activeLink) {
                activeLink.classList.add('active');
                scriptPath = activeLink.getAttribute('data-script'); // Can be null
                scriptType = activeLink.getAttribute('data-script-type') || 'script';
            }
            
            const cssPath = activeLink ? activeLink.dataset.css : null;
            loadPage(page, scriptPath, scriptType, cssPath);
        }

        // Handle navigation link clicks
        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                
                // Check if this page is already active
                if (this.classList.contains('active')) {
                    return; // Don't navigate if already on this page
                }
                
                navigateTo(page);
            });
        });

        // Handle browser back/forward buttons
        window.addEventListener('popstate', (event) => {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page') || 'homepage';
            navigateTo(page, {}, false); // Don't push state on popstate
        });

        // Initial page load on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page') || 'homepage';
            navigateTo(page, {}, false); // Initial load doesn't need to push state
            initializeSidebar();
        });

        // Listen for custom navigation events from iframes (if any)
        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === 'navigate') {
                navigateTo(event.data.page);
            }
        });

        // Make navigateTo globally available for child pages
        window.navigateTo = navigateTo;
    </script>
</body>
