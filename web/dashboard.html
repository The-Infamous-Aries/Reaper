    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/js/page_loader.js?v=20250327"></script>
    <script>
        // Block Cloudflare analytics and other unwanted scripts
        (function() {
            const originalAppendChild = Element.prototype.appendChild;
            const originalInsertBefore = Node.prototype.insertBefore;
            
            function blockAnalyticsScript(element) {
                if (element.tagName === 'SCRIPT') {
                    const src = element.src || '';
                    const content = element.textContent || '';
                    
                    // Block Cloudflare Insights and other analytics
                    if (src.includes('cloudflareinsights.com') || 
                        src.includes('beacon.min.js') ||
                        content.includes('cloudflareinsights') ||
                        content.includes('__cfBeacon')) {
                        console.log('Blocked analytics script:', src || 'inline script');
                        return true;
                    }
                }
                return false;
            }
            
            Element.prototype.appendChild = function(element) {
                if (blockAnalyticsScript(element)) {
                    return element; // Return the element but don't actually append it
                }
                return originalAppendChild.call(this, element);
            };
            
            Node.prototype.insertBefore = function(newNode, referenceNode) {
                if (blockAnalyticsScript(newNode)) {
                    return newNode; // Return the element but don't actually insert it
                }
                return originalInsertBefore.call(this, newNode, referenceNode);
            };
            
            console.log('Analytics blocking initialized');
        })();
    </script>
    <script>
        const contentDiv = document.getElementById('content');
        const navLinks = document.querySelectorAll('.nav-link');

        // Removed fetchBotInfo function - bot avatar/banner no longer displayed on dashboard

        function initializeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            const sidebarCollapseToggle = document.querySelector('.sidebar-collapse-toggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            
            if (!sidebar) return;
            
            // Mobile sidebar toggle
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-hidden');
                    if (sidebarOverlay) {
                        sidebarOverlay.classList.toggle('active');
                    }
                });
            }
            
            // Desktop sidebar collapse
            if (sidebarCollapseToggle) {
                sidebarCollapseToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
                });
                
                // Restore collapsed state from localStorage
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebar.classList.add('collapsed');
                }
            }
            
            // Overlay click to close mobile sidebar
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    sidebar.classList.add('mobile-hidden');
                    sidebarOverlay.classList.remove('active');
                });
            }
            
            console.log('Sidebar initialized successfully');
        }

        let currentLoadedPage = null;

        function loadPage(page, scriptPath, scriptType, cssPath) {
            let pageFile = page.split('?')[0];
            if (!pageFile.endsWith('.html')) {
                pageFile += '.html';
            }

            if (typeof scriptManager !== 'undefined') {
                scriptManager.unloadAll();
            }

            currentLoadedPage = pageFile;

            if (cssPath && typeof scriptManager !== 'undefined') {
                scriptManager.loadCSS(cssPath);
            }

            const cacheBuster = `?v=${new Date().getTime()}`;
            fetch(`/Pages/${pageFile}${cacheBuster}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(html => {
                    contentDiv.innerHTML = html;

                    const dispatchPageLoadedEvent = () => {
                        const pageLoadedEvent = new CustomEvent('dashboardPageLoaded', {
                            detail: { page: pageFile }
                        });
                        document.dispatchEvent(pageLoadedEvent);
                        console.log(`Dispatched dashboardPageLoaded for ${pageFile}`);
                    };

                    function runInlineScripts(callback) {
                        const scripts = Array.from(contentDiv.querySelectorAll("script"));
                        function runNext(index) {
                            if (index >= scripts.length) {
                                if (callback) callback();
                                return;
                            }
                            const oldScript = scripts[index];
                            const newScript = document.createElement("script");
                            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                            runNext(index + 1);
                        }
                        runNext(0);
                    }

                    runInlineScripts(() => {
                        if (scriptPath && typeof scriptManager !== 'undefined') {
                            scriptManager.loadScript(scriptPath, scriptType, dispatchPageLoadedEvent);
                        } else {
                            dispatchPageLoadedEvent();
                        }
                    });
                })
                .catch(error => {
                    console.warn(`Error loading page: ${pageFile}`, error);
                    contentDiv.innerHTML = `<div class="alert alert-danger">Error loading page: ${pageFile}</div>`;
                    currentLoadedPage = null;
                });
        }

        function navigateTo(page, params = {}, pushState = true) {
            if (pushState) {
                const url = new URL(window.location);
                url.searchParams.set('page', page);

                // Clean up old params and add new ones
                const oldParams = Array.from(url.searchParams.keys());
                oldParams.forEach(key => {
                    if(key !== 'page') url.searchParams.delete(key);
                });
                for(const [key, value] of Object.entries(params)){
                    url.searchParams.set(key, value);
                }
                history.pushState({page: page, params: params}, "", url.toString());
            }
            
            // Update active link and get the script path
            navLinks.forEach(l => l.classList.remove('active'));
            const activeLink = document.querySelector(`.nav-link[data-page='${page}']`);
            let scriptPath = null;
            let scriptType = 'script'; // Default to 'script'
            if (activeLink) {
                activeLink.classList.add('active');
                scriptPath = activeLink.getAttribute('data-script'); // Can be null
                scriptType = activeLink.getAttribute('data-script-type') || 'script';
            }
            
            const cssPath = activeLink ? activeLink.dataset.css : null;
            loadPage(page, scriptPath, scriptType, cssPath);
        }

        // Handle navigation link clicks -- use delegation so dynamically shown links work
        document.querySelector('nav.sidebar ul.nav, .sidebar ul.nav').addEventListener('click', function(e) {
            const link = e.target.closest('.nav-link[data-page]');
            if (!link) return;
            if (link.id === 'discord-login-link') return;
            e.preventDefault();
            const page = link.getAttribute('data-page');
            if (link.classList.contains('active')) return;
            // Pass script/css directly from the clicked link so hidden links work
            const scriptPath = link.getAttribute('data-script') || null;
            const cssPath = link.getAttribute('data-css') || null;
            const scriptType = link.getAttribute('data-script-type') || 'script';
            // Update active state
            navLinks.forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            history.pushState({page}, '', '?page=' + page);
            loadPage(page, scriptPath, scriptType, cssPath);
        });

        // Handle browser back/forward buttons
        window.addEventListener('popstate', (event) => {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page') || 'homepage';
            navigateTo(page, {}, false); // Don't push state on popstate
        });

        // Initial page load on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page') || 'homepage';
            navigateTo(page, {}, false); // Initial load doesn't need to push state
            initializeSidebar();
        });

        // Listen for custom navigation events from iframes (if any)
        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === 'navigate') {
                navigateTo(event.data.page);
            }
        });

        // Make navigateTo globally available for child pages
        window.navigateTo = navigateTo;

        // Fetch and display user info on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/discord/user')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Not logged in');
                    }
                    return response.json();
                })
                .then(user => {
                    document.getElementById('login-button').style.display = 'none';
                    // document.getElementById('logout-button').style.display = 'block';
                    const userProfile = document.getElementById('user-profile');
                    userProfile.style.display = 'block';
                    document.getElementById('user-name').textContent = user.global_name || user.username;
                    const avatarImg = document.getElementById('user-avatar');
                    // Use our server-side proxy � avoids CSP/CDN issues and auto-refreshes stale hashes
                    avatarImg.src = `/api/discord/avatar?_=${user.id}`;
                    avatarImg.onerror = () => {
                        avatarImg.onerror = null;
                        avatarImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                    };

                    updatePetLink();

                    userProfile.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (confirm('Are you sure you want to sign out?')) {
                            window.location.href = '/api/discord/logout';
                        }
                    });
                })
                .catch(error => {
                    console.log('User not logged in:', error.message);
                    document.getElementById('login-button').style.display = 'block';
                    // document.getElementById('logout-button').style.display = 'none';
                    document.getElementById('user-profile').style.display = 'none';
                    
                    // Still show pet link for testing/adoption
                    updatePetLink();
                });
        });

        function updatePetLink() {
            const myPetLink = document.getElementById('my-pet-link');
            if (!myPetLink) return;

            // Always show the link - users may need to log in and adopt
            myPetLink.style.display = 'block';

            fetch('/api/user/pet')
                .then(response => {
                    if (!response.ok) return null; // 404 = no pet, that's fine
                    return response.json();
                })
                .then(data => {
                    if (data && data.has_pet && data.species) {
                        const link = myPetLink.querySelector('a');
                        if (link) {
                            const petEmoji = `/static/Emojis/Pets/${data.species}.png`;
                            link.innerHTML = `<img src="${petEmoji}" alt="My Pet" style="width: 20px; height: 20px; margin-right: 8px;" onerror="this.src='/static/Emojis/Pets/Basic.png'"> ${data.name}`;
                        }
                    }
                    // If no pet, link stays visible with default "My Pet" label
                })
                .catch(() => {
                    // Network error – link stays visible, just keep default label
                });
        };

        // --- Nation Link Bar ---
        const LS_KEY = "pnw_linked_nation";

        function showLinkedNation(nation) {
            document.getElementById("nation-input-view").style.display = "none";
            document.getElementById("nation-linked-view").style.display = "block";
            document.getElementById("nation-linked-name").textContent = nation.nation_name || `Nation #${nation.nation_id}`;
            const flagImg = document.getElementById("nation-flag-img");
            if (nation.flag) {
                flagImg.src = nation.flag;
                flagImg.style.display = "inline-block";
            } else {
                flagImg.style.display = "none";
            }
            loadNationRanks(nation.nation_name || "");
        }

        function showNationInput() {
            document.getElementById("nation-linked-view").style.display = "none";
            document.getElementById("nation-input-view").style.display = "block";
            document.getElementById("nation-link-error").style.display = "none";
        }

        function setNationLinkError(msg) {
            const el = document.getElementById("nation-link-error");
            el.textContent = msg;
            el.style.display = msg ? "block" : "none";
        }

        async function initNationLinkBar() {
            // 1. Try server session first
            try {
                const res = await fetch("/api/discord/linked-nation");
                if (res.ok) {
                    const data = await res.json();
                    if (data.linked) {
                        // Sync to localStorage too
                        localStorage.setItem(LS_KEY, JSON.stringify(data));
                        showLinkedNation(data);
                        return;
                    }
                }
            } catch (_) {}

            // 2. Fall back to localStorage (user not signed in via Discord)
            const stored = localStorage.getItem(LS_KEY);
            if (stored) {
                try {
                    const nation = JSON.parse(stored);
                    if (nation && nation.nation_id) {
                        // Re-sync to server session silently
                        fetch("/api/discord/link-nation", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(nation),
                        }).catch(() => {});
                        showLinkedNation(nation);
                        return;
                    }
                } catch (_) {}
            }

            showNationInput();
        }

        document.getElementById("nation-link-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("nation-id-input");
            const nationId = input.value.trim();
            if (!nationId || !/^\d+$/.test(nationId)) {
                setNationLinkError("Enter a valid numeric Nation ID.");
                return;
            }
            setNationLinkError("");
            const btn = e.target.querySelector("button");
            btn.textContent = "...";
            btn.disabled = true;

            try {
                // Fetch nation info from PnW
                const infoRes = await fetch(`/api/pnw/nation/${nationId}`);
                if (!infoRes.ok) {
                    const err = await infoRes.json().catch(() => ({}));
                    throw new Error(err.detail || "Nation not found.");
                }
                const nation = await infoRes.json();
                const payload = {
                    nation_id: String(nation.id || nationId),
                    nation_name: nation.nation_name || "",
                    flag: nation.flag || "",
                };

                // Save to server session
                await fetch("/api/discord/link-nation", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                // Save to localStorage for persistence without Discord login
                localStorage.setItem(LS_KEY, JSON.stringify(payload));

                input.value = "";
                showLinkedNation(payload);
            } catch (err) {
                setNationLinkError(err.message || "Failed to link nation.");
            } finally {
                btn.textContent = "Link";
                btn.disabled = false;
            }
        });

        document.getElementById("nation-unlink-btn").addEventListener("click", async () => {
            await fetch("/api/discord/link-nation", { method: "DELETE" }).catch(() => {});
            localStorage.removeItem(LS_KEY);
            stopRankTicker();
            showNationInput();
        });

        document.addEventListener("DOMContentLoaded", initNationLinkBar);

        // --- Rank Ticker ---
        let _rankTickerTimer = null;
        let _rankTickerIndex = 0;
        let _rankSlides = [];

        function stopRankTicker() {
            if (_rankTickerTimer) { clearInterval(_rankTickerTimer); _rankTickerTimer = null; }
            const ticker = document.getElementById("nation-rank-ticker");
            if (ticker) { ticker.style.display = "none"; ticker.innerHTML = ""; }
            _rankSlides = [];
        }

        function buildRankSlides(data) {
            const slides = [];
            (data.periods || []).forEach(({ label, ranks }) => {
                (ranks || []).forEach(r => {
                    if (r.rank <= 3) {
                        slides.push({
                            period: label,
                            label: r.category_label,
                            rank: r.rank,
                            total: r.total,
                            prefix: r.prefix || "",
                        });
                    }
                });
            });
            return slides;
        }

        function showRankSlide(ticker, index) {
            const slide = _rankSlides[index];
            const emojiSrc = slide.prefix
                ? `/static/Emojis/Leaderboards/${slide.rank}${slide.prefix}.png`
                : '';
            const emojiHtml = emojiSrc
                ? `<img src="${emojiSrc}" alt="#${slide.rank}" style="width:1rem;height:1rem;object-fit:contain;vertical-align:middle;flex-shrink:0;">`
                : '';
            ticker.innerHTML = `<span class="rank-slide visible" style="display:flex;align-items:center;gap:0.3rem;min-width:0;flex-wrap:nowrap;">
                ${emojiHtml}
                <span class="rank-period" style="flex-shrink:0;">${slide.period}</span>
                <span class="rank-label" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${slide.label}</span>
            </span>`;
        }

        async function loadNationRanks(nationName) {
            stopRankTicker();
            if (!nationName) return;
            try {
                const res = await fetch(`/api/watch/nation-ranks/${encodeURIComponent(nationName)}`);
                if (!res.ok) return;
                const data = await res.json();
                _rankSlides = buildRankSlides(data);
                if (_rankSlides.length === 0) return;
                const ticker = document.getElementById("nation-rank-ticker");
                ticker.style.display = "block";
                _rankTickerIndex = 0;
                showRankSlide(ticker, _rankTickerIndex);
                if (_rankSlides.length > 1) {
                    _rankTickerTimer = setInterval(() => {
                        _rankTickerIndex = (_rankTickerIndex + 1) % _rankSlides.length;
                        showRankSlide(ticker, _rankTickerIndex);
                    }, 4000);
                }
            } catch (_) {}
        }
        // --- End Nation Link Bar ---
    </script>
