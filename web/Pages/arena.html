<link rel="stylesheet" href="/css/arena.css">
<link rel="stylesheet" href="/css/casino_lobby.css">

<div class="container-fluid" id="arena-root">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-1">
        <div>
            <div class="arena-title">⚔️ The Floor</div>
            <div class="arena-subtitle">Pick any room · Battle or gamble · Watch what's happening live</div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="arena-live-badge"><span class="arena-live-dot"></span>LIVE</span>
            <span class="arena-spectators" id="arena-online">— online</span>
        </div>
    </div>

    <hr class="arena-divider">

    <!-- Loading -->
    <div id="arena-loading" class="text-center py-4">
        <div class="spinner-border" style="color:var(--gold-primary)" role="status"></div>
        <p class="mt-2" style="color:var(--text-secondary);font-size:0.82rem">Connecting...</p>
    </div>

    <!-- Login prompt -->
    <div id="arena-login-prompt" style="display:none" class="text-center py-5">
        <div style="font-size:2rem;margin-bottom:8px">🔒</div>
        <div style="color:var(--text-secondary);font-size:0.9rem">Sign in with Discord to join.</div>
        <a href="/api/discord/login" class="arena-btn mt-3" style="display:inline-block">Login with Discord</a>
    </div>

    <!-- Main layout -->
    <div id="arena-main" style="display:none">

        <!-- Unified room grid -->
        <div class="unified-room-grid" id="unified-grid"></div>

        <!-- Shared panel -->
        <div class="arena-center-panel" id="shared-panel-area">
            <div class="arena-panel" style="text-align:center;padding:40px 18px">
                <div style="font-size:2.5rem;opacity:0.25">⚔️🎰</div>
                <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:10px">Pick a room above to battle or gamble.</div>
            </div>
        </div>

    </div>

</div>

<script src="/js/arena.js"></script>
