<link rel="stylesheet" href="/css/library.css">
<br>
<!-- Seal Icons Container -->
<div class="container-fluid mb-4">
    <div class="row">
        <div class="col-12 d-flex justify-content-center align-items-center gap-4">
            <div class="standalone-seal" data-doc="FAFO Doctrine" data-bs-toggle="tooltip" data-bs-placement="top" title="The FAFO">
                <i class="fa-solid fa-skull"></i>
            </div>
            <div class="standalone-seal" data-doc="Basic Building Guide" data-bs-toggle="tooltip" data-bs-placement="top" title="Building">
                <i class="fa-solid fa-house"></i>
            </div>
            <div class="standalone-seal" data-doc="Beige Cycle Guide" data-bs-toggle="tooltip" data-bs-placement="top" title="Cycling">
                <i class="fa-solid fa-infinity"></i>
            </div>
            <div class="standalone-seal" data-doc="Weapon Efficiency Guide" data-bs-toggle="tooltip" data-bs-placement="top" title="WMD">
                <i class="fa-solid fa-radiation"></i>
            </div>
            <div class="standalone-seal" data-doc="Snipe" data-bs-toggle="tooltip" data-bs-placement="top" title="Sniping">
                <i class="fa-solid fa-crosshairs"></i>
            </div>
        </div>
    </div>
</div>

<!-- Main Content Area -->
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="library-content-wrapper">
                <div class="large-scroll-container" id="large-scroll-container">
                    <div class="large-scroll" id="large-scroll">
                        <div class="large-scroll-header">
                            <h2 class="large-scroll-title">ðŸ“œ Ancient Knowledge</h2>
                            <div class="large-scroll-seal"><i class="fa-solid fa-scroll"></i></div>
                        </div>
                        <div class="large-scroll-content" id="large-scroll-content">
                            <div class="scroll-placeholder">
                                <div class="scroll-icon-large"><i class="fa-solid fa-scroll"></i></div>
                                <h3>Select a Scroll</h3>
                                <p>Click on a scroll seal above to reveal its contents</p>
                            </div>
                        </div>
                        <div class="large-scroll-status-indicator" id="scroll-indicator">
                            <div class="scroll-status"><i class="fa-solid fa-scroll"></i><span>Select a scroll to reveal</span></div>
                            <div class="scroll-decoration"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="/js/access_guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    document.addEventListener('dashboardPageLoaded', function(event) {
        if (event.detail.page !== 'library.html') {
            return; // Only run on the library page
        }

        console.log("Library page script executing...");

        let currentlyOpenDoc = null;

        function getStampIcon(docName) {
            const docNameLower = docName.toLowerCase();
            if (docNameLower.includes('fafo')) return 'fa-skull';
            if (docNameLower.includes('building')) return 'fa-house';
            if (docNameLower.includes('cycling')) return 'fa-infinity';
            if (docNameLower.includes('weapon')) return 'fa-radiation';
            if (docNameLower.includes('snipe')) return 'fa-crosshairs';
            return 'fa-scroll';
        }

        document.querySelectorAll('.standalone-seal').forEach(seal => {
            seal.addEventListener('click', async function(e) {
                e.preventDefault();
                const docName = this.dataset.doc;
                
                document.querySelectorAll('.standalone-seal').forEach(s => s.classList.remove('active'));
                this.classList.add('active');

                await loadDocument(docName);
                currentlyOpenDoc = docName;
            });
        });

        async function loadDocument(docName) {
            const largeScrollContent = document.getElementById('large-scroll-content');
            largeScrollContent.innerHTML = '<div class="loading text-center"><h3><i class="fa-solid fa-spinner fa-spin"></i> Loading scroll...</h3></div>';

            try {
                const response = await fetch(`/api/library/${encodeURIComponent(docName)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const markdown = await response.text();
                const parsedContent = marked.parse(markdown);
                const sealIcon = getStampIcon(docName);
                
                const officialSection = `
                    <div class="scroll-official-section">
                        <div class="scroll-signature">
                            <div class="signature-title">Keeper of the Reaper</div>
                            <div class="signature-name">Aries</div>
                        </div>
                        <div class="wax-seal">
                            <i class="fa-solid ${sealIcon} wax-seal-icon"></i>
                        </div>
                    </div>
                `;
                
                largeScrollContent.innerHTML = parsedContent + officialSection;
                document.querySelector('.large-scroll-title').textContent = `ðŸ“œ ${docName}`;
                
            } catch (error) {
                largeScrollContent.innerHTML = `<div class="error"><h3><i class="fa-solid fa-exclamation-triangle"></i> Error</h3><p>${error.message}</p></div>`;
            }
        }

        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>

<style>
.standalone-seal {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #4a0101;
    box-shadow: 
        0 4px 8px rgba(0,0,0,0.5),
        inset 0 2px 0 rgba(255,255,255,0.2),
        inset 0 -2px 0 rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: var(--seal-red);
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    background: #f5eeda;
}

.standalone-seal::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 2px;
    border-radius: 50%;
    background: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.3) 0%, transparent 50%);
}

.standalone-seal:hover {
    transform: rotate(20deg) scale(1.15);
    box-shadow: 
        0 8px 16px rgba(0,0,0,0.6),
        inset 0 3px 0 rgba(255,255,255,0.3),
        inset 0 -3px 0 rgba(0,0,0,0.2),
        0 0 20px var(--gold-glow);
    color: #fff;
    background: var(--seal-red);
}

.standalone-seal.active {
    border-color: var(--gold-primary);
    border-width: 3px;
    color: var(--bg-primary);
    transform: scale(1.2);
    box-shadow: 
        0 8px 16px rgba(0,0,0,0.6),
        inset 0 3px 0 rgba(255,255,255,0.4),
        inset 0 -3px 0 rgba(0,0,0,0.1),
        0 0 25px var(--gold-glow);
    background: var(--gold-primary);
}

.large-scroll-title {
    font-family: 'Cinzel', serif;
    color: #000000;
    font-size: 2rem;
    font-weight: 700;
    margin: 0;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
}

.scroll-placeholder h3, .scroll-placeholder p {
    color: #000000;
}
</style>
