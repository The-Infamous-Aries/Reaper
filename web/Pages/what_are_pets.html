<link rel="stylesheet" href="/css/mypet.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* ── Layout ──────────────────────────────────────────────────────────────── */
#wap-wrap { display:flex; gap:20px; align-items:flex-start; }

#wap-nav {
    position: sticky;
    top: 12px;
    width: 172px;
    flex-shrink: 0;
    background: rgba(15,15,15,0.82);
    border: 1px solid rgba(255,215,0,0.18);
    border-radius: 10px;
    padding: 10px 0;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    scrollbar-width: thin;
}
#wap-nav a {
    display: block;
    padding: 6px 14px;
    font-size: 0.73rem;
    color: var(--text-secondary);
    text-decoration: none;
    border-left: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#wap-nav a:hover  { color: var(--gold-secondary); background: rgba(255,215,0,0.05); }
#wap-nav a.active { color: var(--gold-primary); border-left-color: var(--gold-primary); background: rgba(255,215,0,0.07); font-weight:600; }
#wap-nav .nav-section {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255,215,0,0.4);
    padding: 8px 14px 3px;
    text-transform: uppercase;
}

#wap-content { flex: 1; min-width: 0; }

/* ── Markdown rendered content ───────────────────────────────────────────── */
#wap-body h2 {
    color: var(--gold-primary);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    border-bottom: 1px solid rgba(255,215,0,0.18);
    padding-bottom: 0.5rem;
    margin: 1.6rem 0 0.9rem;
    scroll-margin-top: 12px;
}
#wap-body h3 {
    color: var(--gold-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    margin: 1rem 0 0.35rem;
}
#wap-body p {
    color: var(--text-secondary);
    font-size: 0.8rem;
    line-height: 1.65;
    margin-bottom: 0.5rem;
}
#wap-body strong { color: var(--text-primary); }
#wap-body em { color: var(--gold-secondary); font-style: normal; }

#wap-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.76rem;
    margin: 0.5rem 0 0.9rem;
}
#wap-body table th {
    color: var(--gold-primary);
    font-weight: 600;
    padding: 5px 9px;
    border-bottom: 1px solid rgba(255,215,0,0.18);
    text-align: left;
}
#wap-body table td {
    color: var(--text-secondary);
    padding: 4px 9px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: top;
}
#wap-body table tr:last-child td { border-bottom: none; }
#wap-body table tr:hover td { background: rgba(255,215,0,0.03); }

#wap-body code {
    display: block;
    background: rgba(0,0,0,0.38);
    border: 1px solid rgba(255,215,0,0.16);
    border-radius: 6px;
    padding: 7px 13px;
    font-family: monospace;
    font-size: 0.76rem;
    color: var(--gold-secondary);
    margin: 0.45rem 0;
    white-space: pre-wrap;
}
#wap-body p code, #wap-body li code {
    display: inline;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.74rem;
}

#wap-body blockquote {
    border-left: 3px solid #2ecc71;
    background: rgba(46,204,113,0.07);
    border-radius: 0 6px 6px 0;
    padding: 7px 11px;
    font-size: 0.74rem;
    color: #a8e6cf;
    margin: 0.5rem 0;
}
#wap-body blockquote p { color: #a8e6cf; margin: 0; font-size: 0.74rem; }
#wap-body blockquote strong { color: #fff; }

/* Warning blockquotes — paragraphs starting with Warning: */
#wap-body blockquote.warn,
#wap-body blockquote.warn p {
    border-left-color: #e74c3c;
    background: rgba(231,76,60,0.07);
    color: #ffb3b3;
}

#wap-body ul, #wap-body ol {
    color: var(--text-secondary);
    font-size: 0.8rem;
    line-height: 1.65;
    padding-left: 1.4rem;
    margin-bottom: 0.5rem;
}
#wap-body li { margin-bottom: 0.2rem; }

#wap-body hr {
    border: none;
    border-top: 1px solid rgba(255,215,0,0.12);
    margin: 1.6rem 0 0;
}

/* ── Section cards ───────────────────────────────────────────────────────── */
.wap-section {
    background: linear-gradient(145deg, rgba(20,20,20,0.88), rgba(38,38,38,0.88));
    border: 1px solid rgba(255,215,0,0.22);
    border-radius: 12px;
    padding: 1.2rem 1.6rem 0.8rem;
    margin-bottom: 1.4rem;
    scroll-margin-top: 12px;
    transition: box-shadow 0.25s;
}
.wap-section:hover { box-shadow: 0 4px 24px rgba(255,215,0,0.09); }

/* ── Loading / error states ──────────────────────────────────────────────── */
#wap-loading {
    color: var(--text-secondary);
    font-size: 0.85rem;
    padding: 2rem;
    text-align: center;
}
#wap-error {
    display: none;
    color: #ffb3b3;
    font-size: 0.82rem;
    padding: 1rem;
    background: rgba(231,76,60,0.07);
    border-left: 3px solid #e74c3c;
    border-radius: 0 6px 6px 0;
}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:680px){
    #wap-wrap { flex-direction:column; }
    #wap-nav  { position:static; width:100%; max-height:none; display:flex; flex-wrap:wrap; padding:6px 8px; gap:2px; }
    #wap-nav .nav-section { display:none; }
    #wap-nav a { border-left:none; border-bottom:2px solid transparent; padding:4px 10px; border-radius:20px; }
    #wap-nav a.active { border-bottom-color:var(--gold-primary); }
}
</style>

<div class="container-fluid" style="max-width:1060px;padding-bottom:3rem">
<div id="wap-wrap">

<!-- ── Sticky nav (built dynamically from headings) ───────────────────────── -->
<nav id="wap-nav">
    <div id="wap-nav-loading" style="padding:10px 14px;font-size:0.72rem;color:rgba(255,215,0,0.4)">Loading…</div>
</nav>

<!-- ── Content ────────────────────────────────────────────────────────────── -->
<div id="wap-content">
    <div id="wap-loading">⏳ Loading pet guide…</div>
    <div id="wap-error">Failed to load the pet guide. Please refresh the page.</div>
    <div id="wap-body"></div>
</div>

</div><!-- end wap-wrap -->
</div><!-- end container -->

<script>
(function () {

    // ── Nav section labels keyed by the first word(s) of each h2 ─────────────
    const NAV_SECTIONS = {
        'Overview':         'Basics',
        'Stats':            'Basics',
        'Leveling':         'Basics',
        'Specialization':   'Basics',
        'Rank':             'Basics',
        'My Pet':           'Basics',
        'How Combat':       'Combat',
        'The Three':        'Combat',
        'The Charge':       'Combat',
        'Type &':           'Combat',
        'Equipment':        'Growth',
        'Activities':       'Growth',
        'Keys':             'Growth',
        'Tasks':            'Growth',
        'The Floor':        'Multiplayer',
        'The Pet Casino':   'Casino',
        'Slot':             'Casino',
        'Pet Races':        'Casino',
        'Blackjack':        'Casino',
        'Craps':            'Casino',
        'Texas':            'Casino',
        'Mini-Games':       'Casino',
        'Survivor':         'Other',
        'Pet Stock':        'Other',
    };

    const NAV_ICONS = {
        'Overview':         '🐾',
        'Stats':            '📊',
        'Leveling':         '⬆️',
        'Specialization':   '⭐',
        'Rank':             '🏅',
        'My Pet':           '🐾',
        'How Combat':       '⚔️',
        'The Three':        '🎮',
        'The Charge':       '⚡',
        'Type &':           '🔥',
        'Equipment':        '🎒',
        'Activities':       '🗺️',
        'Keys':             '🗝️',
        'Tasks':            '🗡️',
        'The Floor':        '🏟️',
        'The Pet Casino':   '🎰',
        'Slot':             '🎰',
        'Pet Races':        '🏁',
        'Blackjack':        '🃏',
        'Craps':            '🎲',
        'Texas':            '♠️',
        'Mini-Games':       '🎮',
        'Survivor':         '⚔️',
        'Pet Stock':        '📈',
    };

    function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function getNavKey(title) {
        for (const key of Object.keys(NAV_SECTIONS)) {
            if (title.startsWith(key)) return key;
        }
        return null;
    }

    function buildNav(headings) {
        const nav = document.getElementById('wap-nav');
        nav.innerHTML = '';
        let currentSection = null;

        headings.forEach(function (h) {
            // The section wrapper div carries the id (moved there by wrapSections).
            // Walk up to find it.
            const sectionEl = h.closest('.wap-section[id]');
            const sectionId = sectionEl ? sectionEl.id : '';
            if (!sectionId) return;

            const key = getNavKey(h.textContent.trim());
            const section = key ? NAV_SECTIONS[key] : null;
            const icon   = key ? (NAV_ICONS[key] || '') : '';

            if (section && section !== currentSection) {
                const div = document.createElement('div');
                div.className = 'nav-section';
                div.textContent = section;
                nav.appendChild(div);
                currentSection = section;
            }

            const a = document.createElement('a');
            a.href = 'javascript:void(0)';
            a.dataset.target = sectionId;
            a.textContent = (icon ? icon + ' ' : '') + h.textContent.trim();
            nav.appendChild(a);
        });
    }

    function applyWarnClass() {
        // Turn blockquotes whose first strong text starts with "Warning" into red style
        document.querySelectorAll('#wap-body blockquote').forEach(function (bq) {
            const strong = bq.querySelector('strong');
            if (strong && strong.textContent.trim().startsWith('Warning')) {
                bq.classList.add('warn');
            }
        });
    }

    function wrapSections(headings) {
        // Wrap each h2 and its following siblings (until next h2) in a .wap-section card
        const body = document.getElementById('wap-body');
        const children = Array.from(body.childNodes);
        let current = null;

        children.forEach(function (node) {
            if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'H2') {
                current = document.createElement('div');
                current.className = 'wap-section';
                current.id = node.id;
                node.removeAttribute('id'); // id moves to wrapper
                body.insertBefore(current, node);
                current.appendChild(node);
            } else if (node.tagName === 'HR') {
                current = null; // HR acts as section separator — don't include it
                if (node.parentNode) node.parentNode.removeChild(node);
            } else if (current) {
                current.appendChild(node);
            }
        });
    }

    async function loadGuide() {
        const body    = document.getElementById('wap-body');
        const loading = document.getElementById('wap-loading');
        const error   = document.getElementById('wap-error');

        try {
            const res = await fetch('/api/library/Pet%20Guide');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const md = await res.text();

            // Render markdown
            body.innerHTML = marked.parse(md);

            // Assign IDs to all h2 headings
            const headings = body.querySelectorAll('h2');
            headings.forEach(function (h) {
                h.id = slugify(h.textContent.trim());
            });

            applyWarnClass();
            wrapSections(headings);
            buildNav(document.querySelectorAll('.wap-section h2'));

            loading.style.display = 'none';
            initScrollSpy();

        } catch (e) {
            loading.style.display = 'none';
            error.style.display = 'block';
            console.error('Pet guide load error:', e);
        }
    }

    function initScrollSpy() {
        const sections = document.querySelectorAll('.wap-section[id]');
        const navLinks = document.querySelectorAll('#wap-nav a[data-target]');

        // The SPA loads content inside .content-wrapper / .main-content.
        // scrollIntoView works regardless of which element is scrolling,
        // but to read scroll position we need the actual scrolling ancestor.
        function getScrollParent() {
            let el = document.getElementById('wap-body');
            while (el && el !== document.body) {
                const style = window.getComputedStyle(el);
                if (/(auto|scroll)/.test(style.overflow + style.overflowY)) return el;
                el = el.parentElement;
            }
            return window;
        }

        function getScrollTop() {
            const sp = getScrollParent();
            return sp === window ? (window.scrollY || window.pageYOffset) : sp.scrollTop;
        }

        function getActive() {
            const scrollTop = getScrollTop();
            let best = null;
            sections.forEach(function (sec) {
                const sp = getScrollParent();
                const containerTop = sp === window ? 0 : sp.getBoundingClientRect().top;
                const secTop = sec.getBoundingClientRect().top - containerTop + scrollTop - 20;
                if (scrollTop >= secTop) best = sec.id;
            });
            return best;
        }

        function updateNav() {
            const active = getActive();
            navLinks.forEach(function (a) {
                if (a.dataset.target === active) {
                    a.classList.add('active');
                    const nav = document.getElementById('wap-nav');
                    if (nav && (a.offsetTop < nav.scrollTop || a.offsetTop + a.offsetHeight > nav.scrollTop + nav.clientHeight)) {
                        a.scrollIntoView({ block: 'nearest' });
                    }
                } else {
                    a.classList.remove('active');
                }
            });
        }

        // Listen on both window and any scrollable ancestor
        window.addEventListener('scroll', updateNav, { passive: true });
        const sp = getScrollParent();
        if (sp !== window) sp.addEventListener('scroll', updateNav, { passive: true });
        updateNav();

        navLinks.forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                const target = document.getElementById(a.dataset.target);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // Update active state immediately on click
                    navLinks.forEach(l => l.classList.remove('active'));
                    a.classList.add('active');
                }
            });
        });
    }

    loadGuide();
})();
</script>
