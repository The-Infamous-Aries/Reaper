<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h2 class="text-primary mb-4">🐾 Pet Information</h2>
            
            <!-- Sorting Controls -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Sort Pets</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Sort by:</label>
                            <select id="sortBy" class="form-select">
                                <option value="name">Name (A-Z)</option>
                                <option value="att">Attack (ATT)</option>
                                <option value="def">Defense (DEF)</option>
                                <option value="int">Intelligence (INT)</option>
                                <option value="dex">Dexterity (DEX)</option>
                                <option value="hap">Happiness (HAP)</option>
                                <option value="ene">Energy (ENE)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Order:</label>
                            <div class="btn-group w-100" role="group">
                                <button type="button" id="sortAsc" class="btn btn-primary active">
                                    <i class="bi bi-arrow-up"></i> Ascending
                                </button>
                                <button type="button" id="sortDesc" class="btn btn-primary">
                                    <i class="bi bi-arrow-down"></i> Descending
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pet Cards Container -->
            <div id="petContainer" class="row">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.pet-card {
    transition: all 0.3s ease;
    height: 100%;
}

.pet-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px var(--gold-glow);
}

.pet-emoji {
    width: 64px;
    height: 64px;
    object-fit: contain;
}

.stat-emoji {
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
    color: var(--text-secondary);
    font-weight: 500;
}

.stat-item span {
    color: #e0e0e0;
}

.spec-badge {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
    color: var(--bg-primary);
    font-weight: bold;
    margin: 2px;
    box-shadow: 0 0 10px var(--gold-glow);
    border: 1px solid var(--gold-primary);
}

.action-item {
    background-color: rgba(20, 20, 20, 0.6);
    border: 1px solid var(--gold-primary);
    border-radius: 0.5rem;
    padding: 0.5rem;
    margin-bottom: 0.5rem;
}

.action-type {
    color: var(--gold-primary);
    font-weight: bold;
    font-size: 0.9rem;
}

.action-name {
    color: var(--text-primary);
    font-size: 0.9rem;
}

/* Specialization glow effect for stats */
.stat-special {
    text-shadow: 0 0 8px var(--gold-primary);
    color: var(--gold-secondary) !important;
    font-weight: 700;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 8px var(--gold-primary);
    }
    to {
        text-shadow: 0 0 12px var(--gold-primary), 0 0 15px var(--gold-glow);
    }
}

/* Lighten description text */
.pet-description {
    color: #d0d0d0;
    line-height: 1.5;
}

/* Enhanced card body text */
.card-body {
    color: var(--text-secondary);
}

.card-body h6 {
    color: var(--gold-primary);
    text-shadow: 0 0 5px var(--gold-glow);
}
</style>

<script>
var petsData = [];
var currentSort = 'name';
var currentOrder = 'asc';

// Load pet data
async function loadPetsData() {
    try {
        const response = await fetch('/api/pets-data');
        const data = await response.json();
        petsData = Object.entries(data.Pets).map(([name, pet]) => ({
            name,
            ...pet,
            totalStats: Object.values(pet.Stats).reduce((a, b) => a + b, 0)
        }));
        renderPets();
    } catch (error) {
        console.error('Error loading pets data:', error);
        document.getElementById('petContainer').innerHTML = 
            '<div class="col-12"><div class="alert alert-danger">Error loading pet data. Please try again later.</div></div>';
    }
}

// Render pets based on current sort
function renderPets() {
    const container = document.getElementById('petContainer');
    
    // Sort pets
    const sortedPets = [...petsData].sort((a, b) => {
        let aVal, bVal;
        
        switch (currentSort) {
            case 'name':
                aVal = a.name.toLowerCase();
                bVal = b.name.toLowerCase();
                break;
            case 'att':
                aVal = a.Stats.ATT;
                bVal = b.Stats.ATT;
                break;
            case 'def':
                aVal = a.Stats.DEF;
                bVal = b.Stats.DEF;
                break;
            case 'int':
                aVal = a.Stats.INT;
                bVal = b.Stats.INT;
                break;
            case 'dex':
                aVal = a.Stats.DEX;
                bVal = b.Stats.DEX;
                break;
            case 'hap':
                aVal = a.Stats.HAP;
                bVal = b.Stats.HAP;
                break;
            case 'ene':
                aVal = a.Stats.ENE;
                bVal = b.Stats.ENE;
                break;
        }
        
        if (currentOrder === 'asc') {
            return aVal > bVal ? 1 : -1;
        } else {
            return aVal < bVal ? 1 : -1;
        }
    });

    // Render pet cards
    container.innerHTML = sortedPets.map(pet => `
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="card pet-card">
                <div class="card-header text-center">
                    <img src="/web/Emojis/Pets/${pet.name}.png" 
                         alt="${pet.name}" 
                         class="pet-emoji"
                         onerror="this.src='/web/Emojis/Pets/Basic.png'">
                    <h5 class="mb-0 mt-2">${pet.name}</h5>
                </div>
                <div class="card-body">
                    <!-- Stats -->
                    <div class="mb-3">
                        <h6 class="text-primary mb-2">📊 Base Stats</h6>
                        <div class="row">
                            <div class="col-6">
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/ATT.png" alt="ATT" class="stat-emoji">
                                    <span class="${pet.Spec.includes('ATT') ? 'stat-special' : ''}">ATT: ${pet.Stats.ATT}</span>
                                </div>
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/DEF.png" alt="DEF" class="stat-emoji">
                                    <span class="${pet.Spec.includes('DEF') ? 'stat-special' : ''}">DEF: ${pet.Stats.DEF}</span>
                                </div>
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/INT.png" alt="INT" class="stat-emoji">
                                    <span class="${pet.Spec.includes('INT') ? 'stat-special' : ''}">INT: ${pet.Stats.INT}</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/DEX.png" alt="DEX" class="stat-emoji">
                                    <span class="${pet.Spec.includes('DEX') ? 'stat-special' : ''}">DEX: ${pet.Stats.DEX}</span>
                                </div>
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/HAP.png" alt="HAP" class="stat-emoji">
                                    <span class="${pet.Spec.includes('HAP') ? 'stat-special' : ''}">HAP: ${pet.Stats.HAP}</span>
                                </div>
                                <div class="stat-item">
                                    <img src="/web/Emojis/Pets/Deco/ENE.png" alt="ENE" class="stat-emoji">
                                    <span class="${pet.Spec.includes('ENE') ? 'stat-special' : ''}">ENE: ${pet.Stats.ENE}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Specialties -->
                    <div class="mb-3">
                        <h6 class="text-primary mb-2">⭐ Specialties</h6>
                        <div>
                            ${pet.Spec.map(spec => 
                                `<span class="badge spec-badge">${spec}</span>`
                            ).join('')}
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <h6 class="text-primary mb-2">📝 Description</h6>
                        <p class="small mb-0 pet-description">${pet.Descriptions}</p>
                    </div>

                    <!-- Actions -->
                    <div>
                        <h6 class="text-primary mb-2">⚔️ Battle Actions</h6>
                        ${Object.entries(pet.Actions).map(([type, name]) => `
                            <div class="action-item">
                                <div class="action-type">${type}:</div>
                                <div class="action-name">${name}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

// Event listeners
document.getElementById('sortBy').addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderPets();
});

document.getElementById('sortAsc').addEventListener('click', () => {
    currentOrder = 'asc';
    document.getElementById('sortAsc').classList.add('active');
    document.getElementById('sortDesc').classList.remove('active');
    renderPets();
});

document.getElementById('sortDesc').addEventListener('click', () => {
    currentOrder = 'desc';
    document.getElementById('sortDesc').classList.add('active');
    document.getElementById('sortAsc').classList.remove('active');
    renderPets();
});

// Initialize the page
    // Listen for dashboard page loaded event to initialize the page
    document.addEventListener('dashboardPageLoaded', function(event) {
        console.log('Dashboard page loaded event received for:', event.detail.page);
        // Ensure this script only runs for its own page
        if (event.detail.page.includes('pets.html')) {
            console.log('Initializing pets page...');
            loadPetsData();
        }
    });
</script>
