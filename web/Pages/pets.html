<link rel="stylesheet" href="/css/pets.css">

<!-- Unified Pet Database -->
<div class="container-fluid">

    <!-- ── Shared Navigation Bar ─────────────────────────────────────────── -->
    <div class="card mb-3">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <!-- Category Toggles -->
            <div class="btn-group flex-wrap category-toggle" role="group" id="main-category-toggle">
                <button type="button" class="btn btn-sm active" onclick="switchCategory('pets')">🐾 Pets</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('materials')">🪨 Materials</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('gems')">💎 Gems</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('monsters')">👹 Monsters</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('potions')">🧪 Potions</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('rings')">💍 Rings</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('equipment_sets')">🛡️ Equipment Sets</button>
                <button type="button" class="btn btn-sm" onclick="switchCategory('weapons')">⚔️ Weapons</button>
            </div>
            <!-- View Toggle -->
            <div class="btn-group view-toggle" role="group">
                <button type="button" class="btn btn-sm active" onclick="setViewType('cards')">Cards</button>
                <button type="button" class="btn btn-sm" onclick="setViewType('list')">List</button>
            </div>
        </div>
        <!-- Sort bar — updated per category via JS -->
        <div class="card-footer py-1" id="sort-bar"></div>
    </div>

    <!-- ── Tab Content ────────────────────────────────────────────────────── -->
    <div class="tab-content" id="categoryTabContent">

        <!-- Pets -->
        <div class="tab-pane fade show active" id="pets" role="tabpanel">
            <div id="petContainer" class="row">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
            </div>
        </div>

        <!-- Materials -->
        <div class="tab-pane fade" id="materials" role="tabpanel">
            <div id="materials-container" class="row"></div>
        </div>

        <!-- Gems -->
        <div class="tab-pane fade" id="gems" role="tabpanel">
            <div id="gems-container" class="row"></div>
        </div>

        <!-- Monsters -->
        <div class="tab-pane fade" id="monsters" role="tabpanel">
            <div id="monsters-container" class="row"></div>
        </div>

        <!-- Potions -->
        <div class="tab-pane fade" id="potions" role="tabpanel">
            <div id="potions-container" class="row"></div>
        </div>

        <!-- Rings -->
        <div class="tab-pane fade" id="rings" role="tabpanel">
            <div id="rings-container" class="row"></div>
        </div>

        <!-- Equipment Sets (Helmets, Armor, Boots, Shields) -->
        <div class="tab-pane fade" id="equipment_sets" role="tabpanel">
            <div id="equipment_sets-container"></div>
        </div>

        <!-- Weapons (Daggers, Katanas, Swords, Axes, Hammers, Bows) -->
        <div class="tab-pane fade" id="weapons" role="tabpanel">
            <div id="weapons-container"></div>
        </div>

    </div><!-- /tab-content -->

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-primary">Loading pet database...</p>
    </div>

</div><!-- /container-fluid -->
<script src="/js/pets.js"></script>
