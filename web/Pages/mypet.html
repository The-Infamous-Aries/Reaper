<link rel="stylesheet" href="/css/mypet.css">

<div class="container-fluid" id="mypet-root">

    <!-- No-pet state -->
    <div id="mypet-empty" style="display:none;">
        <div class="row justify-content-center mt-5">
            <div class="col-lg-6 text-center">
                <div class="mp-card">
                    <div class="mp-card-header"><h5>🐾 My Pet</h5></div>
                    <div class="mp-card-body py-5">
                        <p class="text-muted mb-4">You don't have a pet yet. Adopt one to get started!</p>
                        <button class="mp-adopt-btn" id="open-adopt-btn">+ Adopt a Pet</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pet display -->
    <div id="mypet-display" style="display:none;">
        <hr class="mp-divider">
        <div class="row g-3">
            <!-- LEFT: Pet card — sticky, doesn't resize when inventory expands -->
            <div class="col-xl-3 col-lg-4 mb-3" style="align-self:flex-start;position:sticky;top:0">
                <div class="mp-card">
                    <div class="mp-card-header text-center" id="my-pet-header"></div>
                    <div class="mp-card-body" id="my-pet-body"></div>
                </div>
            </div>

            <!-- RIGHT: Pet Actions -->
            <div class="col-xl-9 col-lg-8">
                <hr class="mp-divider d-lg-none">
                <div class="mp-card">
                    <div class="mp-card-body" id="pet-tab-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="mypet-loading" class="text-center py-5">
        <div class="spinner-border" style="color:var(--gold-primary)" role="status"></div>
        <p class="mt-2" style="color:var(--text-secondary)">Loading your pet...</p>
    </div>

    <!-- Error -->
    <div id="mypet-error" style="display:none;" class="row justify-content-center mt-5">
        <div class="col-lg-6">
            <div class="mp-card mp-card-body" id="mypet-error-msg" style="color:var(--text-primary)"></div>
        </div>
    </div>
</div>

<script src="/js/mypet.js"></script>
<script src="/js/ability_tree.js"></script>
<script src="/js/battle_settings.js"></script>

<!-- Item hover card (shared singleton) -->
<div id="mp-item-hover">
    <div class="mp-hover-card">
        <img class="mp-hover-img" id="mp-hover-img" src="" alt="">
        <div class="mp-hover-name" id="mp-hover-name"></div>
        <div class="mp-hover-rarity" id="mp-hover-rarity"></div>
        <div class="mp-hover-bonuses" id="mp-hover-bonuses"></div>
        <div class="mp-hover-desc" id="mp-hover-desc"></div>
    </div>
</div>

<!-- Battle Settings CSS -->
<style>
/* Battle Settings Modal Styling - Matches Pet Page Theme */
.battle-settings-container {
    color: var(--text-primary);
    font-family: inherit;
}

/* Modal z-index: above ability tree (9000) and tooltips (9999) */
#battleSettingsModal {
    z-index: 10500 !important;
}
#battleSettingsModal .modal-backdrop {
    z-index: 10499 !important;
}
#battleSettingsModal .modal-dialog {
    z-index: 10501 !important;
}

/* Ensure all interactive elements work */
.battle-settings-container input,
.battle-settings-container select,
.battle-settings-container button,
.battle-settings-container .form-check-input,
.battle-settings-container .form-control,
.battle-settings-container .form-select {
    pointer-events: auto !important;
}

.battle-settings-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, transparent, var(--gold-primary), transparent) 1;
}

.battle-settings-header h3 {
    font-family: 'Orbitron', sans-serif;
    color: var(--gold-primary);
    text-shadow: 0 0 8px var(--gold-glow);
    margin-bottom: 8px;
}

.battle-settings-header p {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin: 0;
}

.formula-section {
    background: linear-gradient(135deg, rgba(15,15,15,0.9), rgba(20,20,20,0.9));
    border: 2px solid transparent;
    border-image: linear-gradient(45deg, rgba(255,215,0,0.3), rgba(139,69,19,0.3), rgba(255,215,0,0.3)) 1;
    clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    padding: 15px;
    margin-bottom: 15px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.formula-section:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px var(--gold-glow);
}

.formula-section h5 {
    font-family: 'Orbitron', sans-serif;
    color: var(--gold-primary);
    text-shadow: 0 0 6px var(--gold-glow);
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.battle-settings-container .form-control,
.battle-settings-container .form-select {
    background: rgba(10,10,10,0.8) !important;
    border: 1px solid rgba(255,215,0,0.3) !important;
    color: var(--text-primary) !important;
    font-size: 0.85rem;
    border-radius: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.battle-settings-container .form-control:focus,
.battle-settings-container .form-select:focus {
    background: rgba(15,15,15,0.9) !important;
    border-color: var(--gold-primary) !important;
    box-shadow: 0 0 8px var(--gold-glow) !important;
    color: var(--text-primary) !important;
    outline: none;
}

.battle-settings-container .form-control::placeholder {
    color: var(--text-secondary);
    opacity: 0.7;
}

.battle-settings-container .form-check-input {
    background-color: rgba(10,10,10,0.8);
    border: 1px solid rgba(255,215,0,0.3);
}

.battle-settings-container .form-check-input:checked {
    background-color: var(--gold-primary);
    border-color: var(--gold-primary);
    box-shadow: 0 0 6px var(--gold-glow);
}

.battle-settings-container .form-check-input:focus {
    box-shadow: 0 0 0 0.2rem rgba(255, 215, 0, 0.25);
}

.battle-settings-container .form-check-label {
    color: var(--text-primary);
    font-size: 0.85rem;
}

.battle-settings-container .form-label {
    color: var(--gold-secondary);
    font-weight: 600;
    font-size: 0.8rem;
    margin-bottom: 5px;
}

.battle-settings-container .btn-primary {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
    color: #000;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    border: none;
    padding: 0.5rem 1.5rem;
    clip-path: polygon(0 6px, 6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px));
    transition: all 0.3s ease;
    cursor: pointer;
}

.battle-settings-container .btn-primary:hover {
    box-shadow: 0 0 16px var(--gold-glow);
    transform: translateY(-2px);
    color: #000;
}

.battle-settings-container .btn-info {
    background: linear-gradient(135deg, #17a2b8, #20c997);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    border: none;
    padding: 0.4rem 1.2rem;
    clip-path: polygon(0 4px, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px));
    transition: all 0.3s ease;
}

.battle-settings-container .btn-info:hover {
    box-shadow: 0 0 12px rgba(23, 162, 184, 0.5);
    transform: translateY(-1px);
}

.battle-settings-container .btn-outline-secondary {
    border: 1px solid rgba(255,215,0,0.3);
    color: var(--text-secondary);
    background: rgba(0,0,0,0.3);
    font-size: 0.8rem;
    padding: 0.4rem 1.2rem;
    border-radius: 6px;
    transition: all 0.2s;
}

.battle-settings-container .btn-outline-secondary:hover {
    background: rgba(255,215,0,0.1);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    box-shadow: 0 0 8px var(--gold-glow);
}

.test-results-content {
    background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(10,10,10,0.4));
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 8px;
    padding: 15px;
    margin-top: 10px;
}

.test-results-content h6 {
    color: var(--gold-primary);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    margin-bottom: 10px;
}

.preset-selector {
    margin-bottom: 20px;
}

.preset-selector .form-select {
    flex: 1;
    margin-right: 10px;
}

.battle-settings-alert {
    border-radius: 8px;
    margin-bottom: 15px;
    border: none;
    font-size: 0.85rem;
}

.general-settings {
    background: linear-gradient(135deg, rgba(15,15,15,0.9), rgba(20,20,20,0.9));
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

.general-settings h5 {
    font-family: 'Orbitron', sans-serif;
    color: var(--gold-primary);
    text-shadow: 0 0 6px var(--gold-glow);
    margin-bottom: 15px;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.actions {
    text-align: center;
    padding-top: 20px;
    border-top: 2px solid transparent;
    border-image: linear-gradient(90deg, transparent, var(--gold-primary), transparent) 1;
    margin-top: 20px;
}

.stat-checkbox-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px;
    margin-bottom: 15px;
}

.stat-checkbox-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    transition: all 0.2s;
    cursor: pointer;
}

.stat-checkbox-item:hover {
    border-color: var(--gold-primary);
    box-shadow: 0 0 8px var(--gold-glow);
}

.stat-checkbox-item.selected {
    background: rgba(255,215,0,0.1);
    border-color: var(--gold-primary);
    box-shadow: 0 0 6px var(--gold-glow);
}

.stat-checkbox-item .form-check-input {
    margin-bottom: 5px;
}

.stat-checkbox-item .form-check-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gold-secondary);
    cursor: pointer;
}

.room-info {
    background: linear-gradient(135deg, rgba(23,162,184,0.1), rgba(32,201,151,0.1));
    border: 1px solid rgba(23,162,184,0.3);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 15px;
}

.room-info strong {
    color: var(--gold-primary);
}

.text-success { color: #28a745 !important; }
.text-danger { color: #dc3545 !important; }
.text-muted { color: var(--text-secondary) !important; }

/* Scrollbar styling for modal body */
.modal-body::-webkit-scrollbar {
    width: 6px;
}

.modal-body::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2);
    border-radius: 3px;
}

.modal-body::-webkit-scrollbar-thumb {
    background: var(--gold-primary);
    border-radius: 3px;
}

.modal-body::-webkit-scrollbar-thumb:hover {
    background: var(--gold-secondary);
}

/* Animation for modal entrance */
.modal.fade .modal-dialog {
    transition: transform 0.3s ease-out;
    transform: translate(0, -50px);
}

.modal.show .modal-dialog {
    transform: none;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .modal-xl {
        max-width: 95%;
    }
    
    .formula-section {
        padding: 12px;
    }
    
    .stat-checkbox-group {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>

<script>
let battleSettingsUI = null;

function openBattleSettings(mode = 'singleplayer', roomId = null) {
    // Use the modal utility for consistent behavior
    if (typeof ModalUtils !== 'undefined') {
        ModalUtils.cleanupAllModals();
    } else {
        // Fallback cleanup if modal utils not loaded
        document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');
    }

    const modalElement = document.getElementById('battleSettingsModal');
    if (!modalElement) {
        console.error('Battle settings modal not found');
        return;
    }

    // Wait for cleanup to complete
    setTimeout(() => {
        const modal = new bootstrap.Modal(modalElement, { 
            backdrop: true, 
            keyboard: true, 
            focus: true 
        });

        // Initialize the battle settings UI
        battleSettingsUI = new BattleSettingsUI('battleSettingsContainer', {
            mode: mode,
            roomId: roomId,
            onSave: function(settings) {
                if (mode === 'singleplayer') {
                    showBattleSettingsSuccess('Battle settings saved! They will be used in your next single-player battle.');
                } else {
                    showBattleSettingsSuccess('Battle settings accepted for this room!');
                    modal.hide();
                }
            }
        });

        // Set up proper event handlers
        modalElement.addEventListener('shown.bs.modal', function onShown() {
            modalElement.removeEventListener('shown.bs.modal', onShown);
            
            // Ensure proper z-index
            const backdrop = document.querySelector('.modal-backdrop');
            if (backdrop) {
                backdrop.style.zIndex = '1040';
            }
            modalElement.style.zIndex = '1050';
            
            // Ensure form elements are interactive
            const formElements = modalElement.querySelectorAll('input, select, button, textarea');
            formElements.forEach(element => {
                element.style.pointerEvents = 'auto';
            });
        });

        // Clean up on hide
        modalElement.addEventListener('hidden.bs.modal', function onHidden() {
            modalElement.removeEventListener('hidden.bs.modal', onHidden);
            if (typeof ModalUtils !== 'undefined') {
                ModalUtils.cleanupAllModals();
            }
        });

        modal.show();
    }, 100);
}

function showBattleSettingsSuccess(message) {
    // Create a toast or alert to show success
    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert alert-success alert-dismissible fade show position-fixed';
    alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 99999; max-width: 400px;';
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    document.body.appendChild(alertDiv);
    
    // Auto-remove after 5 seconds
    setTimeout(() => {
        if (alertDiv.parentNode) {
            alertDiv.parentNode.removeChild(alertDiv);
        }
    }, 5000);
}
</script>
