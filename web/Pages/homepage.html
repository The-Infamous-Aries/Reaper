<link href="/css/homepage.css" rel="stylesheet">
<div class="container-fluid py-2">
    <div class="row">
        <div class="col-12">
            <div class="hero-section">
                <div class="hero-content">
                    <img src="/static/Images/keeper.png" alt="The Digital Reaper" class="hero-avatar">
                    <h1 class="hero-title" id="hero-rotating-line">The Discord Bot That Collects Souls and Wins Wars</h1>
                </div>
                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-label">Soul Harvested</span>
                        <span class="stat-detail"><span id="stat-servers">...</span> Servers</span>
                        <span class="stat-detail"><span id="stat-users">...</span> Users</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Reaper Gaze</span>
                        <span class="stat-detail"><span id="stat-alliances">...</span> Alliances</span>
                        <span class="stat-detail"><span id="stat-nations">...</span> Nations</span>
                        <span class="stat-detail"><span id="stat-cities">...</span> Cities</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Digital Companions</span>
                        <span class="stat-detail"><span id="stat-pets">...</span> Pets</span>
                        <span class="stat-detail"><span id="stat-items">...</span> Items</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const rotatingTitle = document.getElementById('hero-rotating-line');
    if (rotatingTitle) {
        const fallbackLines = [
            'The Discord Bot That Collects Souls and Wins Wars',
            'The One Bot To Rule Them All!',
            'You DO Want To Fear This Reaper!'
        ];
        let titleLines = fallbackLines;
        let titleIndex = 0;

        const setRotatingTitle = () => {
            if (!titleLines.length) return;
            titleIndex = (titleIndex + 1) % titleLines.length;
            rotatingTitle.classList.add('is-changing');
            window.setTimeout(() => {
                rotatingTitle.textContent = titleLines[titleIndex];
                rotatingTitle.classList.remove('is-changing');
            }, 250);
        };

        fetch('/data/reaper_taglines.json')
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(lines => {
                if (!Array.isArray(lines)) return;
                const cleanLines = lines
                    .map(line => String(line || '').trim())
                    .filter(Boolean);
                if (!cleanLines.length) return;
                titleLines = cleanLines;
                titleIndex = titleLines.indexOf(rotatingTitle.textContent.trim());
                if (titleIndex < 0) titleIndex = 0;
            })
            .catch(err => console.warn('Failed to load homepage taglines:', err));

        window.setInterval(setRotatingTitle, 7000);
    }

    fetch('/api/stats')
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(data => {
            const setStat = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = Number(value || 0).toLocaleString();
            };

            setStat('stat-servers', data.servers);
            setStat('stat-users', data.users);
            setStat('stat-alliances', data.alliances);
            setStat('stat-nations', data.nations);
            setStat('stat-cities', data.cities);
            setStat('stat-pets', data.pets);
            setStat('stat-items', data.items);
        })
        .catch(err => {
            console.error('Failed to fetch stats:', err);
            [
                'stat-servers',
                'stat-users',
                'stat-alliances',
                'stat-nations',
                'stat-cities',
                'stat-pets',
                'stat-items'
            ].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = '0';
            });
        });

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
            const href = this.getAttribute('href');
            if (href === '#') {
                e.preventDefault();
                return;
            }
            const target = document.querySelector(href);
            if (target) {
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });
})();

function loadPage(pageName, scriptPath, scriptType, cssPath) {
    if (typeof navigateTo === 'function' && typeof window.loadPageDirect === 'function') {
        window.loadPageDirect(pageName, scriptPath, scriptType, cssPath);

        const url = new URL(window.location);
        url.searchParams.set('page', pageName);
        ['script', 'scriptType', 'css'].forEach(k => url.searchParams.delete(k));
        if (scriptPath) url.searchParams.set('script', scriptPath);
        if (scriptType && scriptType !== 'script') url.searchParams.set('scriptType', scriptType);
        if (cssPath) url.searchParams.set('css', cssPath);
        history.pushState({ page: pageName }, '', url.toString());

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-link[data-page='${pageName}']`);
        if (activeLink) activeLink.classList.add('active');
    } else {
        let url = `dashboard.html?page=${pageName}`;
        if (scriptPath) url += `&script=${encodeURIComponent(scriptPath)}`;
        if (scriptType && scriptType !== 'script') url += `&scriptType=${encodeURIComponent(scriptType)}`;
        if (cssPath) url += `&css=${encodeURIComponent(cssPath)}`;
        window.location.href = url;
    }
}

function _initFlipCards() {
    document.querySelectorAll('.home-card.flip-host').forEach(card => {
        const flipEl = card.querySelector('.flip-card');
        if (!flipEl) return;

        const front = flipEl.querySelector('.flip-card-front');
        if (front) {
            front.addEventListener('click', function() {
                flipEl.classList.toggle('is-flipped');
                card.classList.toggle('is-expanded');
            });
        }

        const back = flipEl.querySelector('.flip-card-back');
        if (back) {
            back.addEventListener('click', function(e) {
                if (e.target.classList.contains('flip-card-back-btn')) return;
                flipEl.classList.remove('is-flipped');
                card.classList.remove('is-expanded');
            });
        }

        const btn = flipEl.querySelector('.flip-card-back-btn');
        if (btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    });
}

(function _runHomepageInit() {
    function _run() { _initFlipCards(); }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _run);
    } else {
        _run();
    }
})();
</script>
