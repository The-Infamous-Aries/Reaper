<div class="walktru-root" id="walktru-root">
    <main class="walktru-layout">
        <section class="walktru-story-list" id="walktru-story-list" aria-label="Walkthru stories"></section>

        <section class="walktru-play-area" id="walktru-play-area">
            <div class="walktru-stage-panel">
                <div class="walktru-stage-head">
                    <div class="walktru-stage-title-wrap">
                        <img class="walktru-story-icon" id="walktru-story-icon" src="/static/Emojis/Walkthru/knight.png" alt="">
                        <div>
                            <span class="walktru-kicker" id="walktru-stage-kicker">No Story Selected</span>
                            <h5 id="walktru-stage-title">Pick a Walkthru story</h5>
                        </div>
                    </div>
                    <div class="walktru-stage-count" id="walktru-stage-count">Stage --/8</div>
                </div>

                <p class="walktru-stage-text" id="walktru-stage-text">Select a story to begin a fully branching eight-stage run.</p>

                <div class="walktru-stats" id="walktru-stats"></div>
                <div class="walktru-result" id="walktru-result" hidden></div>
                <div class="walktru-choices" id="walktru-choices"></div>
            </div>

            <aside class="walktru-run-panel">
                <div class="walktru-panel-head">
                    <h5>Run Log</h5>
                    <span id="walktru-path-count">0 choices</span>
                </div>
                <div class="walktru-history" id="walktru-history">
                    <div class="walktru-empty">Your choices and outcomes will appear here.</div>
                </div>
            </aside>
        </section>
    </main>

    <div class="walktru-toast" id="walktru-toast" hidden></div>
</div>
