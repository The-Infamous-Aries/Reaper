<script>
var equipmentData = {};
var currentSort = {
    materials: { field: 'name', direction: 'asc' },
    potions: { field: 'name', direction: 'asc' },
    gems: { field: 'name', direction: 'asc' },
    monsters: { field: 'name', direction: 'asc' },
    hats: { field: 'name', direction: 'asc' }
};

// Load equipment data on page load
    // Listen for dashboard page loaded event to initialize the page
    document.addEventListener('dashboardPageLoaded', function(event) {
        console.log('Dashboard page loaded event received for:', event.detail.page);
        // Ensure this script only runs for its own page
        if (event.detail.page.includes('pets_item.html')) {
            console.log('Initializing pet items page...');
            loadEquipmentData();
        }
    });

async function loadEquipmentData() {
    try {
        console.log('Loading equipment data from API...');
        const response = await fetch('/api/equipment-data');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        equipmentData = await response.json();
        console.log('Equipment data loaded:', equipmentData);
        console.log('Equipment data keys:', Object.keys(equipmentData));
        console.log('Materials data:', equipmentData.Materials);

        // Add emoji paths for each item
        for (const category in equipmentData) {
            if (Array.isArray(equipmentData[category])) {
                equipmentData[category].forEach(item => {
                    if (item.emoji_file) {
                        // Use relative path from the current directory structure
                        item.emoji_path = `/web/Emojis/Pets/Equipment/${item.emoji_file}`;
                        console.log(`Set emoji_path for ${item.name}: ${item.emoji_path}`);
                    }
                });
            }
        }

        // Validate data structure
        const expectedCategories = ['Materials', 'Potions', 'Gems', 'Monsters', 'Hats'];
        const availableCategories = Object.keys(equipmentData);
        console.log('Available categories:', availableCategories);
        
        // Hide loading spinner only after successful data loading
        document.getElementById('loading-spinner').style.display = 'none';
        
        // Render all categories
        console.log('Rendering categories...');
        // Always render all categories, even if empty, to show proper messages
        console.log('Rendering Materials:', equipmentData.Materials ? equipmentData.Materials.length : 0, 'items');
        renderMaterials();
        console.log('Rendering Potions:', equipmentData.Potions ? equipmentData.Potions.length : 0, 'items');
        renderPotions();
        console.log('Rendering Gems:', equipmentData.Gems ? equipmentData.Gems.length : 0, 'items');
        renderGems();
        console.log('Rendering Monsters:', equipmentData.Monsters ? equipmentData.Monsters.length : 0, 'items');
        renderMonsters();
        console.log('Rendering Hats:', equipmentData.Hats ? equipmentData.Hats.length : 0, 'items');
        renderHats();
        
        console.log('All categories rendered successfully!');
        
    } catch (error) {
        console.error('Error loading equipment data:', error);
        document.getElementById('loading-spinner').style.display = 'none';
        
        // Show error message to user
        const errorHtml = `
            <div class="col-12">
                <div class="alert alert-danger" role="alert">
                    <h5 class="alert-heading">Error Loading Equipment Data</h5>
                    <p>Failed to load equipment data: ${error.message}</p>
                    <hr>
                    <p class="mb-0">Please try refreshing the page or contact support if the problem persists.</p>
                </div>
            </div>
        `;
        
        // Show error in all containers
        document.getElementById('materials-container').innerHTML = errorHtml;
        document.getElementById('potions-container').innerHTML = errorHtml;
        document.getElementById('gems-container').innerHTML = errorHtml;
        document.getElementById('monsters-container').innerHTML = errorHtml;
        document.getElementById('hats-container').innerHTML = errorHtml;
    }
}

// Rarity color mapping
function getRarityColor(rarity) {
    const colors = {
        'Common': '#9e9e9e',
        'Uncommon': '#4caf50',
        'Rare': '#2196f3',
        'Epic': '#9c27b0',
        'Mythic': '#ff9800'
    };
    return colors[rarity] || '#9e9e9e';
}

// Render Materials
function renderMaterials() {
    console.log('renderMaterials() called');
    const container = document.getElementById('materials-container');
    if (!container) {
        console.error('Materials container not found!');
        return;
    }
    
    const materials = [...(equipmentData.Materials || [])];
    console.log('Materials to render:', materials.length);
    console.log('First material sample:', materials[0]);
    console.log('All materials:', materials);
    
    if (materials.length === 0) {
        console.log('No materials found');
        container.innerHTML = '<div class="col-12"><p class="text-center text-muted">No materials found.</p></div>';
        return;
    }
    
    // Apply current sorting
    materials.sort(getSortFunction('materials'));
    
    try {
        const htmlOutput = materials.map(material => {
            console.log(`[Materials] Rendering: ${material.name} with path: ${material.emoji_path}`);
            
            // Validate required properties
            if (!material.name || !material.emoji_path) {
                console.warn(`Material missing required properties:`, material);
                return '';
            }
            
            // Debug bonuses
            const attBonus = material.bonuses?.ATT;
            const defBonus = material.bonuses?.DEF;
            const dexBonus = material.bonuses?.DEX;
            console.log(`Material ${material.name} bonuses:`, {ATT: attBonus, DEF: defBonus, DEX: dexBonus});
            
            return `
            <div class="col-md-4 col-lg-3 mb-3">
                <div class="card h-100" style="border-color: ${getRarityColor(material.rarity)};">
                    <div class="card-body text-center">
                        <img src="${material.emoji_path}" 
                             alt="${material.name}" 
                             class="mb-2" 
                             style="width: 48px; height: 48px; object-fit: contain;"
                             onload="console.log('Image loaded:', '${material.emoji_path}')"
                             onerror="console.error('Image failed to load:', this.src); this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div style="display: none; color: red; font-size: 12px;">Image not found: ${material.emoji_file}</div>
                        <h6 class="card-title text-warning">${material.name}</h6>
                        <p class="card-text">
                            <span class="badge" style="background-color: ${getRarityColor(material.rarity)};">${material.rarity}</span>
                        </p>
                        <div class="row g-1">
                            ${attBonus !== undefined ? `<div class="col-6"><small class="text-danger">ATT: +${attBonus}</small></div>` : ''}
                            ${defBonus !== undefined ? `<div class="col-6"><small class="text-primary">DEF: +${defBonus}</small></div>` : ''}
                            ${dexBonus !== undefined ? `<div class="col-6"><small class="text-success">DEX: +${dexBonus}</small></div>` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `;
        }).join('');
        
        console.log(`Setting container HTML with ${htmlOutput.length} characters`);
        container.innerHTML = htmlOutput;
        console.log(`Successfully rendered ${materials.length} materials`);
    } catch (error) {
        console.error('Error rendering materials:', error);
        container.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error rendering materials: ${error.message}</div></div>`;
    }
}

// Render Potions
function renderPotions() {
    const container = document.getElementById('potions-container');
    if (!container) {
        console.error('Potions container not found!');
        return;
    }
    
    const potions = [...(equipmentData.Potions || [])];
    
    if (potions.length === 0) {
        container.innerHTML = '<div class="col-12"><p class="text-center text-muted">No potions found.</p></div>';
        return;
    }
    
    // Apply current sorting
    potions.sort(getSortFunction('potions'));
    
    container.innerHTML = potions.map(potion => {
        console.log(`[Potions] Rendering image with path: ${potion.emoji_path}`);
        
        let boostInfo = '';
        if (potion.use_effect) {
            const effect = potion.use_effect;
            if (effect.type === 'attribute_boost') {
                boostInfo = `${effect.attribute}: +${effect.value}`;
            } else if (effect.type === 'elemental_boost') {
                boostInfo = `${effect.element}: +${effect.value_single}/${effect.value_dual}`;
            } else if (effect.type === 'random_boost') {
                boostInfo = `Random +${effect.value} (${effect.count}x)`;
            } else if (effect.type === 'luck_boost') {
                boostInfo = `Luck +${effect.min}-${effect.max}`;
            } else if (effect.type === 'mega_boost') {
                boostInfo = `Mega +${effect.value}`;
            } else if (effect.type === 'health_boost') {
                boostInfo = `Health +${effect.value}`;
            } else if (effect.type === 'xp_boost') {
                boostInfo = `XP x${effect.multiplier}`;
            }
        }

        return `
        <div class="col-md-4 col-lg-3 mb-3">
            <div class="card h-100" style="border-color: ${getRarityColor(potion.rarity)};">
                <div class="card-body text-center">
                    <img src="${potion.emoji_path}" 
                         alt="${potion.name}" 
                         class="mb-2" 
                         style="width: 48px; height: 48px; object-fit: contain;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div style="display: none; color: red; font-size: 12px;">Image not found</div>
                    <h6 class="card-title text-warning">${potion.name}</h6>
                    <p class="card-text">
                        <span class="badge" style="background-color: ${getRarityColor(potion.rarity)};">${potion.rarity}</span>
                    </p>
                    <p class="card-text">
                        <small class="text-info">${boostInfo}</small>
                    </p>
                </div>
            </div>
        </div>
    `;
    }).join('');
}

// Sorting functions
function getSortFunction(category) {
    const sort = currentSort[category];
    return (a, b) => {
        let aVal, bVal;
        
        switch (sort.field) {
            case 'name':
                aVal = a.name.toLowerCase();
                bVal = b.name.toLowerCase();
                break;
            case 'rarity':
                const rarityOrder = { 'Common': 1, 'Uncommon': 2, 'Rare': 3, 'Epic': 4, 'Mythic': 5 };
                aVal = rarityOrder[a.rarity] || 0;
                bVal = rarityOrder[b.rarity] || 0;
                break;
            case 'att':
                aVal = a.bonuses?.ATT || 0;
                bVal = b.bonuses?.ATT || 0;
                break;
            case 'def':
                aVal = a.bonuses?.DEF || 0;
                bVal = b.bonuses?.DEF || 0;
                break;
            case 'dex':
                aVal = a.bonuses?.DEX || 0;
                bVal = b.bonuses?.DEX || 0;
                break;
            case 'int':
                aVal = a.bonuses?.INT || 0;
                bVal = b.bonuses?.INT || 0;
                break;
            case 'hap':
                aVal = a.bonuses?.HAP || 0;
                bVal = b.bonuses?.HAP || 0;
                break;
            case 'ene':
                aVal = a.bonuses?.ENE || 0;
                bVal = b.bonuses?.ENE || 0;
                break;
            case 'boost':
                // For potions - get the main boost value
                if (a.use_effect) {
                    const effect = a.use_effect;
                    if (effect.type === 'attribute_boost') aVal = effect.value;
                    else if (effect.type === 'elemental_boost') aVal = effect.value_single;
                    else if (effect.type === 'random_boost') aVal = effect.value;
                    else if (effect.type === 'luck_boost') aVal = effect.max;
                    else if (effect.type === 'mega_boost') aVal = effect.value;
                    else if (effect.type === 'health_boost') aVal = effect.value;
                    else if (effect.type === 'xp_boost') aVal = effect.multiplier;
                    else aVal = 0;
                } else aVal = 0;
                
                if (b.use_effect) {
                    const effect = b.use_effect;
                    if (effect.type === 'attribute_boost') bVal = effect.value;
                    else if (effect.type === 'elemental_boost') bVal = effect.value_single;
                    else if (effect.type === 'random_boost') bVal = effect.value;
                    else if (effect.type === 'luck_boost') bVal = effect.max;
                    else if (effect.type === 'mega_boost') bVal = effect.value;
                    else if (effect.type === 'health_boost') bVal = effect.value;
                    else if (effect.type === 'xp_boost') bVal = effect.multiplier;
                    else bVal = 0;
                } else bVal = 0;
                break;
            default:
                return 0;
        }
        
        if (sort.direction === 'asc') {
            return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
        } else {
            return aVal > bVal ? -1 : aVal < bVal ? 1 : 0;
        }
    };
}

function sortMaterials(field, direction) {
    currentSort.materials = { field, direction };
    renderMaterials();
}

function sortPotions(field, direction) {
    currentSort.potions = { field, direction };
    renderPotions();
}

function sortGems(field, direction) {
    currentSort.gems = { field, direction };
    renderGems();
}

function sortMonsters(field, direction) {
    currentSort.monsters = { field, direction };
    renderMonsters();
}

function sortHats(field, direction) {
    currentSort.hats = { field, direction };
    renderHats();
}
