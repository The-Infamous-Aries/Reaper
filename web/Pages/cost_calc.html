
<link rel="stylesheet" href="/css/cost_calc.css">
    

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header text-center">
                        <h2>PnW Calculators</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-4 d-flex justify-content-center">
                            <input class="form-check-input" type="checkbox" id="calculator-toggle">
                            <label class="form-check-label ms-2" for="calculator-toggle">Switch to Military Calculator</label>
                        </div>

                        <div id="building-calculator">
                            <h3 class="text-center mb-4">Building Calculator</h3>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nation-query" class="form-label">Nation Name or ID</label>
                                    <div class="cc-ac-wrap">
                                        <input type="text" class="form-control" id="nation-query" placeholder="e.g., Reaper" autocomplete="off">
                                        <div id="cc-ac-dropdown" class="cc-ac-dropdown" style="display:none;"></div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="infra-to-buy" class="form-label">
                                        <img src="/static/Emojis/Calc/infra.png" alt="Infrastructure" height="20"> Desired Infrastructure
                                    </label>
                                    <input type="number" class="form-control" id="infra-to-buy" placeholder="e.g., 5000" step="50">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="land-to-buy" class="form-label">
                                        <img src="/static/Emojis/Calc/land.png" alt="Land" height="20"> Desired Land
                                    </label>
                                    <input type="number" class="form-control" id="land-to-buy" placeholder="e.g., 2500" step="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cities-to-buy" class="form-label">
                                        <img src="/static/Emojis/Calc/city.png" alt="Cities" height="20"> Cities to Buy
                                    </label>
                                    <input type="number" class="form-control" id="cities-to-buy" placeholder="e.g., 1">
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">
                                        <img src="/static/Emojis/Calc/project.png" alt="Projects" height="20"> Projects to Buy
                                    </label>
                                    <div class="project-picker" id="project-picker">
                                        <div class="project-picker-trigger" id="pp-trigger" tabindex="0" role="button" aria-haspopup="listbox" aria-expanded="false">
                                            <span id="pp-label">Select projects...</span>
                                            <span class="pp-arrow">&#9660;</span>
                                        </div>
                                        <div class="project-picker-panel" id="pp-panel" role="listbox" aria-multiselectable="true">
                                            <div class="project-picker-search">
                                                <input type="text" id="pp-search" placeholder="Search projects..." autocomplete="off">
                                            </div>
                                            <div class="project-picker-actions">
                                                <button type="button" id="pp-select-all">Select All</button>
                                                <button type="button" id="pp-clear-all">Clear All</button>
                                            </div>
                                            <div id="pp-list"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="military-calculator" style="display: none;">
                            <h3 class="text-center mb-4">Military Calculator</h3>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="soldiers" class="form-label">
                                        <img src="/static/Emojis/Military/soldier.png" alt="Soldier" height="24"> Soldiers
                                    </label>
                                    <input type="number" class="form-control" id="soldiers" placeholder="e.g., 10000" step="100000">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="tanks" class="form-label">
                                        <img src="/static/Emojis/Military/tank.png" alt="Tank" height="24"> Tanks
                                    </label>
                                    <input type="number" class="form-control" id="tanks" placeholder="e.g., 500" step="1000">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="aircraft" class="form-label">
                                        <img src="/static/Emojis/Military/jet.png" alt="Aircraft" height="24"> Aircraft
                                    </label>
                                    <input type="number" class="form-control" id="aircraft" placeholder="e.g., 100" step="100">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="ships" class="form-label">
                                        <img src="/static/Emojis/Military/ship.png" alt="Ship" height="24"> Ships
                                    </label>
                                    <input type="number" class="form-control" id="ships" placeholder="e.g., 25" step="10">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="missiles" class="form-label">
                                        <img src="/static/Emojis/Military/missile.png" alt="Missile" height="24"> Missiles
                                    </label>
                                    <input type="number" class="form-control" id="missiles" placeholder="e.g., 10">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="nukes" class="form-label">
                                        <img src="/static/Emojis/Military/bomb.png" alt="Nuke" height="24"> Nukes
                                    </label>
                                    <input type="number" class="form-control" id="nukes" placeholder="e.g., 1">
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button class="btn btn-primary" id="calculate-btn">Calculate</button>
                        </div>
                    </div>
                </div>

                <div class="card mt-4 results-card" id="results-container" style="display: none;">
                    <div class="card-header text-center">
                        <h3>Results</h3>
                    </div>
                    <div class="card-body" id="results-body">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/cost_calc.js"></script>
