<style>
:root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #0f0f0f;
    --bg-tertiary: #141414;
    --gold-primary: #ffd700;
    --gold-secondary: #ffed4e;
    --gold-glow: rgba(255, 215, 0, 0.3);
    --text-primary: #f0f0f0;
    --text-secondary: #b9bbbe;
    }
        
    .rps-theme-change-btn {
        font-size: 0.7rem;
        padding: 4px;
    }
    
    .rps-theme-selection h6 {
        font-size: 0.9rem;
    }

body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
}

/* Fun Card Styling - Updated to match dashboard theme */
.fun-card {
    background-color: rgba(15, 15, 15, 0.85);
    border: 2px solid var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
    border-radius: 0.75rem;
    transition: all 0.3s ease;
    min-height: 400px;
}

.fun-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px var(--gold-glow);
}

.fun-card .card-header {
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
    border-bottom: 2px solid var(--gold-primary);
    color: var(--gold-primary);
    font-weight: 700;
    border-radius: 0.75rem 0.75rem 0 0 !important;
}

.fun-card .card-header h3 {
    color: var(--gold-primary);
    margin: 0;
    font-size: 1.1rem;
    text-shadow: 0 0 10px var(--gold-glow);
}

/* Lighten text in card bodies */
.fun-card .card-body {
    color: #f8f9fa;
}

.fun-card .card-body h5,
.fun-card .card-body .form-label,
.fun-card .card-body small {
    color: #e9ecef;
    font-weight: 500;
}

.fun-card .card-body .text-center {
    color: #e9ecef;
}

/* Lighten result text and other dynamic content */
.fun-card .result-text,
.fun-card .coin-result,
.fun-card .dice-result,
.fun-card .card-result {
    color: #f8f9f8;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
}

/* Lighten button text in card bodies */
.fun-card .btn-outline-primary,
.fun-card .btn-outline-secondary,
.fun-card .btn-outline-danger,
.fun-card .btn-outline-warning,
.fun-card .btn-outline-info,
.fun-card .btn-outline-success {
    color: #e9ecef;
    border-color: var(--gold-primary);
}

.fun-card .btn-outline-primary:hover,
.fun-card .btn-outline-secondary:hover,
.fun-card .btn-outline-danger:hover,
.fun-card .btn-outline-warning:hover,
.fun-card .btn-outline-info:hover,
.fun-card .btn-outline-success:hover {
    color: #ffffff;
    background-color: var(--gold-primary);
    border-color: var(--gold-primary);
}

/* Additional text lightening for better visibility */
.fun-card .theme-preview small,
.fun-card .color-preview + small {
    color: #ffffff;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

.fun-card .btn:disabled {
    color: #6c757d;
    border-color: #6c757d;
}

.fun-card .btn-primary {
    color: #ffffff;
    background-color: var(--gold-primary);
    border-color: var(--gold-primary);
}

/* Coin Flip Styles */
.coin-setup {
    text-align: center;
}

.coin-theme-btn {
    padding: 6px;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    border: 2px solid var(--gold-primary);
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    font-size: 0.85rem;
}

.coin-theme-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px var(--gold-glow);
    background: var(--gold-primary);
    color: var(--bg-primary);
}

.coin-theme-btn.active {
    background: var(--gold-primary);
    color: var(--bg-primary);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
}

.theme-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.emoji-preview {
    font-size: 1.2rem;
    display: inline-block;
    vertical-align: middle;
    width: 20px;
    height: 20px;
    object-fit: contain;
}

.coin-animation {
    text-align: center;
}

.coin-container {
    perspective: 1000px;
    margin: 1rem 0;
}

.coin {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
    margin: 0 auto;
}

.coin-side {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    border: 4px solid var(--gold-primary);
    box-shadow: 0 0 20px var(--gold-glow);
}

.coin-heads {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
    color: var(--bg-primary);
}

.coin-tails {
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
    color: var(--gold-primary);
    transform: rotateY(180deg);
}

.coin.flipping {
    animation: coinFlip 2s ease-in-out;
}

@keyframes coinFlip {
    0% { transform: rotateY(0deg) scale(1); }
    25% { transform: rotateY(900deg) scale(1.1); }
    50% { transform: rotateY(1800deg) scale(1); }
    75% { transform: rotateY(2700deg) scale(1.1); }
    100% { transform: rotateY(3600deg) scale(1); }
}

.result-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--gold-primary);
    text-shadow: 0 0 10px var(--gold-glow);

}

.dice-color-btn {

.dice-color-btn:hover {

}

.dice-color-btn.active {

    color: var(--bg-primary);

}

.color-preview {

    height: 18px;

    border: 2px solid rgba(255, 255, 255, 0.3);
}

.color-preview.red { background: linear-gradient(135deg, #dc3545, #c82333); }
.color-preview.orange { background: linear-gradient(135deg, #fd7e14, #e55100); }
.color-preview.blue { background: linear-gradient(135deg, #007bff, #0056b3); }
.color-preview.yellow { background: linear-gradient(135deg, #ffc107, #e0a800); }
.color-preview.pink { background: linear-gradient(135deg, #e83e8c, #d63384); }
.color-preview.green { background: linear-gradient(135deg, #28a745, #1e7e34); }
.color-preview.purple { background: linear-gradient(135deg, #6f42c1, #59359a); }

.dice-amount-btn {
    padding: 8px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    border: 2px solid var(--gold-primary);
}

.dice-amount-btn.active {
    background: var(--gold-primary);
    color: var(--bg-primary);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
}

.dice-animation {
    text-align: center;
}

.dice-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 1rem 0;
    min-height: 120px;
    align-items: center;
    perspective: 1000px;
}

.dice {
    width: 70px;
    height: 70px;
    position: relative;
    transform-style: preserve-3d;
    margin: 10px;
    transition: transform 0.3s ease-out;
}

.dice:not(.rolling):hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 8px 20px var(--gold-glow);
}

.dice-face {
    position: absolute;
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
    border: 3px solid var(--gold-primary);
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--gold-primary);
    box-shadow: 0 5px 15px var(--gold-glow);
}

.dice.rolling {
    animation: diceRoll 1.5s ease-in-out;
    filter: brightness(1.2) contrast(1.1);
}

.dice.rolling .dice-face {
    animation: diceFaceFlicker 1.5s ease-in-out;
}

@keyframes diceFaceFlicker {
    0%, 100% { opacity: 1; }
    10% { opacity: 0.8; }
    20% { opacity: 1; }
    30% { opacity: 0.9; }
    40% { opacity: 1; }
    50% { opacity: 0.7; }
    60% { opacity: 1; }
    70% { opacity: 0.8; }
    80% { opacity: 1; }
    90% { opacity: 0.9; }
}

@keyframes diceRoll {
    0% { 
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1) translateY(0px);
        box-shadow: 0 5px 15px var(--gold-glow);
    }
    10% { 
        transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg) scale(1.2) translateY(-20px);
        box-shadow: 0 15px 30px var(--gold-glow);
    }
    20% { 
        transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg) scale(1.1) translateY(-10px);
        box-shadow: 0 10px 25px var(--gold-glow);
    }
    30% { 
        transform: rotateX(540deg) rotateY(270deg) rotateZ(135deg) scale(1.3) translateY(-30px);
        box-shadow: 0 20px 40px var(--gold-glow);
    }
    40% { 
        transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(1.2) translateY(-15px);
        box-shadow: 0 15px 35px var(--gold-glow);
    }
    50% { 
        transform: rotateX(900deg) rotateY(450deg) rotateZ(225deg) scale(1.1) translateY(-5px);
        box-shadow: 0 8px 20px var(--gold-glow);
    }
    60% { 
        transform: rotateX(1080deg) rotateY(540deg) rotateZ(270deg) scale(1.2) translateY(-25px);
        box-shadow: 0 18px 38px var(--gold-glow);
    }
    70% { 
        transform: rotateX(1260deg) rotateY(630deg) rotateZ(315deg) scale(1.15) translateY(-10px);
        box-shadow: 0 12px 28px var(--gold-glow);
    }
    80% { 
        transform: rotateX(1440deg) rotateY(720deg) rotateZ(360deg) scale(1.05) translateY(-5px);
        box-shadow: 0 6px 18px var(--gold-glow);
    }
    90% { 
        transform: rotateX(1440deg) rotateY(720deg) rotateZ(360deg) scale(1.02) translateY(-2px);
        box-shadow: 0 3px 12px var(--gold-glow);
    }
    100% { 
        transform: rotateX(1440deg) rotateY(720deg) rotateZ(360deg) scale(1) translateY(0px);
        box-shadow: 0 5px 15px var(--gold-glow);
    }
}

/* Card Styles */
.card-setup {
    text-align: center;
}

.card-amount-btn {
    padding: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    border: 2px solid var(--gold-primary);
}

.card-amount-btn.active {
    background: var(--gold-primary);

    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
}

.card-animation {
    text-align: center;
}

.card-table {
    position: relative;
    min-height: 160px;
    margin: 1rem 0;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
    border-radius: 15px;
    padding: 10px;
}

.deck-area {
    position: absolute;
    right: 20px;
    top: 50%;

}

.card-deck {
    position: relative;
    width: 60px;
    height: 84px;
}

.deck-card {
    position: absolute;
    width: 50px;
    height: 70px;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
    border: 2px solid var(--gold-primary);

    box-shadow: 0 3px 10px var(--gold-glow);
}

.deck-card:nth-child(1) { transform: rotate(-2deg); }
.deck-card:nth-child(2) { transform: rotate(0deg); }
.deck-card:nth-child(3) { transform: rotate(2deg); }

.drawn-cards {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 100px;
    align-items: center;
}

.playing-card {
    width: 50px;
    height: 70px;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.9));
    border: 2px solid var(--gold-primary);
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: bold;
    box-shadow: 0 5px 15px var(--gold-glow);
    transition: all 0.3s ease;
    color: var(--gold-primary);
}

.playing-card.red {
    color: #dc3545;
}

.playing-card.black {
    color: #000;
}

.playing-card.drawing {
    animation: cardDraw 1s ease-out;
}

@keyframes cardDraw {
    0% { 
        transform: translateX(100px) rotateY(180deg); 
        opacity: 0;
    }
    50% { 
        transform: translateX(50px) rotateY(90deg); 
        opacity: 0.5;
    }
    100% { 
        transform: translateX(0) rotateY(0deg); 
        opacity: 1;
    }
}

/* Responsive Design */

    .fun-card {

@keyframes spin {

/* Rock Paper Scissors Styles */
.rps-setup {
    text-align: center;
}

.rps-theme-btn {
    padding: 8px;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    border: 2px solid var(--gold-primary);
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    margin-bottom: 5px;
    font-size: 0.9rem;
}

.rps-theme-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px var(--gold-glow);
    background: var(--gold-primary);
    color: var(--bg-primary);
}

.rps-theme-btn.active {
    background: var(--gold-primary);
    color: var(--bg-primary);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
}

.rps-rounds-btn {
    padding: 15px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 0.75rem;
    transition: all 0.3s ease;
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    border: 2px solid var(--gold-primary);
}

.rps-rounds-btn.active {
    background: var(--gold-primary);
    color: var(--bg-primary);
    border-color: var(--gold-primary);
    box-shadow: 0 0 15px var(--gold-glow);
}

.rps-game {
    text-align: center;
}

.rps-choices {
    margin: 2rem 0;
}

.rps-choice-btn {
    padding: 15px 8px;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    border: 2px solid var(--gold-primary);
    background: rgba(20, 20, 20, 0.8);
    color: var(--gold-primary);
    height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
}

.rps-choice-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px var(--gold-glow);
    background: var(--gold-primary);
    color: var(--bg-primary);
}

.rps-choice-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
}

.rps-choice-btn:not(:disabled) {
    pointer-events: auto;
    cursor: pointer;
    opacity: 1;
}

.choice-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none; /* Allow clicks to pass through to button */
}

.choice-preview img {
    max-width: 32px;
    max-height: 32px;
}

.choice-preview small {
    font-size: 0.8rem;
    font-weight: bold;
}

.rps-result {
    margin: 1.5rem 0;
}

#rps-score {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--gold-primary);
    text-shadow: 0 0 5px var(--gold-glow);
}

.rps-final-result {
    margin-top: 2rem;
}

.rps-arena {
    position: relative;
    height: 150px;
    margin: 1rem 0;
    overflow: hidden;
}

.rps-player-choice-animation,
.rps-ai-choice-animation {
    position: absolute;
    width: 80px;
    height: 80px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.rps-player-choice-animation {
    left: 0;
    animation: run-to-center-left 1.2s ease-out;
}

.rps-ai-choice-animation {
    right: 0;
    animation: run-to-center-right 1.2s ease-out;
}

@keyframes run-to-center-left {
    0% { 
        transform: translateX(-100px) scale(0.3); 
        opacity: 0;
    }
    15% { 
        transform: translateX(-60px) scale(0.7) rotate(-5deg); 
        opacity: 0.8;
    }
    30% { 
        transform: translateX(-30px) scale(0.9) rotate(8deg); 
    }
    45% { 
        transform: translateX(-10px) scale(1.0) rotate(-3deg); 
    }
    60% { 
        transform: translateX(calc(50% - 60px)) scale(1.1) rotate(-15deg); 
    }
    75% { 
        transform: translateX(calc(50% - 40px)) scale(1.2) rotate(-20deg); 
    }
    90% { 
        transform: translateX(calc(50% - 40px)) scale(1.1) rotate(-10deg); 
    }
    100% { 
        transform: translateX(calc(50% - 40px)) scale(1); 
    }
}

@keyframes run-to-center-right {
    0% { 
        transform: translateX(100px) scale(0.3); 
        opacity: 0;
    }
    15% { 
        transform: translateX(60px) scale(0.7) rotate(5deg); 
        opacity: 0.8;
    }
    30% { 
        transform: translateX(30px) scale(0.9) rotate(-8deg); 
    }
    45% { 
        transform: translateX(10px) scale(1.0) rotate(3deg); 
    }
    60% { 
        transform: translateX(calc(-50% + 60px)) scale(1.1) rotate(15deg); 
    }
    75% { 
        transform: translateX(calc(-50% + 40px)) scale(1.2) rotate(20deg); 
    }
    90% { 
        transform: translateX(calc(-50% + 40px)) scale(1.1) rotate(10deg); 
    }
    100% { 
        transform: translateX(calc(-50% + 40px)) scale(1); 
    }
}

#rps-round-result {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}

#rps-arena.show-result #rps-round-result {
    opacity: 1;
}


.winner {
    animation: winner-animation 1s 1s forwards;
}

.loser {
    animation: loser-animation 1s 1s forwards;
}

.tie {
    animation: tie-animation 1s 1s forwards;
}

@keyframes winner-animation {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.2) rotate(-8deg); filter: drop-shadow(0 0 20px var(--gold-primary)); }
    50% { transform: scale(1.3) rotate(8deg); filter: drop-shadow(0 0 25px var(--gold-primary)); }
    75% { transform: scale(1.1) rotate(-4deg); filter: drop-shadow(0 0 15px var(--gold-primary)); }
    100% { transform: scale(1.15) rotate(0deg); filter: drop-shadow(0 0 15px var(--gold-primary)); }
}

@keyframes winner-celebrate {
    0%, 100% { transform: scale(1.15) rotate(0deg); }
    25% { transform: scale(1.2) rotate(-5deg); }
    50% { transform: scale(1.25) rotate(5deg); }
    75% { transform: scale(1.2) rotate(-3deg); }
}

@keyframes loser-animation {
    0% { transform: scale(1); }
    10% { transform: scale(0.9) rotate(10deg); }
    25% { transform: scale(0.7) rotate(-25deg) translateY(-15px); filter: blur(1px); }
    40% { transform: scale(0.5) rotate(35deg) translateY(-30px) translateX(20px); opacity: 0.8; filter: blur(2px); }
    60% { transform: scale(0.3) rotate(-50deg) translateY(-60px) translateX(80px); opacity: 0.6; filter: blur(3px); }
    80% { transform: scale(0.15) rotate(70deg) translateY(-100px) translateX(200px); opacity: 0.3; filter: blur(4px); }
    100% { transform: scale(0.05) rotate(90deg) translateY(-150px) translateX(350px); opacity: 0; filter: blur(5px); }
}

@keyframes tie-animation {
    0% { transform: scale(1); }
    25% { transform: scale(1.1) rotate(5deg); }
    50% { transform: scale(1.2) rotate(-5deg); filter: drop-shadow(0 0 10px var(--gold-primary)); }
    75% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
}

/* Enhanced winner/loser positioning */
.rps-player-choice-animation.winner {
    left: calc(50% - 40px);
    animation: winner-animation 0.8s ease-out forwards, winner-celebrate 1s 0.8s ease-in-out infinite;
}

.rps-ai-choice-animation.winner {
    right: calc(50% - 40px);
    animation: winner-animation 0.8s ease-out forwards, winner-celebrate 1s 0.8s ease-in-out infinite;
}

.rps-player-choice-animation.loser {
    left: calc(50% - 40px);
    animation: collision-bounce-left 1.2s ease-out forwards;
}

.rps-ai-choice-animation.loser {
    right: calc(50% - 40px);
    animation: collision-bounce-right 1.2s ease-out forwards;
}

@keyframes winner-stay {
    to { 
        transform: scale(1.2); 
        filter: drop-shadow(0 0 15px var(--gold-primary));
    }
}

/* Enhanced battle impact effect */
.rps-arena.battle-impact::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(255,100,0,0.6) 30%, rgba(255,215,0,0) 70%);
    border-radius: 50%;
    opacity: 0;
    animation: battle-impact 0.8s ease-out;
    box-shadow: 0 0 30px rgba(255,215,0,0.5);
}

.rps-arena.battle-impact::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,215,0,0.8) 50%, transparent 100%);
    border-radius: 50%;
    opacity: 0;
    animation: battle-impact-core 0.6s ease-out 0.1s;
}

@keyframes battle-impact {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1.8); opacity: 0.9; }
    60% { transform: translate(-50%, -50%) scale(2.2); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
}

@keyframes battle-impact-core {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
}

/* Enhanced collision animations */
@keyframes collision-bounce-left {
    0% { transform: translateX(calc(50% - 40px)) scale(1); }
    20% { transform: translateX(calc(50% - 20px)) scale(1.3) rotate(-25deg); }
    40% { transform: translateX(calc(50% - 10px)) scale(1.4) rotate(-45deg); }
    60% { transform: translateX(calc(50% + 30px)) scale(1.1) rotate(-90deg); }
    80% { transform: translateX(calc(50% + 80px)) scale(0.8) rotate(-120deg); }
    100% { transform: translateX(calc(50% + 150px)) scale(0.4) rotate(-180deg); opacity: 0; }
}

@keyframes collision-bounce-right {
    0% { transform: translateX(calc(-50% + 40px)) scale(1); }
    20% { transform: translateX(calc(-50% + 20px)) scale(1.3) rotate(25deg); }
    40% { transform: translateX(calc(-50% + 10px)) scale(1.4) rotate(45deg); }

    // Coin Flip Methods
    async flipCoin() {
        const setup = document.getElementById('coin-setup');
        const animation = document.getElementById('coin-animation');
        const coin = document.getElementById('coin');
        const resultText = document.getElementById('coin-result-text');
        
        setup.classList.add('d-none');
        animation.classList.remove('d-none');
        
        const theme = this.coinThemes[this.coinTheme];
        
        // Set coin faces
        const headsFace = coin.querySelector('.coin-heads');
        const tailsFace = coin.querySelector('.coin-tails');
        
        console.log('Setting coin faces:', {
            theme: theme,
            emojiDataAvailable: !!this.emojiData,
            headsEmoji: this.emojiData ? (this.emojiData[theme.heads] || theme.headsEmoji) : theme.headsEmoji,
            tailsEmoji: this.emojiData ? (this.emojiData[theme.tails] || theme.tailsEmoji) : theme.tailsEmoji
        });
        
        if (this.emojiData) {
            const headsEmoji = this.emojiData[theme.heads] || `/web/Emojis/Coins/${theme.heads}.png`;
        const tailsEmoji = this.emojiData[theme.tails] || `/web/Emojis/Coins/${theme.tails}.png`;
            
            // Check if it's an image URL (local or remote) or a Unicode emoji
            // All emojis are now image paths from the Emojis directory
            headsFace.innerHTML = `<img src="${headsEmoji}" style="width: 80px; height: 80px; object-fit: contain;">`;
            tailsFace.innerHTML = `<img src="${tailsEmoji}" style="width: 80px; height: 80px; object-fit: contain;">`;
        } else {
            // Fallback to theme emojis (which are now image paths)
            headsFace.innerHTML = `<img src="${theme.headsEmoji}" style="width: 80px; height: 80px; object-fit: contain;">`;
            tailsFace.innerHTML = `<img src="${theme.tailsEmoji}" style="width: 80px; height: 80px; object-fit: contain;">`;
        }
        
        // Animate coin flip
        coin.classList.add('flipping');
        
        // Call API for actual flip result
        try {
            const response = await fetch(`/api/fun/coin-flip?theme=${encodeURIComponent(this.coinTheme)}`);
            if (response.ok) {
                const result = await response.json();
                
                setTimeout(() => {
                    coin.classList.remove('flipping');
                    
                    // Show final result
                    if (result.result === 'heads') {
                        coin.style.transform = 'rotateY(0deg)';
                    } else {
                        coin.style.transform = 'rotateY(180deg)';
                    }
                    
                    resultText.innerHTML = `It landed on <strong>${result.result.toUpperCase()}</strong>!`;
                    resultText.classList.add('fade-in');
                }, 2000);
            } else {
                throw new Error('API error');
            }
        } catch (error) {
            console.error('Error calling coin flip API:', error);
            // Fallback to client-side random
            const isHeads = Math.random() < 0.5;
            const result = isHeads ? 'heads' : 'tails';
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                
                // Show final result
                if (isHeads) {
                    coin.style.transform = 'rotateY(0deg)';
                } else {
                    coin.style.transform = 'rotateY(180deg)';
                }
                
                resultText.innerHTML = `It landed on <strong>${result.toUpperCase()}</strong>!`;
                resultText.classList.add('fade-in');
            }, 2000);
        }
    }
    
    resetCoin() {
        document.getElementById('coin-setup').classList.remove('d-none');
        document.getElementById('coin-animation').classList.add('d-none');

    // Helper method to get dice face content
    getDiceFace(value, color) {
        const emojiName = `${color}${value}`;
        if (this.emojiData && this.emojiData[emojiName]) {
            const emoji = this.emojiData[emojiName];
            if (emoji.includes('.png') || emoji.includes('/')) {
                return `<img src="${emoji}" style="width: 70px; height: 70px; object-fit: contain;">`;
            } else {
                return emoji;
            }
        } else {
            return value;
        }
    }
    
    // Dice Roll Methods
    checkDiceReady() {
        if (this.diceColor && this.diceAmount) {
            document.getElementById('roll-dice-btn').disabled = false;
        }
    }
    
    async rollDice() {
        const setup = document.getElementById('dice-setup');
        const animation = document.getElementById('dice-animation');
        const container = document.getElementById('dice-container');
        const resultText = document.getElementById('dice-result-text');
        
        setup.classList.add('d-none');
        animation.classList.remove('d-none');
        
        container.innerHTML = '';
        
        // Call API for dice roll
        try {
            const response = await fetch(`/api/fun/dice-roll?color=${encodeURIComponent(this.diceColor)}&amount=${this.diceAmount}`);
            if (response.ok) {
                const result = await response.json();
                
                console.log('Dice API response:', result);
                
                // Create dice with API results
                result.rolls.forEach((roll, index) => {
                    console.log('Processing dice roll:', roll);
                    const dice = document.createElement('div');
                    dice.className = 'dice rolling';
                    
                    const face = document.createElement('div');
                    face.className = 'dice-face';
                    
                    // Start with random face for rolling effect
                    const startValue = Math.floor(Math.random() * 6) + 1;
                    face.innerHTML = this.getDiceFace(startValue, this.diceColor);
                    
                    dice.appendChild(face);
                    container.appendChild(dice);
                    
                    // Cycle through faces during rolling
                    let rollCount = 0;
                    const rollInterval = setInterval(() => {
                        rollCount++;
                        const currentValue = Math.floor(Math.random() * 6) + 1;
                        face.innerHTML = this.getDiceFace(currentValue, this.diceColor);
                        
                        if (rollCount >= 8) { // Show 8 different faces during roll
                            clearInterval(rollInterval);
                            // Show final result
                            if (roll.emoji) {
                                if (roll.emoji.includes('.png') || roll.emoji.includes('/')) {
                                    face.innerHTML = `<img src="${roll.emoji}" style="width: 70px; height: 70px; object-fit: contain;">`;
                                } else {
                                    face.innerHTML = roll.emoji;
                                }
                            } else {
                                face.innerHTML = roll.value;
                            }
                        }
                    }, 150);
                    
                    // Stagger animation - wait for face cycling to complete
                setTimeout(() => {
                    dice.classList.remove('rolling');
                    // Add bounce effect
                    dice.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        dice.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            dice.style.transform = 'scale(1)';
                        }, 100);
                    }, 100);
                }, 1500 + (index * 200) + 1200); // Extra 1200ms for face cycling (8 * 150ms)
                });
                
                // Show result after all dice have finished cycling faces
                setTimeout(() => {
                    const rollValues = result.rolls.map(r => r.value);
                    resultText.innerHTML = `You rolled: ${rollValues.join(', ')}<br><strong>Total: ${result.total}</strong>`;
                    resultText.classList.add('fade-in');
                }, 1500 + (result.rolls.length * 200) + 1200); // Extra 1200ms for face cycling
            } else {
                throw new Error('API error');
            }
        } catch (error) {
            console.error('Error calling dice roll API:', error);
            console.log('Falling back to client-side dice roll with local emoji data');
            // Fallback to client-side random
            const rolls = [];
            for (let i = 0; i < this.diceAmount; i++) {
                const roll = Math.floor(Math.random() * 6) + 1;
                rolls.push(roll);
                
                const dice = document.createElement('div');
                dice.className = 'dice rolling';
                
                const face = document.createElement('div');
                face.className = 'dice-face';
                
                // Start with random face for rolling effect
                const startValue = Math.floor(Math.random() * 6) + 1;
                face.innerHTML = this.getDiceFace(startValue, this.diceColor);
                
                dice.appendChild(face);
                container.appendChild(dice);
                
                // Cycle through faces during rolling
                let rollCount = 0;
                const rollInterval = setInterval(() => {
                    rollCount++;
                    const currentValue = Math.floor(Math.random() * 6) + 1;
                    face.innerHTML = this.getDiceFace(currentValue, this.diceColor);
                    
                    if (rollCount >= 8) { // Show 8 different faces during roll
                        clearInterval(rollInterval);
                        // Show final result
                        face.innerHTML = this.getDiceFace(roll, this.diceColor);
                    }
                }, 150);
                
                // Stagger animation
                setTimeout(() => {
                    dice.classList.remove('rolling');
                    // Add bounce effect
                    dice.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        dice.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            dice.style.transform = 'scale(1)';
                        }, 100);
                    }, 100);
                }, 1500 + (i * 200) + 1200); // Extra 1200ms for face cycling
            }
            
            // Show result after all dice have finished cycling faces
            setTimeout(() => {
                const total = rolls.reduce((a, b) => a + b, 0);
                resultText.innerHTML = `You rolled: ${rolls.join(', ')}<br><strong>Total: ${total}</strong>`;
                resultText.classList.add('fade-in');
            }, 1500 + (this.diceAmount * 200) + 1200); // Extra 1200ms for face cycling
        }
    }
    
    resetDice() {
        document.getElementById('dice-setup').classList.remove('d-none');
        document.getElementById('dice-animation').classList.add('d-none');
        document.getElementById('dice-result-text').classList.remove('fade-in');

        document.querySelectorAll('.dice-amount-btn').forEach(b => b.classList.remove('active'));
    }

        const animation = document.getElementById('card-animation');

        try {

            if (response.ok) {
                const result = await response.json();
                
                // Draw cards with API results
                result.cards.forEach((card, index) => {
                    setTimeout(() => {
                        console.log('Drawing card from API:', {
                            card: card.card,
                            suit: card.suit,
                            emojiDataAvailable: !!this.emojiData,
                            emojiFound: this.emojiData ? this.emojiData[card.card] : 'not found'
                        });
                        
                        const cardElement = document.createElement('div');
                        cardElement.className = `playing-card ${this.getCardColor(card.card)} drawing`;
                        
                        // Get card value
                        let value = card.card.substring(1);
                        if (value === 'J') value = 'J';
                        else if (value === 'Q') value = 'Q';
                        else if (value === 'K') value = 'K';
                        else if (value === 'LJ') value = '🃏';
                        else if (value === 'BJ') value = '🃏';
                        
                        // Get emoji if available
                        if (this.emojiData && this.emojiData[card.card]) {

                            cardElement.innerHTML = `${value}<br><small>${symbol}</small>`;
                        }
                        
                        drawnCards.appendChild(cardElement);
                    }, index * 300);
                });
                
                // Show result
                setTimeout(() => {
                    const cardNames = result.cards.map(card => {
                        let name = card.card;
                        if (name.startsWith('H')) return name.replace('H', '♥️');
                        if (name.startsWith('D')) return name.replace('D', '♦️');
                        if (name.startsWith('C')) return name.replace('C', '♣️');
                        if (name.startsWith('S')) return name.replace('S', '♠️');
                        return name;
                    });
                    
                    resultText.innerHTML = `You drew ${this.cardAmount} card${this.cardAmount > 1 ? 's' : ''}:<br><strong>${cardNames.join(', ')}</strong>`;
                    resultText.classList.add('fade-in');
                }, result.cards.length * 300 + 500);
            } else {
                throw new Error('API error');
            }
        } catch (error) {
            console.error('Error calling card draw API:', error);
            console.log('Falling back to client-side card draw with local emoji data');
            // Fallback to client-side random
            this.drawCardsFallback();
        }
    }

    processRPSResult(result, playerChoice, playerAnimation, aiAnimation) {
        this.rpsPlayerHistory.push(playerChoice);

        setTimeout(() => {
            let resultText = '';
            const arena = document.getElementById('rps-arena');
            
            if (result.winner === 'player') {
                this.rpsPlayerScore++;
                resultText = `You win! ${playerChoice} beats ${result.aiChoice}`;
                playerAnimation.classList.add('winner');
                aiAnimation.classList.add('loser');
            } else if (result.winner === 'ai') {
                this.rpsAiScore++;
                resultText = `AI wins! ${result.aiChoice} beats ${playerChoice}`;
                aiAnimation.classList.add('winner');
                playerAnimation.classList.add('loser');
            } else {
                resultText = `It's a tie!`;
                playerAnimation.classList.add('tie');
                aiAnimation.classList.add('tie');
            }

            // Add battle impact and collision effects
            arena.classList.add('battle-impact', 'battle-collision');
            
            document.getElementById('rps-round-result').innerHTML = resultText;
            this.updateRPSScore();

            // Show result text and action buttons
            arena.classList.add('show-result');
            
            // Show action buttons
            document.getElementById('rps-result-actions').classList.remove('d-none');

            // Don't automatically continue - wait for user action
            // The winner will stay in the center until Play Again or Reset is clicked
        }, 1800); // Wait for dancing and collision animation to complete
    }

        const choices = this.getRPSChoices();
        const aiChoice = choices[Math.floor(Math.random() * choices.length)];
        
        this.rpsPlayerHistory.push(playerChoice);
        
        let result = this.getRPSWinner(playerChoice, aiChoice);

    prepareSlots() {
        const reels = document.querySelectorAll('.slots-reel');
        const theme = this.slotsTheme.replace(/ /g, '');
        const emojiCategory = this.getEmojiCategoryForTheme(theme);
        let emojis = [];
        
        // For Insanity theme, combine all emojis from all categories
        if (emojiCategory === 'All') {
            // Combine all emojis from all categories
            for (const category in this.emojiCategories) {
                if (category !== 'All') { // Avoid infinite recursion
                    emojis = emojis.concat(this.emojiCategories[category]);
                }
            }
        } else {
            emojis = this.emojiCategories[emojiCategory] || [];
        }
        
        if (emojis.length === 0) {
            console.error(`No emojis found for category: ${emojiCategory}`);
            return;
        }

        reels.forEach(reel => {
            let reelHtml = '';
            for (let i = 0; i < 20; i++) { // Populate with 20 emojis for a good visual
                const randomEmojiName = emojis[Math.floor(Math.random() * emojis.length)];
                let emojiUrl = this.emojiData[randomEmojiName];
                    if (!emojiUrl) {
                        // Determine the correct path based on emoji type
                        let basePath = '/web/Emojis/Pets/';
                        if (this.slotsTheme === 'Easy') {
                            basePath = '/web/Emojis/Military/';
                        } else if (this.slotsTheme === 'Very Easy' || this.slotsTheme === 'Medium' || this.slotsTheme === 'Hard') {
                            basePath = '/web/Emojis/Pets/Deco/';
                        } else if (['soldier', 'tank', 'jet', 'ship'].includes(randomEmojiName)) {
                            basePath = '/web/Emojis/Military/'; // Military units
                        }
                        emojiUrl = `${basePath}${randomEmojiName}.png`;
                    }
                reelHtml += `<img src="${emojiUrl}" style="width: 70px; height: 70px; object-fit: contain; display: block; margin-bottom: 10px;">`;
            }
            reel.innerHTML = reelHtml;
        });
    }

    getEmojiCategoryForTheme(theme) {
        const themeMap = {
            'VeryEasy': 'Pet Type',
            'Easy': 'Units',
            'Medium': 'Stats',
            'Hard': 'Elements',
            'VeryHard': 'Pets',
            'Insanity': 'All'  // Special case for Insanity theme
        };
        return themeMap[theme];
    }

    async spinSlots() {
        if (this.slotsSpinning) {
            // Stop the spinning with decision animation
            this.stopSpinningWithDecision();
            return;
        }
        
        this.slotsSpinning = true;
        const spinBtn = document.getElementById('spin-slots-btn');
        spinBtn.textContent = 'Stop Spin';
        spinBtn.classList.remove('btn-primary');
        spinBtn.classList.add('btn-danger');

        const reels = document.querySelectorAll('.slots-reel');
        const resultText = document.getElementById('slots-result-text');
        resultText.innerHTML = '';

        // Start spinning animation
        reels.forEach((reel, index) => {
            setTimeout(() => {
                reel.classList.add('spinning');
            }, index * 200);
        });

        // Store the spin result for when user stops
        try {
            const response = await fetch('/api/fun/slots-spin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ theme: this.slotsTheme })
            });

            if (response.ok) {
                this.pendingResult = await response.json();
            } else {
                throw new Error('API error');
            }

            console.error('Error calling slots API:', error);

            this.pendingResult = null;

    stopSpinningWithDecision() {
        if (!this.slotsSpinning) return;
        
        const spinBtn = document.getElementById('spin-slots-btn');
        spinBtn.textContent = 'Start Spin';
        spinBtn.classList.remove('btn-danger');
        spinBtn.classList.add('btn-primary');
        
        this.stopSlotsWithDecision(this.pendingResult);
    }
    
    stopSlotsWithDecision(result) {
        const reels = document.querySelectorAll('.slots-reel');
        const finalPositions = [];
        const finalReels = result ? result.reels : [];

        reels.forEach((reel, index) => {
            setTimeout(() => {
                reel.classList.remove('spinning');
                const children = Array.from(reel.children);
                let finalEmojiData = finalReels[index] || null;
                let finalIndex = -1;

                if (finalEmojiData) {
                    const emojiPath = finalEmojiData.path;
                    finalIndex = children.findIndex(child => child.src.includes(emojiPath));
                }

                if (finalIndex === -1) {
                    finalIndex = Math.floor(Math.random() * children.length);
                }

                const target = children[finalIndex];
                const reelContainer = reel.parentElement;
                const reelContainerHeight = reelContainer.clientHeight;
                const emojiHeight = target.clientHeight;
                
                // Calculate the exact position to center the emoji
                const targetTop = target.offsetTop;
                const centerPosition = (reelContainerHeight / 2) - (emojiHeight / 2);
                const finalPosition = targetTop - centerPosition;

                // Create decision animation - back and forth before settling
                const decisionAnimation = () => {
                    // First, overshoot slightly
                    reel.style.transition = 'transform 0.3s ease-out';
                    reel.style.transform = `translateY(-${finalPosition - 10}px)`;
                    
                    setTimeout(() => {
                        // Then go back a bit
                        reel.style.transform = `translateY(-${finalPosition + 5}px)`;
                        
                        setTimeout(() => {
                            // Finally settle in the center
                            reel.style.transition = 'transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                            reel.style.transform = `translateY(-${finalPosition}px)`;
                            
                            // Add a small bounce effect after landing
                            setTimeout(() => {
                                reel.style.transition = 'transform 0.2s ease-out';
                                reel.style.transform = `translateY(-${finalPosition - 3}px)`;
                                setTimeout(() => {
                                    reel.style.transform = `translateY(-${finalPosition}px)`;
                                }, 200);
                            }, 400);
                        }, 300);
                    }, 300);
                };
                
                // Start the decision animation
                decisionAnimation();
                
                finalPositions.push(children[finalIndex].src);

                if (index === reels.length - 1) {
                    this.checkSlotsResult(result, finalPositions);
                }
            }, index * 600); // Slightly longer delay for decision animation
        });
    }
    
    stopSpinning() {
        if (!this.slotsSpinning) return;
        
        const spinBtn = document.getElementById('spin-slots-btn');
        spinBtn.textContent = 'Start Spin';
        spinBtn.classList.remove('btn-danger');
        spinBtn.classList.add('btn-primary');
        
        this.stopSlots(this.pendingResult);
    }

    stopSlots(result) {
        const reels = document.querySelectorAll('.slots-reel');
        const finalPositions = [];
        const finalReels = result ? result.reels : [];

        reels.forEach((reel, index) => {
            setTimeout(() => {
                reel.classList.remove('spinning');
                const children = Array.from(reel.children);
                let finalEmojiData = finalReels[index] || null;
                let finalIndex = -1;

                if (finalEmojiData) {
                    const emojiPath = finalEmojiData.path;
                    finalIndex = children.findIndex(child => child.src.includes(emojiPath));
                }

                if (finalIndex === -1) {
                    finalIndex = Math.floor(Math.random() * children.length);
                }

                const target = children[finalIndex];
                const reelContainer = reel.parentElement;
                const reelContainerHeight = reelContainer.clientHeight;
                const emojiHeight = target.clientHeight;
                
                // Calculate the exact position to center the emoji
                const targetTop = target.offsetTop;
                const centerPosition = (reelContainerHeight / 2) - (emojiHeight / 2);
                const finalPosition = targetTop - centerPosition;

                // Add a subtle bounce animation when stopping
                reel.style.transition = 'transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                reel.style.transform = `translateY(-${finalPosition}px)`;
                
                // Add a small bounce effect after landing
                setTimeout(() => {
                    reel.style.transition = 'transform 0.2s ease-out';
                    reel.style.transform = `translateY(-${finalPosition - 5}px)`;
                    setTimeout(() => {
                        reel.style.transform = `translateY(-${finalPosition}px)`;
                    }, 200);
                }, 800);
                
                finalPositions.push(children[finalIndex].src);

                if (index === reels.length - 1) {
                    this.checkSlotsResult(result, finalPositions);
                }
            }, index * 500);
        });
    }

    checkSlotsResult(result, finalPositions) {
        const resultText = document.getElementById('slots-result-text');
        
        if (result) {
            resultText.innerHTML = `<strong>${result.result_text}</strong>`;
        } else {
            const allSame = finalPositions.every(val => val === finalPositions[0]);
            const twoSame = new Set(finalPositions).size === 2;

            if (allSame) {
                resultText.innerHTML = '<strong>JACKPOT! 3 in a row!</strong>';
            } else if (twoSame) {
                resultText.innerHTML = '<strong>WIN! 2 in a row!</strong>';
            } else {
                resultText.innerHTML = 'Better luck next time!';
            }
        }

        // Show final combination odds if available
        if (this.slotsOdds && this.slotsTheme) {
            const odds = this.slotsOdds[this.slotsTheme];
            if (odds) {
                setTimeout(() => {
                    resultText.innerHTML += `<br><small class="text-muted" style="opacity: 0.8;">Odds: ${odds.three_match_odds} (3-match) | ${odds.two_match_odds} (2-match)</small>`;
                }, 1000);
            }
        }

        document.getElementById('spin-slots-btn').classList.add('d-none');
        document.getElementById('slots-play-again').classList.remove('d-none');
        this.slotsSpinning = false;
    }

    resetSlots() {
        document.getElementById('slots-setup').classList.remove('d-none');
        document.getElementById('slots-game').classList.add('d-none');
        
        const spinBtn = document.getElementById('spin-slots-btn');
        spinBtn.classList.remove('d-none');
        spinBtn.textContent = 'Start Spin';
        spinBtn.classList.remove('btn-danger');
        spinBtn.classList.add('btn-primary');

        document.getElementById('slots-play-again').classList.add('d-none');
        document.getElementById('slots-result-text').innerHTML = '';
        this.slotsTheme = null;
        this.slotsSpinning = false;
        this.pendingResult = null;
        document.querySelectorAll('.slots-theme-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('start-slots-btn').disabled = true;
    }

    // Slots odds methods
    async loadSlotsOdds() {
        try {
            const response = await fetch('/api/fun/slots-odds');
            if (response.ok) {
                this.slotsOdds = await response.json();
            }
        } catch (error) {
            console.error('Error loading slots odds:', error);
            // Fallback odds
            this.slotsOdds = {
                "Very Easy": {"total_emojis": 3, "three_match_odds": "1 in 9", "two_match_odds": "1 in 3"},
                "Easy": {"total_emojis": 4, "three_match_odds": "1 in 16", "two_match_odds": "1 in 4"},
                "Medium": {"total_emojis": 6, "three_match_odds": "1 in 36", "two_match_odds": "1 in 6"},
                "Hard": {"total_emojis": 13, "three_match_odds": "1 in 169", "two_match_odds": "1 in 13"},
                "Very Hard": {"total_emojis": 95, "three_match_odds": "1 in 9,025", "two_match_odds": "1 in 95"},
                "Insanity": {"total_emojis": "100+", "three_match_odds": "1 in 10,000+", "two_match_odds": "1 in 100+"}
            };
        }
    }

    updateSlotsOdds() {
        if (!this.slotsOdds || !this.slotsTheme) return;
        
        const odds = this.slotsOdds[this.slotsTheme];
        if (odds) {
            const oddsInfo = document.getElementById('slots-odds-info');
            oddsInfo.innerHTML = `Odds: ${odds.three_match_odds} (3-match) | ${odds.two_match_odds} (2-match)`;
        }
    }
}

// This function will be called from the main dashboard
window.initializeFun = async () => {
    if (!window.funFeaturesInstance) {
        console.log("Initializing Fun page features...");
        window.funFeaturesInstance = new FunFeatures();
        await window.funFeaturesInstance.init();
        console.log("Fun page features initialized with emoji data.");
    } else {
        console.log("Fun page features already initialized.");
    }
};

// Self-initialize if the page is loaded directly
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', window.initializeFun);
} else {
    // If loaded dynamically, dashboard.html will call initializeFun()
    window.initializeFun();
}
</script>
