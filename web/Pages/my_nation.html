function mnUpdateFormFields(nation, cities) {
  const type = document.getElementById('mn-goal-type').value;
  const show = id => { const e = document.getElementById(id); if(e) e.style.display=''; };
  const hide = id => { const e = document.getElementById(id); if(e) e.style.display='none'; };

  ['mn-fg-city','mn-fg-infra','mn-fg-land','mn-fg-project','mn-fg-improvement','mn-fg-military','mn-fg-custom']
    .forEach(hide);

  switch(type) {
    case 'city':        show('mn-fg-city');        break;
    case 'infra':       show('mn-fg-infra');       break;
    case 'land':        show('mn-fg-land');        break;
    case 'project':     show('mn-fg-project');     break;
    case 'improvement': show('mn-fg-improvement'); break;
    case 'military':    show('mn-fg-military');    break;
    case 'custom':      show('mn-fg-custom');      break;
  }

  // Auto-fill current value
  if (type === 'city') {
    const inp = document.getElementById('mn-goal-city-target');
    if (inp && !inp.value) inp.value = (nation.num_cities || 0) + 1;
  }
  if (type === 'infra') {
    const cityEl = document.getElementById('mn-goal-infra-city');
    const tgtEl  = document.getElementById('mn-goal-infra-target');
    if (cityEl && tgtEl && !tgtEl.value) {
      const selOpt = cityEl.options[cityEl.selectedIndex];
      const curInfra = selOpt ? parseFloat(selOpt.dataset.infra || 0) : 0;
      tgtEl.placeholder = Math.ceil(curInfra + 500);
    }
  }
  if (type === 'land') {
    const cityEl = document.getElementById('mn-goal-land-city');
    const tgtEl  = document.getElementById('mn-goal-land-target');
    if (cityEl && tgtEl && !tgtEl.value) {
      const selOpt = cityEl.options[cityEl.selectedIndex];
      const curLand = selOpt ? parseFloat(selOpt.dataset.land || 0) : 0;
      tgtEl.placeholder = Math.ceil(curLand + 500);
    }
  }
  if (type === 'military') {
    const unitEl = document.getElementById('mn-goal-mil-unit');
    const tgtEl  = document.getElementById('mn-goal-mil-target');
    if (unitEl && tgtEl && !tgtEl.value) {
      const cur = nation[unitEl.value] || 0;
      tgtEl.placeholder = cur + 10000;
    }
  }
}

function mnTriggerCostPreview(nationId) {
  if (_costDebounce) clearTimeout(_costDebounce);
  _costDebounce = setTimeout(() => mnFetchCostPreview(nationId), 300);
}

async function mnFetchCostPreview(nationId) {
  const typeEl = document.getElementById('mn-goal-type');
  const previewEl = document.getElementById('mn-cost-preview');
  if (!typeEl || !previewEl) return;

  const type = typeEl.value;
  if (type === 'custom') {
    const cash = parseFloat(document.getElementById('mn-goal-custom-cash').value) || 0;
    const rev  = _currentData && _currentData.revenue;
    const ncd  = rev ? (rev.net_cash_turn || 0) * 12 : 0;
    const daysStr = ncd > 0 && cash > 0 ? `~${(cash/ncd).toFixed(0)} days` : 'N/A';
    previewEl.innerHTML = `<div class="mn-cost-preview-title">💰 Estimated Cost</div>
      <div class="mn-cost-preview-cash">${$m(cash)}</div>
      <div class="mn-cost-preview-days">⏱ <strong>${daysStr}</strong></div>`;
    return;
  }

  const params = new URLSearchParams({ nation_id: nationId, type });
  const nation = _currentData && _currentData.nation;
  const cities = _currentData && _currentData.cities || [];

  try {
    if (type === 'city') {
      const tgt = parseFloat(document.getElementById('mn-goal-city-target').value);
      if (!tgt || !nation) return;
      params.set('current', nation.num_cities || 0);
      params.set('target', tgt);
    } else if (type === 'infra') {
      const cityEl  = document.getElementById('mn-goal-infra-city');
      const tgtEl   = document.getElementById('mn-goal-infra-target');
      const tgt = parseFloat(tgtEl.value);
      if (!tgt) return;
      const cityId  = cityEl.value ? parseInt(cityEl.value) : null;
      const city    = cityId ? cities.find(c => c.id === cityId) : (cities[0] || {});
      const current = city ? (city.infrastructure || 0) : 0;
      params.set('current', current);
      params.set('target', tgt);
      if (cityId) params.set('city_id', cityId);
    } else if (type === 'land') {
      const cityEl  = document.getElementById('mn-goal-land-city');
      const tgtEl   = document.getElementById('mn-goal-land-target');
      const tgt = parseFloat(tgtEl.value);
      if (!tgt) return;
      const cityId  = cityEl.value ? parseInt(cityEl.value) : null;
      const city    = cityId ? cities.find(c => c.id === cityId) : (cities[0] || {});
      const current = city ? (city.land || 0) : 0;
      params.set('current', current);
      params.set('target', tgt);
      if (cityId) params.set('city_id', cityId);
    } else if (type === 'project') {
      const col = document.getElementById('mn-goal-project-col').value;
      if (!col) return;
      params.set('current', 0);
      params.set('target', 1);
      params.set('project_col', col);
    } else if (type === 'improvement') {
      const col     = document.getElementById('mn-goal-imp-col').value;
      const cityId  = parseInt(document.getElementById('mn-goal-imp-city').value);
      const tgt     = parseFloat(document.getElementById('mn-goal-imp-target').value);
      if (!col || !tgt) return;
      const city    = cities.find(c => c.id === cityId) || {};
      const current = city[col] || 0;
      params.set('current', current);
      params.set('target', tgt);
      params.set('city_id', cityId);
      params.set('improvement', col);
    } else if (type === 'military') {
      const unit = document.getElementById('mn-goal-mil-unit').value;
      const tgt  = parseFloat(document.getElementById('mn-goal-mil-target').value);
      if (!unit || !tgt || !nation) return;
      params.set('current', nation[unit] || 0);
      params.set('target', tgt);
      params.set('unit', unit);
    }

    const r    = await fetch('/api/mynation/cost-preview?' + params.toString());
    const data = await r.json();

    const rscBits = Object.entries(data.resources || {})
      .filter(([,v]) => v > 0)
      .map(([k,v]) => {
        const ico = RSC_ICONS[k] ? `<img src="/static/Emojis/Resources/${RSC_ICONS[k]}.png" class="mn-icon-sm" alt="">` : '';
        return `<span class="mn-cost-preview-rsc-item">${ico} ${$n(v,0)} ${k}</span>`;
      }).join('');

    const days = data.days_to_goal;
    const daysStr = days != null ? `~${parseFloat(days).toFixed(0)} days at ${$m((_currentData&&_currentData.revenue||{}).net_cash_turn||0)*12 }/day` : 'N/A (negative revenue)';

    previewEl.innerHTML = `
      <div class="mn-cost-preview-title">💰 Estimated Cost</div>
      <div class="mn-cost-preview-cash">${$m(data.cash)}</div>
      ${rscBits ? `<div class="mn-cost-preview-rsc">${rscBits}</div>` : ''}
      <div class="mn-cost-preview-days">⏱ <strong>${daysStr}</strong></div>
      ${data.breakdown ? `<div style="font-size:0.7rem;color:var(--text-secondary);margin-top:0.2rem">${esc(data.breakdown)}</div>` : ''}`;
  } catch(e) {
    previewEl.innerHTML = `<div class="mn-cost-preview-title">💰 Estimated Cost</div>
      <div style="color:#ef9a9a;font-size:0.78rem">Preview unavailable</div>`;
  }
}


async function mnSaveGoal() {
  const type  = document.getElementById('mn-goal-type').value;
  const label = (document.getElementById('mn-goal-label').value || '').trim();
  const notes = (document.getElementById('mn-goal-notes').value || '').trim();

  if (!label) { alert('Please enter a goal label.'); return; }
  if (!_currentNationId) { alert('No nation loaded.'); return; }

  let target_value = {};
  const nation = _currentData && _currentData.nation;
  const cities = _currentData && _currentData.cities || [];

  try {
    if (type === 'city') {
      const tgt = parseInt(document.getElementById('mn-goal-city-target').value);
      if (!tgt || isNaN(tgt)) { alert('Enter a valid target city count.'); return; }
      if (tgt <= (nation.num_cities || 0)) { alert('Target must be greater than current city count.'); return; }
      target_value = {num_cities: tgt};
    } else if (type === 'infra') {
      const cityId = document.getElementById('mn-goal-infra-city').value;
      const tgt    = parseFloat(document.getElementById('mn-goal-infra-target').value);
      if (!tgt || isNaN(tgt)) { alert('Enter a valid target infrastructure.'); return; }
      if (tgt < 10) { alert('Infrastructure must be at least 10.'); return; }
      if (tgt > 15000) { alert('Infrastructure cannot exceed 15,000.'); return; }
      target_value = {infra: tgt};
      if (cityId) {
        target_value.city_id = parseInt(cityId);
        const city = cities.find(c => c.id === target_value.city_id);
        if (city && tgt <= (city.infrastructure || 0)) {
          alert('Target must be greater than current infrastructure.');
          return;
        }
      }
    } else if (type === 'land') {
      const cityId = document.getElementById('mn-goal-land-city').value;
      const tgt    = parseFloat(document.getElementById('mn-goal-land-target').value);
      if (!tgt || isNaN(tgt)) { alert('Enter a valid target land.'); return; }
      if (tgt < 250) { alert('Land must be at least 250.'); return; }
      target_value = {land: tgt};
      if (cityId) {
        target_value.city_id = parseInt(cityId);
        const city = cities.find(c => c.id === target_value.city_id);
        if (city && tgt <= (city.land || 0)) {
          alert('Target must be greater than current land.');
          return;
        }
      }
    } else if (type === 'project') {
      const col = document.getElementById('mn-goal-project-col').value;
      if (!col) { alert('Select a project.'); return; }
      target_value = {project_col: col};
    } else if (type === 'improvement') {
      const col    = document.getElementById('mn-goal-imp-col').value;
      const cityId = parseInt(document.getElementById('mn-goal-imp-city').value);
      const tgt    = parseInt(document.getElementById('mn-goal-imp-target').value);
      if (!col || !tgt || isNaN(tgt) || isNaN(cityId)) { 
        alert('Fill in all improvement details.'); 
        return; 
      }
      if (tgt < 1) { alert('Target count must be at least 1.'); return; }
      if (tgt > 50) { alert('Target count cannot exceed 50.'); return; }
      const city = cities.find(c => c.id === cityId);
      if (city) {
        const current = city[col] || 0;
        if (tgt <= current) {
          alert(`Target count (${tgt}) must be greater than current (${current}).`);
          return;
        }
      }
      target_value = {improvement: col, city_id: cityId, count: tgt};
    } else if (type === 'military') {
      const unit = document.getElementById('mn-goal-mil-unit').value;
      const tgt  = parseInt(document.getElementById('mn-goal-mil-target').value);
      if (!unit || !tgt || isNaN(tgt)) { alert('Fill in military details.'); return; }
      if (tgt < 1) { alert('Target count must be at least 1.'); return; }
      const current = nation[unit] || 0;
      if (tgt <= current) {
        alert(`Target ${unit} (${tgt}) must be greater than current (${current}).`);
        return;
      }
      target_value = {unit, count: tgt};
    } else if (type === 'custom') {
      const cash = parseFloat(document.getElementById('mn-goal-custom-cash').value) || 0;
      target_value = {custom: true};
      if (cash > 0) target_value.cash = cash;
    }

    // Get estimated cost from preview
    let estimated_cost = {};
    const previewEl = document.getElementById('mn-cost-preview');
    // Re-fetch to ensure accuracy
    const params = new URLSearchParams({nation_id: _currentNationId, type});
    if (type === 'city') { 
      params.set('current', nation.num_cities||0); 
      params.set('target', target_value.num_cities); 
    } else if (type === 'infra') {
      const city = target_value.city_id ? cities.find(c=>c.id===target_value.city_id) : cities[0];
      params.set('current', city ? city.infrastructure||0 : 0);
      params.set('target', target_value.infra);
      if (target_value.city_id) params.set('city_id', target_value.city_id);
    } else if (type === 'land') {
      const city = target_value.city_id ? cities.find(c=>c.id===target_value.city_id) : cities[0];
      params.set('current', city ? city.land||0 : 0);
      params.set('target', target_value.land);
      if (target_value.city_id) params.set('city_id', target_value.city_id);
    } else if (type === 'project') { 
      params.set('current',0); 
      params.set('target',1); 
      params.set('project_col', target_value.project_col); 
    } else if (type === 'improvement') {
      const city = cities.find(c=>c.id===target_value.city_id)||{};
      params.set('current', city[target_value.improvement]||0);
      params.set('target', target_value.count);
      params.set('city_id', target_value.city_id);
      params.set('improvement', target_value.improvement);
    } else if (type === 'military') {
      params.set('current', nation[target_value.unit]||0);
      params.set('target', target_value.count);
      params.set('unit', target_value.unit);
    }

    if (type !== 'custom') {
      try {
        const cr = await fetch('/api/mynation/cost-preview?' + params.toString());
        const cd = await cr.json();
        estimated_cost = {money: cd.cash || 0, ...cd.resources};
      } catch(_) {}
    } else {
      estimated_cost = {money: target_value.cash || 0};
    }

    const r = await fetch('/api/mynation/goals', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        nation_id: _currentNationId,
        goal_type: type,
        goal_label: label,
        target_value,
        estimated_cost,
        notes,
      }),
    });
    
    if (!r.ok) { 
      const errorData = await r.json().catch(() => ({detail: 'Unknown error'}));
      throw new Error(errorData.detail || 'Save failed'); 
    }
    
    // Reset form
    document.getElementById('mn-add-goal-form').reset();
    document.getElementById('mn-cost-preview').innerHTML =
      '<div class="mn-cost-preview-title">💰 Estimated Cost</div><div style="color:var(--text-secondary);font-size:0.78rem">Fill in the form to see cost estimate.</div>';
    
    // Switch back to goals tab and refresh
    const tabs = document.querySelectorAll('.mn-planner-tab');
    if (tabs.length) { tabs.forEach(t=>t.classList.remove('active')); tabs[0].classList.add('active'); }
    const panels = document.querySelectorAll('.mn-planner-panel');
    panels.forEach(p => p.classList.toggle('active', p.id === 'mn-tab-goals'));
    
    await refreshGoals(_currentNationId);
    
    // Show success message
    showStatus('✅ Goal created successfully!', false);
  } catch(e) { 
    alert('Failed to save goal: ' + e.message); 
  }
}


// ── Core fetch + render orchestration ────────────────────────────────────────
async function analyzeNation(nationId) {
  if (!nationId) return;
  _currentNationId = parseInt(nationId);
  showStatus('Loading nation data…', false);

  try {
    const r = await fetch(`/api/mynation/${_currentNationId}`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({detail:'Unknown error'}));
      showStatus(err.detail || 'Failed to load nation.', true);
      return;
    }
    const data = await r.json();
    _currentData    = data;
    _newlyCompleted = data.newly_completed_goals || [];

    hideStatus();

    const nation  = data.nation  || {};
    const cities  = data.cities  || [];
    const revenue = data.revenue || {};
    const goals   = data.goals   || [];
    const prices  = data.prices  || {};

    renderNation(nation, cities, revenue);
    renderRevenue(revenue, prices);
    renderCities(cities, _currentNationId);
    renderPlanner(goals, nation, cities, revenue);
    renderCombat(_currentNationId, nation.alliance_id);

    // Highlight newly completed goals
    if (_newlyCompleted.length) {
      _newlyCompleted.forEach(id => {
        const el = document.getElementById(`mn-goal-${id}`);
        if (el) { el.classList.add('mn-pulse'); setTimeout(() => el.classList.remove('mn-pulse'), 4500); }
      });
    }

    // Also trigger client-side check-completion
    checkCompletion(_currentNationId);

  } catch(e) {
    showStatus('Error loading nation: ' + e.message, true);
  }
}

async function checkCompletion(nationId) {
  try {
    const r = await fetch(`/api/mynation/goals/check-completion/${nationId}`, {method:'POST'});
    const data = await r.json();
    if (data.completed && data.completed.length) {
      data.completed.forEach(id => {
        const el = document.getElementById(`mn-goal-${id}`);
        if (el) {
          el.classList.add('mn-pulse');
          setTimeout(() => { el.classList.remove('mn-pulse'); el.classList.remove('pending'); el.classList.add('completed'); }, 4500);
        }
      });
      // Refresh goals list after a moment
      setTimeout(() => refreshGoals(nationId), 5000);
    }
  } catch(_) { /* silent */ }
}

async function loadAutoFill() {
  try {
    const r    = await fetch('/api/settings');
    const data = await r.json();
    const lid  = data.linked_nation_id;
    if (lid) {
      await analyzeNation(lid);
    } else {
      showStatus('No nation linked. Sync your nation in Settings.', true);
    }
  } catch(_) { showStatus('Could not load your nation. Check Settings.', true); }
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  loadAutoFill();

  document.getElementById('mn-refresh-btn').addEventListener('click', () => {
    if (_currentNationId) {
      fetch(`/api/mynation/${_currentNationId}?refresh=true`)
        .then(r => r.json())
        .then(data => {
          _currentData    = data;
          _newlyCompleted = data.newly_completed_goals || [];
          const n = data.nation||{}, c = data.cities||[], rev = data.revenue||{}, g = data.goals||[], p = data.prices||{};
          renderNation(n, c, rev);
          renderRevenue(rev, p);
          renderCities(c, _currentNationId);
          renderPlanner(g, n, c, rev);
          renderCombat(_currentNationId, n.alliance_id);
          recomputeDaysToGoal(g, rev);
        })
        .catch(e => showStatus('Refresh failed: ' + e.message, true));
    }
  });
}

document.addEventListener('dashboardPageLoaded', function(e) {
  if (e.detail.page !== 'my_nation.html') return;
  init();
});

})(); // end IIFE
</script>
