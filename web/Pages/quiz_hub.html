<div class="quiz-page" id="quiz-page">
    <section class="quiz-layout">
        <aside class="quiz-list-panel">
            <div class="quiz-panel-header">
                <span>Available Quizzes</span>
                <button class="quiz-icon-button" id="quiz-reload" type="button" title="Reload quizzes" aria-label="Reload quizzes">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div class="quiz-list" id="quiz-list" aria-live="polite">
                <article class="quiz-empty">
                    <span class="quiz-emoji" aria-hidden="true">❓</span>
                    <h2>Loading quizzes.</h2>
                </article>
            </div>
        </aside>

        <main class="quiz-stage" id="quiz-stage" aria-live="polite">
            <article class="quiz-empty">
                <span class="quiz-emoji" aria-hidden="true">❓</span>
                <h2>Select a quiz.</h2>
                <p>The Alliance Role quiz will decide the strongest match across 1ic, 2ic, MA, FA, IA, EI, TA, and JA.</p>
            </article>
        </main>
    </section>
</div>
