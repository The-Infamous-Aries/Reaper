<script>
// Function to convert Discord markdown to HTML (from license.html)
function discordMarkdownToHtml(text) {
    // Convert headers (# ## ###)
    text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    
    // Convert bold text (**text**)
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    
    // Convert horizontal rules (---)
    text = text.replace(/^---+$/gm, '<hr>');
    
    // Convert numbered lists (1. 2. 3.)
    text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    
    // Convert bullet points (* text) - but not if they're already part of numbered lists
    text = text.replace(/^\* ([^\d].+)$/gm, '<li>$1</li>');
    
    // Wrap consecutive list items in <ol> or <ul> tags
    text = text.replace(/(<li>\d+\. .+<\/li>\s*)+/g, function(match) {
        return '<ol>' + match.replace(/<li>(\d+\.)?\s*(.+)<\/li>/g, '<li>$2</li>') + '</ol>';
    });
    
    text = text.replace(/(<li>[^<]+<\/li>\s*)+/g, function(match) {
        if (!match.includes('<ol>')) {
            return '<ul>' + match + '</ul>';
        }
        return match;
    });
    
    // Convert line breaks to <br> tags for better formatting, but not inside HTML tags
    text = text.replace(/(?<!<[^>]*)\n/g, '<br>');
    
    return text;
}

// Toggle functionality
function showContent(type) {
    const readmeContent = document.getElementById('readme-content');
    const licenseContent = document.getElementById('license-content');
    const pythonDepsContent = document.getElementById('python-deps-content');
    const jsModulesContent = document.getElementById('js-modules-content');
    const readmeToggle = document.getElementById('readme-toggle');
    const licenseToggle = document.getElementById('license-toggle');
    const pythonDepsToggle = document.getElementById('python-deps-toggle');
    const jsModulesToggle = document.getElementById('js-modules-toggle');
    const contentTitle = document.getElementById('content-title');
    
    // Hide all content sections
    readmeContent.style.display = 'none';
    licenseContent.style.display = 'none';
    pythonDepsContent.style.display = 'none';
    jsModulesContent.style.display = 'none';
    
    // Remove active class from all toggles
    readmeToggle.classList.remove('active');
    licenseToggle.classList.remove('active');
    pythonDepsToggle.classList.remove('active');
    jsModulesToggle.classList.remove('active');
    
    if (type === 'readme') {
        readmeContent.style.display = 'block';
        readmeToggle.classList.add('active');
        contentTitle.textContent = 'README Documentation';
    } else if (type === 'license') {
        licenseContent.style.display = 'block';
        licenseToggle.classList.add('active');
        contentTitle.textContent = 'License Information';
    } else if (type === 'python-deps') {
        pythonDepsContent.style.display = 'block';
        pythonDepsToggle.classList.add('active');
        contentTitle.textContent = 'Python Dependencies';
    } else if (type === 'js-modules') {
        jsModulesContent.style.display = 'block';
        jsModulesToggle.classList.add('active');
        contentTitle.textContent = 'JavaScript Modules';
    }
}

// Load README content
fetch('/api/readme')
    .then(response => response.json())
    .then(data => {
        if (data.content) {
            document.getElementById('readme-content').innerHTML = data.content;
        } else {
            document.getElementById('readme-content').textContent = 'Error: ' + (data.error || 'Unknown error');
        }
    })
    .catch(error => {
        document.getElementById('readme-content').textContent = 'Error loading README content: ' + error.message;
    });

// Load License content
fetch('/api/license')
    .then(response => response.json())
    .then(data => {
        if (data.content) {
            const formattedContent = discordMarkdownToHtml(data.content);
            document.getElementById('license-content').innerHTML = formattedContent;
        } else {
            document.getElementById('license-content').textContent = 'Error: ' + (data.error || 'Unknown error');
        }
    })
    .catch(error => {
        document.getElementById('license-content').textContent = 'Error loading license content: ' + error.message;
    });

// Load Python Dependencies content
fetch('/api/dependencies')
    .then(response => response.json())
    .then(data => {
        console.log('Python deps API response:', data);
        if (data.categories) {
            displayPythonDependencies(data.categories);
        } else {
            document.getElementById('python-deps-content').textContent = 'Error: ' + (data.error || 'Unknown error');
        }
    })
    .catch(error => {
        console.error('Python deps error:', error);
        document.getElementById('python-deps-content').textContent = 'Error loading Python dependencies: ' + error.message;
    });

// Load JavaScript Modules content
fetch('/api/package-json')
    .then(response => response.json())
    .then(data => {
        console.log('JS modules API response:', data);
        if (data.categories) {
            displayJSModules(data.categories);
        } else {
            document.getElementById('js-modules-content').textContent = 'Error: ' + (data.error || 'Unknown error');
        }
    })
    .catch(error => {
        console.error('JS modules error:', error);
        document.getElementById('js-modules-content').textContent = 'Error loading JavaScript modules: ' + error.message;
    });

// Function to display Python dependencies
function displayPythonDependencies(categories) {
    console.log('displayPythonDependencies called with:', categories);
    const pythonDepsContent = document.getElementById('python-deps-content');
    let html = '<h1>🐍 Python Dependencies</h1>';
    
    for (const [category, packages] of Object.entries(categories)) {
        if (packages.length > 0) {
            html += `<div class="category-section">`;
            html += `<h2>${category}</h2>`;
            html += `<ul class="package-list">`;
            
            packages.forEach(pkg => {
                html += `<li class="package-item">${pkg}</li>`;
            });
            
            html += `</ul>`;
            html += `</div>`;
        }
    }
    
    console.log('Python deps HTML:', html);
    pythonDepsContent.innerHTML = html;
}

// Function to display JavaScript modules
function displayJSModules(categories) {
    console.log('displayJSModules called with:', categories);
    const jsModulesContent = document.getElementById('js-modules-content');
    let html = '<h1>📦 JavaScript Modules</h1>';
    
    for (const [category, packages] of Object.entries(categories)) {
        if (packages.length > 0) {
            html += `<div class="category-section">`;
            html += `<h2>${category}</h2>`;
            html += `<ul class="package-list">`;
            
            packages.forEach(pkg => {
                html += `<li class="package-item">${pkg}</li>`;
            });
            
            html += `</ul>`;
            html += `</div>`;
        }
    }
    
    console.log('JS modules HTML:', html);
    jsModulesContent.innerHTML = html;
}
</script>
