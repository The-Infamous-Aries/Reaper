<link rel="stylesheet" href="/css/nations.css">

<div class="nat-shell">

  <!-- Controls -->
  <div class="card nat-controls">
    <div class="card-header">
      <div>
        <p class="nat-kicker">Nights Watch</p>
        <p class="nat-title">Alliance Members</p>
      </div>
      <div class="nat-header-right">
        <!-- View toggle tabs -->
        <div class="nat-view-tabs">
          <button class="nat-view-tab active" id="tab-nations" data-view="nations">
            <img src="/static/Emojis/Activity/total.png" class="nat-icon-sm" alt="">
            <span id="nat-count">—</span> Nations
          </button>
          <button class="nat-view-tab" id="tab-overview" data-view="overview">
            📊 Overview
          </button>
        </div>
        <input type="text" id="nat-search" class="nat-search" placeholder="Search nation or leader…">
        <button id="nat-refresh" class="btn btn-gold btn-sm">↻ Refresh</button>
      </div>
    </div>
  </div>

  <div id="nat-status" class="nat-status" style="display:none"></div>

  <!-- Nations view (table) -->
  <div id="view-nations" class="card nat-table-card">
    <div class="card-header">
      <span>Member Roster</span>
      <span id="nat-sort-summary" class="nat-sort-summary">Sorted by Score ↓</span>
    </div>
    <div class="card-body p-0">
      <div class="nat-table-wrap">
        <table id="nat-table">
          <thead>
            <tr>
              <th style="width:1.5rem"></th>
              <th data-col="nation_name">Nation</th>
              <th data-col="score" class="nat-sort-active">Score ↓</th>
              <th data-col="num_cities">Cities</th>
              <!-- Units dropdown sort -->
              <th class="nat-dropdown-th" data-group="units">
                <div class="nat-sort-ctrl" id="units-ctrl">
                  <div class="nat-units-label">
                    <img id="units-emoji" src="/static/Emojis/Military/soldier.png" class="nat-icon-sm" alt="">
                  </div>
                  <select id="units-select" class="nat-sort-select">
                    <option value="soldiers" data-img="soldier.png">Soldiers</option>
                    <option value="tanks" data-img="tank.png">Tanks</option>
                    <option value="aircraft" data-img="jet.png">Aircraft</option>
                    <option value="ships" data-img="ship.png">Ships</option>
                    <option value="missiles" data-img="missile.png">Missiles</option>
                    <option value="nukes" data-img="bomb.png">Nukes</option>
                  </select>
                  <button class="nat-sort-dir" data-group="units">↓</button>
                </div>
              </th>
              <!-- MMR — sortable by deficit from 5/5/5/3 -->
              <th data-col="city_agg.mmr_deficit">MMR</th>
              <!-- Infra dropdown sort -->
              <th class="nat-dropdown-th" data-group="infra">
                <div class="nat-sort-ctrl" id="infra-ctrl">
                  <select id="infra-select" class="nat-sort-select">
                    <option value="city_agg.avg_infra">Avg Infra</option>
                    <option value="city_agg.total_infra">Total Infra</option>
                  </select>
                  <button class="nat-sort-dir" data-group="infra">↓</button>
                </div>
              </th>
              <!-- Land dropdown sort -->
              <th class="nat-dropdown-th" data-group="land">
                <div class="nat-sort-ctrl" id="land-ctrl">
                  <select id="land-select" class="nat-sort-select">
                    <option value="city_agg.avg_land">Avg Land</option>
                    <option value="city_agg.total_land">Total Land</option>
                  </select>
                  <button class="nat-sort-dir" data-group="land">↓</button>
                </div>
              </th>
              <!-- Wars dropdown sort -->
              <th class="nat-dropdown-th" data-group="wars">
                <div class="nat-sort-ctrl" id="wars-ctrl">
                  <select id="wars-select" class="nat-sort-select">
                    <option value="wars_won">Wars Won</option>
                    <option value="wars_lost">Wars Lost</option>
                  </select>
                  <button class="nat-sort-dir" data-group="wars">↓</button>
                </div>
              </th>
              <!-- Improvements dropdown sort -->
              <th class="nat-dropdown-th" data-group="imps">
                <div class="nat-sort-ctrl" id="imps-ctrl">
                  <select id="imps-select" class="nat-sort-select">
                    <option value="city_agg.total_improvements">Total Imps</option>
                    <option value="city_agg.avg_improvements">Avg Imps</option>
                  </select>
                  <button class="nat-sort-dir" data-group="imps">↓</button>
                </div>
              </th>
              <!-- Projects -->
              <th data-col="total_projects">Projects</th>
              <!-- Status sortable -->
              <th data-col="status_order">Status</th>
              <!-- Revenue dropdown sort -->
              <th class="nat-dropdown-th" data-group="rev">
                <div class="nat-sort-ctrl" id="rev-ctrl">
                  <select id="rev-select" class="nat-sort-select">
                    <option value="_rev_mon_net">💰 Net Revenue</option>
                    <option value="_rev_gross">📈 Gross Income</option>
                    <option value="_rev_tax">🏦 Alliance Tax</option>
                  </select>
                  <button class="nat-sort-dir" data-group="rev">↓</button>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="nat-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Overview view -->
  <div id="view-overview" style="display:none">
    <div id="nat-overview-content"></div>
  </div>

</div>

<script>
(function () {
  const fmt  = n => Number(n||0).toLocaleString();
  const fmtF = (n,d=1) => Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  const get  = (obj, path) => path.split('.').reduce((o,k)=>o?.[k], obj);

  // Format policy enum → Title Case with spaces e.g. TECHNOLOGICAL_ADVANCEMENT → Technological Advancement
  function fmtPolicy(val) {
    const s = cleanEnum(val);
    if (!s || s === '—') return '—';
    return s.replace(/_/g,' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  // War policy badge color
  const WAR_POLICY_COLORS = {
    ATTRITION:'#e05555', TURTLE:'#6495ed', BLITZKRIEG:'#ff8c00',
    FORTRESS:'#9370db', PIRATE:'#20b2aa', GUARDIAN:'#3cb371',
    MONEYBAGS:'#ffd700', ARCANE:'#da70d6',
  };
  function warPolicyBadge(val) {
    const raw = cleanEnum(val);
    const label = fmtPolicy(val);
    const css = WAR_POLICY_COLORS[raw.toUpperCase()] || 'rgba(255,255,255,0.5)';
    return `<span class="nat-detail-badge" style="background:${css}22;color:${css};border:1px solid ${css};" title="War Policy">⚔️ ${label}</span>`;
  }

  // Domestic policy badge
  const DOM_POLICY_COLORS = {
    MANIFEST_DESTINY:'#8fbc8f', OPEN_MARKETS:'#87ceeb', TECHNOLOGICAL_ADVANCEMENT:'#9370db',
    IMPERIALISM:'#cd5c5c', URBANIZATION:'#daa520', RAPID_EXPANSION:'#ff8c00',
  };
  function domPolicyBadge(val) {
    const raw = cleanEnum(val);
    const label = fmtPolicy(val);
    const css = DOM_POLICY_COLORS[raw.toUpperCase()] || 'rgba(255,255,255,0.5)';
    return `<span class="nat-detail-badge" style="background:${css}22;color:${css};border:1px solid ${css};" title="Domestic Policy">🏛️ ${label}</span>`;
  }
  function cleanEnum(val) {
    if (!val) return '—';
    const s = String(val);
    const dot = s.lastIndexOf('.');
    return dot >= 0 ? s.slice(dot + 1) : s;
  }
  function positionBadge(pos) {
    const raw = cleanEnum(pos);
    const p = raw.toUpperCase();
    const map = {LEADER:'nat-pos-leader',HEIR:'nat-pos-heir',OFFICER:'nat-pos-officer',MEMBER:'nat-pos-member',APPLICANT:'nat-pos-app'};
    return `<span class="nat-pos-badge ${map[p]||'nat-pos-member'}">${raw}</span>`;
  }

  // PnW color → CSS color value
  const COLOR_MAP = {
    aqua:'#00bcd4', black:'#424242', blue:'#1565c0', brown:'#6d4c41',
    green:'#2e7d32', lime:'#9ccc65', maroon:'#880e4f', olive:'#827717',
    orange:'#e65100', pink:'#e91e63', purple:'#6a1b9a', red:'#c62828',
    white:'#e0e0e0', yellow:'#f9a825', beige:'#d2b48c',
    gray:'#9e9e9e', grey:'#9e9e9e',
  };
  function colorBadge(color) {
    const key = (color||'').toLowerCase();
    const css = COLOR_MAP[key];
    const style = css
      ? `background:${css}22;color:${css};border:1px solid ${css};`
      : 'background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15);';
    return `<span class="nat-detail-badge" style="${style}">${color||'—'}</span>`;
  }

  // Continent code → full name
  const CONTINENT_MAP = {
    af:'Africa', an:'Antarctica', as:'Asia', au:'Australia',
    eu:'Europe', na:'North America', sa:'South America',
  };
  function continentBadge(cont) {
    const key = (cont||'').toLowerCase();
    const label = CONTINENT_MAP[key] || cont || '—';
    return `<span class="nat-detail-badge">${label}</span>`;
  }
  function statusBadge(n) {
    if (cleanEnum(n.alliance_position).toUpperCase() === 'APPLICANT') return '<span class="nat-status-badge nat-app">APPS</span>';
    if ((n.vacation_mode_turns||0) > 0) return '<span class="nat-status-badge nat-vm">VM</span>';
    if ((n.beige_turns||0) > 0)         return '<span class="nat-status-badge nat-beige">Beige</span>';
    const rev = _revCache[n.id];
    if (rev && rev.at_war)              return '<span class="nat-status-badge nat-war">⚔️ War</span>';
    const c = (n.color||'').toLowerCase();
    if (c==='gray'||c==='grey') return '<span class="nat-status-badge nat-grey">Grey</span>';
    return '<span class="nat-status-badge nat-active">Active</span>';
  }
  function pnwLink(id, text) {
    return `<a href="https://politicsandwar.com/nation/id=${id}" target="_blank" class="nat-pnw-link" onclick="event.stopPropagation()">${text}</a>`;
  }

  // ── state ─────────────────────────────────────────────────────────────────
  let _nations = [], _sortCol = 'score', _sortAsc = false, _search = '';
  let _expandedId = null, _detailCache = {};
  let _revCache = {}, _revData = null;
  let _linkedNationId = null;

  // Dropdown sort groups: group → current col
  const _dropdowns = {
    units: 'soldiers',
    infra: 'city_agg.avg_infra',
    land:  'city_agg.avg_land',
    wars:  'wars_won',
    imps:  'city_agg.total_improvements',
    rev:   '_rev_mon_net',
  };
  const _dropdownAsc = { units: false, infra: false, land: false, wars: false, imps: false, rev: false };

  function sortedFiltered() {
    const list = _nations
      .filter(n => {
        if (!_search) return true;
        const q = _search.toLowerCase();
        return (n.nation_name||'').toLowerCase().includes(q) ||
               (n.leader_name||'').toLowerCase().includes(q);
      })
      .sort((a,b) => {
        let av, bv;
        // Revenue virtual sort keys — pull from _revCache
        if (_sortCol === '_rev_mon_net') {
          const ra = _revCache[a.id] || {}, rb = _revCache[b.id] || {};
          const prices_a = ra.prices || {}, rsc_a = ra.resources || {};
          const prices_b = rb.prices || {}, rsc_b = rb.resources || {};
          const rscVal_a = Object.entries(rsc_a).reduce((s,[k,v])=>s+(v*(prices_a[k]||0)),0);
          const rscVal_b = Object.entries(rsc_b).reduce((s,[k,v])=>s+(v*(prices_b[k]||0)),0);
          av = (ra.turn_revenue||0) + rscVal_a;
          bv = (rb.turn_revenue||0) + rscVal_b;
        } else if (_sortCol === '_rev_gross') {
          av = (_revCache[a.id]||{}).gross_income || 0;
          bv = (_revCache[b.id]||{}).gross_income || 0;
        } else if (_sortCol === '_rev_tax') {
          av = (_revCache[a.id]||{}).alliance_tax || 0;
          bv = (_revCache[b.id]||{}).alliance_tax || 0;
        } else {
          av = get(a,_sortCol) ?? -Infinity;
          bv = get(b,_sortCol) ?? -Infinity;
        }
        if (typeof av === 'string') return _sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        return _sortAsc ? av - bv : bv - av;
      });
    // Pin linked nation to top
    if (_linkedNationId) {
      const idx = list.findIndex(n => String(n.id) === _linkedNationId);
      if (idx > 0) list.unshift(list.splice(idx, 1)[0]);
    }
    return list;
  }

  const COL_COUNT = 13;

  function revCellHTML(nationId) {
    var r = _revCache[nationId];
    if (!r) return '<span class="nat-rev-loading">\u2014</span>';
    function fm(v) {
      var s = v < 0 ? '-' : '';
      return s + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    var prices = r.prices || {}, rsc = r.resources || {};
    var rscVal = Object.entries(rsc).reduce(function(s,kv){ return s + (kv[1] * (prices[kv[0]]||0)); }, 0);
    var monNet = (r.turn_revenue||0) + rscVal;
    var gross  = (r.gross_income||0) + (r.color_bonus||0) + rscVal;
    var tax    = r.alliance_tax||0;
    var nc = monNet >= 0 ? 'nat-rev-pos-strong' : 'nat-rev-neg-strong';
    return '<div class="nat-rev-cell-inner">' +
      '<div class="nat-rev-cell-row"><span class="nat-rev-cell-lbl">Gross</span><span class="nat-rev-cell-val">' + fm(gross) + '</span></div>' +
      '<div class="nat-rev-cell-row"><span class="nat-rev-cell-lbl">Net</span><span class="nat-rev-cell-val">' + fm(monNet) + '</span></div>' +
      '<div class="nat-rev-cell-row"><span class="nat-rev-cell-lbl">Tax</span><span class="nat-rev-cell-val">' + fm(tax) + '</span></div>' +
      '</div>';
  }

  function renderTable() {
    const list = sortedFiltered();
    document.getElementById('nat-count').textContent = list.length;
    const tbody = document.getElementById('nat-body');
    const rows = [];
    for (const n of list) {
      const agg = n.city_agg || {};
      const isOpen = _expandedId === n.id;
      const isMe = _linkedNationId && String(n.id) === _linkedNationId;

      rows.push(`<tr class="nat-row${isOpen?' nat-row-open':''}${isMe?' nat-my-nation':''}" data-id="${n.id}">
        <td class="nat-chevron">${isMe?'★':(isOpen?'▼':'▶')}</td>
        <td class="nat-name-cell">
          ${n.flag?`<img src="${n.flag}" class="nat-flag" alt="">`:''}
          <div>
            <span>${pnwLink(n.id, n.nation_name||'Unknown')}</span>
            <small class="nat-leader">${n.leader_name||''}</small>
          </div>
        </td>
        <td>${fmt(Math.round(n.score||0))}</td>
        <td>${n.num_cities||0}</td>
        <td>${fmt(get(n,_dropdowns.units)||0)}</td>
        <td class="nat-mmr">${agg.mmr||'—'}</td>
        <td>${fmtF(get(n,_dropdowns.infra)||0)}</td>
        <td>${fmtF(get(n,_dropdowns.land)||0)}</td>
        <td>${fmt(get(n,_dropdowns.wars)||0)}</td>
        <td>${fmt(get(n,_dropdowns.imps)||0)}</td>
        <td>${n.total_projects||0}</td>
        <td>${statusBadge(n)}</td>
                <td class="nat-rev-cell">${revCellHTML(n.id)}</td>
      </tr>`);

      rows.push(`<tr class="nat-expand-row${isOpen?' nat-expand-open':''}" data-expand-id="${n.id}">
        <td colspan="${COL_COUNT}" class="nat-expand-cell">
          <div class="nat-expand-inner" id="nat-expand-${n.id}">
            ${isOpen && _detailCache[n.id]
              ? buildDetailHTML(Object.assign({}, _detailCache[n.id].nation, {active_war_counts: n.active_war_counts}), _detailCache[n.id].cities)
              : '<div class="nat-loading">Loading…</div>'}
          </div>
        </td>
      </tr>`);
    }
    tbody.innerHTML = rows.join('');
    tbody.querySelectorAll('.nat-row').forEach(row =>
      row.addEventListener('click', () => toggleDetail(parseInt(row.dataset.id)))
    );
  }

  // ── toggle expand ─────────────────────────────────────────────────────────
  async function toggleDetail(nationId) {
    if (_expandedId === nationId) { _expandedId = null; renderTable(); return; }
    _expandedId = nationId;
    renderTable();
    if (!_detailCache[nationId]) {
      try {
        const res = await fetch(`/api/watch/nations/${nationId}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        _detailCache[nationId] = { nation: data.nation, cities: data.cities||[] };
      } catch(e) {
        _detailCache[nationId] = { error: e.message };
      }
    }
    renderTable();
  }

  // ── sort headers ──────────────────────────────────────────────────────────
  function updateSortHeaders() {
    document.querySelectorAll('#nat-table th[data-col]').forEach(th => {
      th.classList.remove('nat-sort-active');
      th.innerHTML = th.innerHTML.replace(/\s*[↑↓]$/,'');
      if (th.dataset.col === _sortCol) {
        th.classList.add('nat-sort-active');
        th.innerHTML += _sortAsc ? ' ↑' : ' ↓';
      }
    });
    // Highlight active dropdown group
    document.querySelectorAll('.nat-dropdown-th').forEach(th => {
      const g = th.dataset.group;
      th.classList.toggle('nat-sort-active', _dropdowns[g] === _sortCol ||
        (g === 'rev' && ['_rev_mon_net','_rev_gross','_rev_tax'].includes(_sortCol) && _dropdowns[g] === _sortCol));
    });
    document.getElementById('nat-sort-summary').textContent =
      `Sorted by ${_sortCol.replace('city_agg.','').replace(/_/g,' ')} ${_sortAsc?'↑':'↓'}`;
  }

  // ── revenue helpers ───────────────────────────────────────────────────────
  function buildRevBox(r) {
    if (!r) return '<div class="nat-rev-loading">Revenue data unavailable</div>';
    const RSC = {food:'Food',coal:'Coal',oil:'Oil',uranium:'Uranium',lead:'Lead',iron:'Iron',
                 bauxite:'Bauxite',gasoline:'Gasoline',munitions:'Munitions',steel:'Steel',aluminum:'Aluminum'};
    const prices  = r.prices    || {};
    const rsc     = r.resources || {};
    const TAX     = r.alliance_tax_rate  || 0.10;
    const RTAX    = r.resource_tax_rate  || TAX;

    // Per-turn base values
    const gross    = r.gross_income       || 0;
    const colorB   = r.color_bonus        || 0;
    const milUp    = r.military_upkeep    || 0;
    const impUp    = r.improvement_upkeep || 0;  // city improvements
    const powUp    = r.power_upkeep       || 0;  // power plants
    const rssUp    = r.rss_upkeep         || 0;  // resource building upkeep
    const taxMoney = r.alliance_tax_money != null ? r.alliance_tax_money : (gross + colorB) * TAX;
    const taxRsc   = r.alliance_tax_resources || 0;
    const taxTotal = r.alliance_tax       || (taxMoney + taxRsc);
    const netCash  = r.turn_revenue       || 0;

    // Resource values per turn
    const rscVal   = Object.entries(rsc).reduce((s,[k,v]) => s + (v * (prices[k]||0)), 0);
    const monNet   = netCash + rscVal;  // full monetary net per turn

    // Combined improvement upkeep = city improvements + power + resource buildings
    const totalImpUp = impUp + powUp + rssUp;

    const $m  = v => { const s=v<0?'-':''; return s+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
    const $n  = (v,d=2) => Number(v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const cls = v => v >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';

    // Resource rows — only non-zero, showing qty and value
    function rscRows(mult) {
      return Object.entries(RSC).map(([k,label]) => {
        const amt = (rsc[k] || 0) * mult;
        if (Math.abs(amt) < 0.001) return '';
        const val = amt * (prices[k] || 0);
        return `<div class="nat-rev-rsc-inline">
          <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">
          <span class="nat-rev-rsc-label">${label}</span>
          <span class="${cls(amt)}">${amt>=0?'+':''}${$n(amt)} <span class="nat-rev-price">(${$m(val)})</span></span>
        </div>`;
      }).join('');
    }

    // Build one time-period column
    function periodCol(label, mult) {
      const g   = gross   * mult;
      const cb  = colorB  * mult;
      const rv  = rscVal  * mult;
      const tm  = taxMoney* mult;
      const tr  = taxRsc  * mult;
      const tt  = taxTotal* mult;
      const mu  = milUp   * mult;
      const iu  = totalImpUp * mult;
      const nc  = netCash * mult;
      const mn  = monNet  * mult;

      return `<div class="nat-rev-col">
        <div class="nat-rev-col-title">${label}</div>

        <div class="nat-rev-sub-title">💰 Income</div>
        <div class="nat-rev-row"><span>National Tax</span><strong>${$m(g)}</strong></div>
        <div class="nat-rev-row"><span>Color Bonus</span><strong>${$m(cb)}</strong></div>
        <div class="nat-rev-row nat-rev-row-hdr"><span>Resources</span><strong>${$m(rv)}</strong></div>
        <div class="nat-rev-rsc-list">${rscRows(mult)}</div>
        <div class="nat-rev-row nat-rev-sub-total"><span>Gross Income</span><strong>${$m(g+cb+rv)}</strong></div>

        <div class="nat-rev-sub-title" style="margin-top:0.6rem">📉 Expenses</div>
        <div class="nat-rev-row"><span>Alliance Tax (${(TAX*100).toFixed(0)}% money)</span><strong class="nat-rev-neg">-${$m(tm)}</strong></div>
        <div class="nat-rev-row"><span>Military Upkeep</span><strong class="nat-rev-neg">-${$m(mu)}</strong></div>
        <div class="nat-rev-row"><span>Improvement Upkeep</span><strong class="nat-rev-neg">-${$m(iu)}</strong></div>
        <div class="nat-rev-row nat-rev-sub-total"><span>Total Expenses</span><strong class="nat-rev-neg">-${$m(tm+mu+iu)}</strong></div>

        <div class="nat-rev-sub-title" style="margin-top:0.6rem">📊 Net</div>
        <div class="nat-rev-row nat-rev-total"><span>Cash Net</span><strong class="${nc >= 0 ? 'nat-rev-pos-strong' : 'nat-rev-neg-strong'}">${$m(nc)}</strong></div>
        ${tr > 0 ? `<div class="nat-rev-row nat-rev-info"><span>Resource Tax Value (${(RTAX*100).toFixed(0)}%)</span><span class="nat-rev-info-val">${$m(tr)}</span></div>` : ''}
        <div class="nat-rev-row nat-rev-total"><span>Monetary Net</span><strong class="${mn >= 0 ? 'nat-rev-pos-strong' : 'nat-rev-neg-strong'}">${$m(mn)}</strong></div>
      </div>`;
    }

    return `<div class="nat-rev-grid">
      ${periodCol('⏱ Per Turn',  1)}
      ${periodCol('📅 Per Day (×12)',  12)}
    </div>`;
  }

  function populateOverviewRevenue() {
    const el = document.getElementById('ov-rev-content');
    if (!el) return;
    if (!_revData) { el.innerHTML = '<div class="nat-rev-loading">Loading revenue…</div>'; return; }

    const nations = _revData.nations || [];
    const count   = nations.length || 1;
    const $m = v => { const s=v<0?'-':''; return s+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
    const $n = v => Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const sum = k => nations.reduce((s,n)=>s+(n[k]||0),0);
    const sumRsc = k => nations.reduce((s,n)=>s+((n.resources||{})[k]||0),0);
    const sumRscVal = k => nations.reduce((s,n)=>s+((n.resources||{})[k]||0)*((n.prices||{})[k]||0),0);
    const avgPrice = k => { const p=nations.filter(n=>(n.prices||{})[k]); return p.length ? p.reduce((s,n)=>s+(n.prices[k]||0),0)/p.length : 0; };

    // Aggregate totals
    const totalGross    = sum('gross_income');
    const totalColorB   = sum('color_bonus');
    const totalMilUp    = sum('military_upkeep');
    const totalImpUp    = sum('improvement_upkeep');
    const totalPowUp    = sum('power_upkeep');
    const totalRssUp    = sum('rss_upkeep');
    
    // Alliance tax totals - only from nations on purple color (alliance color)
    const purpleNations = nations.filter(n => (n.color || '').toLowerCase() === 'purple');
    const sumBlack = k => purpleNations.reduce((s,n)=>s+(n[k]||0),0);
    const sumBlackRsc = k => purpleNations.reduce((s,n)=>s+((n.resources||{})[k]||0),0);
    
    const totalTaxMoney = sumBlack('alliance_tax_money');
    const totalTaxRsc   = sumBlack('alliance_tax_resources');
    const totalTax      = sumBlack('alliance_tax');
    const totalNetTurn  = sum('turn_revenue');
    const totalNetDay   = sum('day_revenue');

    // Resource totals (gross, pre-tax)
    const RSC = {food:'Food',coal:'Coal',oil:'Oil',uranium:'Uranium',lead:'Lead',
                 iron:'Iron',bauxite:'Bauxite',gasoline:'Gasoline',munitions:'Munitions',
                 steel:'Steel',aluminum:'Aluminum'};
    const rscRows = Object.entries(RSC).map(([k,label]) => {
      const qty = sumRsc(k);
      if (Math.abs(qty) < 0.01) return '';
      const val = sumRscVal(k);
      const price = avgPrice(k);
      const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
      return `<div class="ov-rev-rsc-row">
        <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">
        <span class="ov-rev-rsc-label">${label}</span>
        <span class="${cls}">${qty>=0?'+':''}${$n(qty)}/t</span>
        <span class="nat-rev-price">@ ${$n(price)}</span>
        <span class="${cls}">${$m(val)}/t</span>
      </div>`;
    }).join('');
    const totalRscVal = Object.keys(RSC).reduce((s,k)=>s+sumRscVal(k),0);

    // Top 5 earners
    const top5HTML = nations.slice(0,5).map((n,i) => `
      <div class="ov-rev-earner">
        <span class="ov-rev-rank">#${i+1}</span>
        ${n.flag?`<img src="${n.flag}" class="nat-flag" alt="">`:''}
        <span class="ov-rev-name">${n.nation_name||'Unknown'}</span>
        <span class="ov-rev-amt nat-rev-pos-strong">${$m(n.turn_revenue)}/t</span>
        <span class="ov-rev-amt-day">${$m(n.day_revenue)}/day</span>
      </div>`).join('');

    el.innerHTML = `
      <div class="ov-rev-6box-grid">

        <!-- Alliance Rev Turn -->
        <div class="ov-rev-section ov-rev-section-rev">
          <div class="ov-rev-section-title">💰 Alliance Rev Turn</div>
          <div class="ov-rev-kv"><span>National Tax Revenue</span><strong>${$m(totalGross)}</strong></div>
          <div class="ov-rev-kv"><span>Color Bonuses</span><strong>${$m(totalColorB)}</strong></div>
          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Production</span><strong>${$m(totalRscVal)}</strong></div>
          <div class="ov-rev-rsc-list">${rscRows||'<span class="nat-rev-loading">No resource data</span>'}</div>
          <div class="ov-rev-kv ov-rev-kv-total"><span>Total Revenue</span><strong class="nat-rev-pos-strong">${$m(totalGross+totalColorB+totalRscVal)}</strong></div>
        </div>

        <!-- Alliance Rev Day -->
        <div class="ov-rev-section ov-rev-section-rev">
          <div class="ov-rev-section-title">💰 Alliance Rev Day</div>
          <div class="ov-rev-kv"><span>National Tax Revenue</span><strong>${$m(totalGross*12)}</strong></div>
          <div class="ov-rev-kv"><span>Color Bonuses</span><strong>${$m(totalColorB*12)}</strong></div>
          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Production</span><strong>${$m(totalRscVal*12)}</strong></div>
          <div class="ov-rev-rsc-list">${Object.entries(RSC).map(([k,label]) => {
            const qty = sumRsc(k) * 12;
            if (Math.abs(qty) < 0.01) return '';
            const val = sumRscVal(k) * 12;
            const price = avgPrice(k);
            const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
            return `<div class="ov-rev-rsc-row">
              <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">
              <span class="ov-rev-rsc-label">${label}</span>
              <span class="${cls}">${qty>=0?'+':''}${$n(qty)}/day</span>
              <span class="nat-rev-price">@ ${$n(price)}</span>
              <span class="${cls}">${$m(val)}/day</span>
            </div>`;
          }).join('')||'<span class="nat-rev-loading">No resource data</span>'}</div>
          <div class="ov-rev-kv ov-rev-kv-total"><span>Total Revenue</span><strong class="nat-rev-pos-strong">${$m((totalGross+totalColorB+totalRscVal)*12)}</strong></div>
        </div>

        <!-- Alliance Rev Week -->
        <div class="ov-rev-section ov-rev-section-rev">
          <div class="ov-rev-section-title">💰 Alliance Rev Week</div>
          <div class="ov-rev-kv"><span>National Tax Revenue</span><strong>${$m(totalGross*84)}</strong></div>
          <div class="ov-rev-kv"><span>Color Bonuses</span><strong>${$m(totalColorB*84)}</strong></div>
          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Production</span><strong>${$m(totalRscVal*84)}</strong></div>
          <div class="ov-rev-rsc-list">${Object.entries(RSC).map(([k,label]) => {
            const qty = sumRsc(k) * 84;
            if (Math.abs(qty) < 0.01) return '';
            const val = sumRscVal(k) * 84;
            const price = avgPrice(k);
            const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
            return `<div class="ov-rev-rsc-row">
              <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">

              <span class="${cls}">${qty>=0?'+':''}${$n(qty)}/week</span>

          <div class="ov-rev-kv ov-rev-kv-total"><span>Total Revenue</span><strong class="nat-rev-pos-strong">${$m((totalGross+totalColorB+totalRscVal)*84)}</strong></div>
        </div>

        <!-- Alliance Tax Turn -->
        <div class="ov-rev-section ov-rev-section-tax">
          <div class="ov-rev-section-title">🏦 Alliance Tax Turn (Purple Nations Only)</div>
          <div class="ov-rev-kv"><span>Money Tax (10%)</span><strong>${$m(totalTaxMoney)}</strong></div>
          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Tax (10%)</span><strong>${$m(totalTaxRsc)}</strong></div>
          <div class="ov-rev-rsc-list">${Object.entries(RSC).map(([k,label]) => {
            const qty = sumBlackRsc(k) * 0.1; // 10% tax rate, only from purple nations
            if (Math.abs(qty) < 0.001) return '';
            const val = qty * avgPrice(k);
            const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
            return `<div class="ov-rev-rsc-row">
              <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">

              <span class="${cls}">${qty>=0?'+':''}${$n(qty)}/t</span>

          }).join('')||'<span class="nat-rev-loading">No resource data</span>'}</div>
          <div class="ov-rev-kv ov-rev-kv-total"><span>Total Tax Value</span><strong class="nat-rev-pos-strong">${$m(totalTax)}</strong></div>

        <!-- Alliance Tax Day -->
        <div class="ov-rev-section ov-rev-section-tax">

          <div class="ov-rev-kv"><span>Money Tax (10%)</span><strong>${$m(totalTaxMoney*12)}</strong></div>
          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Tax (10%)</span><strong>${$m(totalTaxRsc*12)}</strong></div>
          <div class="ov-rev-rsc-list">${Object.entries(RSC).map(([k,label]) => {
            const qty = sumBlackRsc(k) * 0.1 * 12; // 10% tax rate * 12 turns per day, only from purple nations
            if (Math.abs(qty) < 0.001) return '';
            const val = qty * avgPrice(k);
            const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
            return `<div class="ov-rev-rsc-row">
              <img src="/static/Emojis/Resources/${k}.png" class="nat-icon-sm" alt="">
              <span class="ov-rev-rsc-label">${label}</span>
              <span class="${cls}">${qty>=0?'+':''}${$n(qty)}/day</span>
              <span class="nat-rev-price">@ ${$n(avgPrice(k))}</span>

          <div class="ov-rev-kv ov-rev-kv-total"><span>Total Tax Value</span><strong class="nat-rev-pos-strong">${$m(totalTax*12)}</strong></div>

          <div class="ov-rev-kv ov-rev-kv-hdr"><span>Resource Tax (10%)</span><strong>${$m(totalTaxRsc*84)}</strong></div>
          <div class="ov-rev-rsc-list">${Object.entries(RSC).map(([k,label]) => {
            const qty = sumBlackRsc(k) * 0.1 * 84; // 10% tax rate * 84 turns per week, only from purple nations
            if (Math.abs(qty) < 0.001) return '';
            const val = qty * avgPrice(k);
            const cls = qty >= 0 ? 'nat-rev-pos' : 'nat-rev-neg';
            return `<div class="ov-rev-rsc-row">

  // ── fetch ─────────────────────────────────────────────────────────────────
  async function fetchLinkedNation() {
    try {
      const res = await fetch('/api/discord/linked-nation');
      if (!res.ok) return;
      const data = await res.json();
      if (data.linked && data.nation_id) {
        _linkedNationId = String(data.nation_id);
        if (_nations.length) renderTable();
      }
    } catch(_) {}
  }

  async function fetchRevenue() {
    try {
      const res = await fetch('/api/watch/revenue');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      _revData = data;
      _revCache = {};
      (data.nations || []).forEach(r => { _revCache[r.nation_id] = r; });
      // Re-render table so revenue cells and revenue sorting work immediately
      if (_nations.length) renderTable();
      // Populate overview revenue box if overview is active
      populateOverviewRevenue();
    } catch(e) {
      console.warn('Revenue fetch failed:', e.message);
    }
  }

  async function fetchNations() {
    const status = document.getElementById('nat-status');
    status.style.display = 'block'; status.className = 'nat-status';
    status.textContent = 'Loading nations…';
    try {
      const res = await fetch('/api/watch/nations');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      _nations = data.nations||[];
      _detailCache = {}; _expandedId = null;
      status.style.display = 'none';
      renderTable();
      if (_currentView === 'overview') {
        document.getElementById('nat-overview-content').innerHTML = buildOverviewHTML(_nations);
        populateOverviewRevenue();
      }
    } catch(e) {
      status.className = 'nat-status nat-status-error';
      status.textContent = `Error: ${e.message}`;
    }
  }

  // ── detail HTML ───────────────────────────────────────────────────────────
  function buildDetailHTML(n, cities) {
    if (!n) return '<div class="nat-status nat-status-error">No data</div>';
    const agg = {};
    ['coal_power','oil_power','nuclear_power','wind_power',
     'coal_mine','oil_well','uranium_mine','lead_mine','iron_mine','bauxite_mine',
     'oil_refinery','aluminum_refinery','steel_mill','munitions_factory','factory','farm',
     'police_station','hospital','recycling_center','subway',
     'supermarket','bank','shopping_mall','stadium','barracks','hangar','drydock']
      .forEach(k => agg[k] = cities.reduce((s,c)=>s+(c[k]||0),0));
    const totalInfra = cities.reduce((s,c)=>s+(c.infrastructure||0),0);
    const totalLand  = cities.reduce((s,c)=>s+(c.land||0),0);
    const nc = cities.length || 1;

    const projects = [
      ['⚔️ War',[
        ['Missile Launch Pad','missile_launch_pad','MLP'],['Nuclear Research Facility','nuclear_research_facility','NRF'],
        ['Nuclear Launch Facility','nuclear_launch_facility','NLF'],['Vital Defense System','vital_defense_system','VDS'],
        ['Iron Dome','iron_dome','ID'],['Propaganda Bureau','propaganda_bureau','PB'],
        ['Military Research Center','military_research_center','MRC'],['Space Program','space_program','SP'],
        ['Spy Satellite','spy_satellite','SS'],['Surveillance Network','surveillance_network','SN'],
        ['Guiding Satellite','guiding_satellite','GS'],['Fallout Shelter','fallout_shelter','FS'],
        ['Military Doctrine','military_doctrine','MD'],['Military Salvage','military_salvage','MS'],
        ['Pirate Economy','pirate_economy','PE'],['Advanced Pirate Economy','advanced_pirate_economy','APE'],
        ['Central Intelligence Agency','central_intelligence_agency','CIA'],
      ]],
      ['🏭 Industry',[
        ['Arms Stockpile','arms_stockpile','AS'],['Bauxite Works','bauxite_works','BW'],
        ['Iron Works','iron_works','IW'],['Emergency Gasoline Reserve','emergency_gasoline_reserve','EGR'],
        ['Uranium Enrichment Program','uranium_enrichment_program','UEP'],['Green Technologies','green_technologies','GT'],
        ['Recycling Initiative','recycling_initiative','RI'],['Mass Irrigation','mass_irrigation','MI'],
        ['International Trade Center','international_trade_center','ITC'],
        ['Clinical Research Center','clinical_research_center','CRC'],
        ['Specialized Police Training Program','specialized_police_training_program','SPTP'],
        ['Telecommunications Satellite','telecommunications_satellite','TS'],
      ]],
      ['🏛️ Government',[
        ['Activity Center','activity_center','AC'],['Advanced Engineering Corps','advanced_engineering_corps','AEC'],
        ['Arable Land Agency','arable_land_agency','ALA'],['Bureau of Domestic Affairs','bureau_of_domestic_affairs','BDA'],
        ['Center for Civil Engineering','center_for_civil_engineering','CCE'],
        ['Government Support Agency','government_support_agency','GSA'],
        ['Research & Development Center','research_and_development_center','RDC'],
      ]],
      ['👽 Alien',[['Moon Landing','moon_landing','ML'],['Mars Landing','mars_landing','MaL']]],
    ];

    // Flat list of owned project initials for header tags
    const ownedProjTags = projects.flatMap(([,items]) =>
      items.filter(([,k])=>n[k]).map(([label,,abbr])=>
        `<span class="nat-proj-header-tag" title="${label}">${abbr}</span>`
      )
    ).join('');

    // Full project list for the detail section (kept for reference but no longer shown as a box)
    const ownedProjects = projects.map(([cat,items])=>{
      const owned = items.filter(([,k])=>n[k]);
      return owned.length ? `<div class="nat-proj-cat"><span class="nat-proj-cat-title">${cat}</span>${owned.map(([l,,abbr])=>`<span class="nat-proj-tag" title="${l}">${abbr}</span>`).join('')}</div>` : '';
    }).join('');

    const impGroups = [
      ['⚡ Power',['coal_power','oil_power','nuclear_power','wind_power'],['Coal Power','Oil Power','Nuclear Power','Wind Power']],
      ['⛏️ Resources',['coal_mine','oil_well','uranium_mine','lead_mine','iron_mine','bauxite_mine','farm'],['Coal Mine','Oil Well','Uranium Mine','Lead Mine','Iron Mine','Bauxite Mine','Farm']],
      ['🏭 Manufacturing',['oil_refinery','aluminum_refinery','steel_mill','munitions_factory'],['Gas Refinery','Aluminum Refinery','Steel Mill','Munitions Factory']],
      ['🏛️ Civil',['police_station','hospital','recycling_center','subway'],['Police Station','Hospital','Recycling Center','Subway']],
      ['💰 Commerce',['supermarket','bank','shopping_mall','stadium'],['Supermarket','Bank','Shopping Mall','Stadium']],
      ['⚔️ Military',['barracks','hangar','drydock','factory'],['Barracks','Hangar','Drydock','Factory']],
    ];
    const impHTML = impGroups.map(([title,keys,labels])=>{
      // Show ALL improvement types, even zeros
      const rows = keys.map((k,i)=>{
        const total = agg[k] || 0;
        const avg = nc > 0 ? (total/nc).toFixed(1) : '0.0';
        return `<div class="nat-imp-row"><span>${labels[i]}</span><strong>${fmt(total)}</strong><span class="nat-imp-avg">${avg}/city</span></div>`;
      }).join('');
      return `<div class="nat-imp-group"><div class="nat-imp-group-title">${title}</div>${rows}</div>`;
    }).join('');

    const mmr = `${(agg.barracks/nc).toFixed(1)}/${(agg.factory/nc).toFixed(1)}/${(agg.hangar/nc).toFixed(1)}/${(agg.drydock/nc).toFixed(1)}`;

    return `<div class="nat-detail-inner">
      <div class="nat-detail-header">
        ${n.flag?`<img src="${n.flag}" class="nat-detail-flag" alt="">`:''}
        <div>
          <h3 class="nat-detail-name">${pnwLink(n.id, n.nation_name||'Unknown')}</h3>
          <p class="nat-detail-leader">Leader: ${n.leader_name||'—'}</p>
          <div class="nat-detail-badges">
            ${positionBadge(n.alliance_position)}
            <span class="nat-detail-badge nat-badge-stat" title="Cities">c${n.num_cities||0}</span>
            <span class="nat-detail-badge nat-badge-stat" title="MMR">MMR ${mmr}</span>
            ${statusBadge(n)}
            ${(()=>{
              // Off wars: max 5 base, +1 with Pirate Economy, +1 with Advanced Pirate Economy
              const offMax = 5 + (n.pirate_economy?1:0) + (n.advanced_pirate_economy?1:0);
              const offCur = (n.active_war_counts||{}).off || 0;
              const defMax = 3;
              const defCur = (n.active_war_counts||{}).def || 0;
              // Color: green→yellow→orange→red as slots fill
              function warColor(cur, max) {
                const ratio = max > 0 ? cur/max : 0;
                if (ratio === 0)   return '#00c864';
                if (ratio <= 0.33) return '#7ecb35';
                if (ratio <= 0.66) return '#f0a500';
                if (ratio < 1)    return '#e07020';
                return '#e74c3c';
              }
              const oc = warColor(offCur, offMax);
              const dc = warColor(defCur, defMax);
              return `<span class="nat-detail-badge" style="background:${oc}22;color:${oc};border:1px solid ${oc};" title="Offensive Wars (max ${offMax})">⚔️ ${offCur}/${offMax}</span>` +
                     `<span class="nat-detail-badge" style="background:${dc}22;color:${dc};border:1px solid ${dc};" title="Defensive Wars (max ${defMax})">🛡️ ${defCur}/${defMax}</span>`;
            })()}
            ${colorBadge(n.color)}
            ${continentBadge(n.continent)}
            ${warPolicyBadge(n.war_policy)}
            ${domPolicyBadge(n.domestic_policy)}
            <span class="nat-detail-badge nat-badge-stat" title="Score">⭐ ${fmt(Math.round(n.score||0))}</span>
            <span class="nat-detail-badge nat-badge-stat nat-badge-wins" title="Wars Won">👑 ${n.wars_won||0}</span>
            <span class="nat-detail-badge nat-badge-stat nat-badge-losses" title="Wars Lost">💀 ${n.wars_lost||0}</span>
            <span class="nat-detail-badge nat-badge-stat" title="Infra: Avg / Total">🏗️ ${fmtF(totalInfra/nc)} / ${fmtF(totalInfra)}</span>
            <span class="nat-detail-badge nat-badge-stat" title="Land: Avg / Total">🌾 ${fmtF(totalLand/nc)} / ${fmtF(totalLand)}</span>
            <span class="nat-detail-badge nat-badge-stat" title="Population">👥 ${fmt(n.population||0)}</span>
          </div>
          ${ownedProjTags ? `<div class="nat-proj-header-row">${ownedProjTags}</div>` : ''}
        </div>
      </div>
      <div class="nat-detail-grid">
        <div class="nat-detail-section">
          <div class="nat-detail-section-title">⚔️ Military</div>
          <div class="nat-mil-wrap">
            ${(()=>{
              const mr = (typeof n.military_research === 'string'
                ? (() => { try { return JSON.parse(n.military_research); } catch(e) { return {}; } })()
                : n.military_research) || {};
              const gcl = Math.min(parseInt(mr.ground_capacity || n.ground_capacity || 0), 20);
              const acl = Math.min(parseInt(mr.air_capacity    || n.air_capacity    || 0), 20);
              const ncl = Math.min(parseInt(mr.naval_capacity  || n.naval_capacity  || 0), 20);
              const barracks  = cities.reduce((s,c)=>s+(c.barracks||0),0);
              const factories = cities.reduce((s,c)=>s+(c.factory||0),0);
              const hangars   = cities.reduce((s,c)=>s+(c.hangar||0),0);
              const drydocks  = cities.reduce((s,c)=>s+(c.drydock||0),0);
              const hasPB = n.propaganda_bureau;
              const pb = v => hasPB ? Math.floor(v*1.10) : v;
              // Daily purchase limits (correct formula from game source)
              const soldierDaily  = pb(barracks*1000  + gcl*3000);
              const tankDaily     = pb(factories*50   + gcl*250);
              const aircraftDaily = pb(hangars*3      + acl*15);
              const shipDaily     = pb(drydocks*1     + ncl*5);
              // Max capacities
              const maxSoldiers = barracks*3000  + gcl*3000;
              const maxTanks    = factories*250  + gcl*250;
              const maxAircraft = hangars*15     + acl*15;
              const maxShips    = drydocks*5     + ncl*5;
              // Missiles: 2/day base, 3/day with Space Program. No cap.
              const hasSP  = n.space_program;
              const missilesDaily = hasSP ? 3 : (n.missile_launch_pad ? 2 : 0);
              // Nukes: requires NRF. 1/day base, 2/day with NLF+MLP+SP. No cap.
              const hasNRF = n.nuclear_research_facility;
              const hasNLF = n.nuclear_launch_facility;
              const nukesDaily = !hasNRF ? 0 : (hasNLF && n.missile_launch_pad && hasSP ? 2 : 1);
              // Spies: 2/day base, 3/day with CIA. Cap 50 base, 60 with CIA.
              const hasCIA = n.central_intelligence_agency;
              const spiesDaily = hasCIA ? 3 : 2;
              const spiesMax   = hasCIA ? 60 : 50;
              const mrBadge = (mr.ground_capacity||mr.air_capacity||mr.naval_capacity||mr.ground_cost||mr.air_cost||mr.naval_cost)
                ? `<div class="nat-mil-research">
                    <div class="nat-mil-research-title">🔬 Military Research</div>
                    <div class="nat-mil-research-grid">
                      <span class="nat-mil-research-lbl">Ground Cap</span><span class="nat-mil-research-val">${mr.ground_capacity||0}</span>
                      <span class="nat-mil-research-lbl">Air Cap</span><span class="nat-mil-research-val">${mr.air_capacity||0}</span>
                      <span class="nat-mil-research-lbl">Naval Cap</span><span class="nat-mil-research-val">${mr.naval_capacity||0}</span>
                      <span class="nat-mil-research-lbl">Ground Cost</span><span class="nat-mil-research-val">${mr.ground_cost||0}</span>
                      <span class="nat-mil-research-lbl">Air Cost</span><span class="nat-mil-research-val">${mr.air_cost||0}</span>
                      <span class="nat-mil-research-lbl">Naval Cost</span><span class="nat-mil-research-val">${mr.naval_cost||0}</span>
                    </div>
                  </div>`
                : '';
              // Unit section helper: title, icon, daily, current, max
              function unitSection(icon, label, daily, current, max, noMax) {
                const dailyStr = daily > 0 ? fmt(daily) : '—';
                const maxStr   = noMax ? '∞' : fmt(max);
                return `<div class="nat-mil-unit-section">
                  <div class="nat-mil-unit-title">
                    <img src="/static/Emojis/Military/${icon}" class="nat-icon-sm" alt=""> ${label}
                  </div>
                  <div class="nat-mil-unit-row">
                    <span class="nat-mil-unit-lbl">Daily</span>
                    <span class="nat-daily">${dailyStr}/day</span>
                  </div>
                  <div class="nat-mil-unit-row">
                    <span class="nat-mil-unit-lbl">Current</span>
                    <strong>${fmt(current)}</strong>
                  </div>
                  <div class="nat-mil-unit-row">
                    <span class="nat-mil-unit-lbl">Max</span>
                    <span class="nat-max">${maxStr}</span>
                  </div>
                </div>`;
              }
              return `
            <div class="nat-mil-units-grid">
              ${unitSection('soldier.png','Soldiers', soldierDaily,  n.soldiers||0, maxSoldiers)}
              ${unitSection('tank.png',   'Tanks',    tankDaily,     n.tanks||0,    maxTanks)}
              ${unitSection('jet.png',    'Aircraft', aircraftDaily, n.aircraft||0, maxAircraft)}
              ${unitSection('ship.png',   'Ships',    shipDaily,     n.ships||0,    maxShips)}
              ${unitSection('missile.png','Missiles', missilesDaily, n.missiles||0, 0, true)}
              ${unitSection('bomb.png',   'Nukes',    nukesDaily,    n.nukes||0,    0, true)}
              ${unitSection('spy.png',    'Spies',    spiesDaily,    n.spies||0,    spiesMax)}
            </div>
            ${mrBadge}`;
            })()}
          </div>
        </div>
        <div class="nat-detail-section">
          <div class="nat-detail-section-title">💰 Revenue</div>
          ${buildRevBox(_revCache[n.id])}
        </div>
        ${cities.length?`
        <div class="nat-detail-section nat-detail-section-full">
          <div class="nat-detail-section-title">🏙️ Cities (${cities.length})</div>
          <div class="nat-cities-wrap">
            ${cities.map(c=>{
              const allImps = [
                ['Coal Power',c.coal_power],['Oil Power',c.oil_power],['Nuclear Power',c.nuclear_power],['Wind Power',c.wind_power],
                ['Coal Mine',c.coal_mine],['Oil Well',c.oil_well],['Uranium Mine',c.uranium_mine],['Lead Mine',c.lead_mine],
                ['Iron Mine',c.iron_mine],['Bauxite Mine',c.bauxite_mine],['Farm',c.farm],
                ['Gas Refinery',c.oil_refinery],['Aluminum Refinery',c.aluminum_refinery],['Steel Mill',c.steel_mill],['Munitions Factory',c.munitions_factory],['Factory',c.factory],
                ['Police Station',c.police_station],['Hospital',c.hospital],['Recycling Center',c.recycling_center],['Subway',c.subway],
                ['Supermarket',c.supermarket],['Bank',c.bank],['Shopping Mall',c.shopping_mall],['Stadium',c.stadium],
                ['Barracks',c.barracks],['Hangar',c.hangar],['Drydock',c.drydock],
              ].filter(([,v])=>v>0);
              return `<div class="nat-city-card">
                <div class="nat-city-name">${c.name||`City ${c.id}`}</div>
                <div class="nat-city-stats">
                  <span>Infra: <strong>${fmtF(c.infrastructure||0)}</strong></span>
                  <span>Land: <strong>${fmtF(c.land||0)}</strong></span>
                  <span class="${c.powered?'nat-powered':'nat-unpowered'}">${c.powered?'⚡':'⚠️'}</span>
                </div>
                <div class="nat-city-imps">
                  ${allImps.map(([l,v])=>`<span class="nat-city-imp">${l}: ${v}</span>`).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`:''}
      </div>
    </div>`;
  }

  // ── view switching ────────────────────────────────────────────────────────
  let _currentView = 'nations';

  function switchView(view) {
    _currentView = view;
    document.getElementById('view-nations').style.display  = view === 'nations'  ? '' : 'none';
    document.getElementById('view-overview').style.display = view === 'overview' ? '' : 'none';
    document.getElementById('nat-search').style.display    = view === 'nations'  ? '' : 'none';
    document.querySelectorAll('.nat-view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    if (view === 'overview' && _nations.length) {
      document.getElementById('nat-overview-content').innerHTML = buildOverviewHTML(_nations);
      populateOverviewRevenue();
    }
  }

  // ── overview builder ──────────────────────────────────────────────────────
  function buildOverviewHTML(nations) {
    const active  = nations.filter(n => !(n.vacation_mode_turns > 0) && cleanEnum(n.alliance_position).toUpperCase() !== 'APPLICANT');
    const vm      = nations.filter(n => (n.vacation_mode_turns||0) > 0);
    const apps    = nations.filter(n => cleanEnum(n.alliance_position).toUpperCase() === 'APPLICANT');
    const grey    = active.filter(n => ['gray','grey'].includes((n.color||'').toLowerCase()));
    const beige   = active.filter(n => (n.color||'').toLowerCase() === 'beige');

    const sum  = (arr, k) => arr.reduce((s,n) => s + (Number(n[k])||0), 0);
    const sumA = (arr, k) => arr.reduce((s,n) => s + (Number((n.city_agg||{})[k])||0), 0);
    const avg  = (total, count) => count ? (total/count) : 0;

    const totalScore    = sum(active, 'score');
    const totalCities   = sum(active, 'num_cities');
    const totalSoldiers = sum(active, 'soldiers');
    const totalTanks    = sum(active, 'tanks');
    const totalAircraft = sum(active, 'aircraft');
    const totalShips    = sum(active, 'ships');
    const totalMissiles = sum(active, 'missiles');
    const totalNukes    = sum(active, 'nukes');
    const totalInfra    = sumA(active, 'total_infra');
    const totalLand     = sumA(active, 'total_land');
    const totalImps     = sumA(active, 'total_improvements');
    const totalBarracks = sumA(active, 'barracks');
    const totalFactories= sumA(active, 'factories');
    const totalHangars  = sumA(active, 'hangars');
    const totalDrydocks = sumA(active, 'drydocks');
    const totalWarsWon  = sum(active, 'wars_won');
    const totalWarsLost = sum(active, 'wars_lost');
    const totalProjects = active.reduce((s,n) => s + (n.total_projects||0), 0);

    // Project totals
    const projectFields = [
      ['⚔️ War',[
        ['Missile Launch Pad','missile_launch_pad'],['Nuclear Research Facility','nuclear_research_facility'],
        ['Nuclear Launch Facility','nuclear_launch_facility'],['Vital Defense System','vital_defense_system'],
        ['Iron Dome','iron_dome'],['Propaganda Bureau','propaganda_bureau'],
        ['Military Research Center','military_research_center'],['Space Program','space_program'],
        ['Spy Satellite','spy_satellite'],['Surveillance Network','surveillance_network'],
        ['Guiding Satellite','guiding_satellite'],['Fallout Shelter','fallout_shelter'],
        ['Military Doctrine','military_doctrine'],['Military Salvage','military_salvage'],
        ['Pirate Economy','pirate_economy'],['Advanced Pirate Economy','advanced_pirate_economy'],
        ['Central Intelligence Agency','central_intelligence_agency'],
      ]],
      ['🏭 Industry',[
        ['Arms Stockpile','arms_stockpile'],['Bauxite Works','bauxite_works'],
        ['Iron Works','iron_works'],['Emergency Gasoline Reserve','emergency_gasoline_reserve'],
        ['Uranium Enrichment Program','uranium_enrichment_program'],['Green Technologies','green_technologies'],
        ['Recycling Initiative','recycling_initiative'],['Mass Irrigation','mass_irrigation'],
        ['International Trade Center','international_trade_center'],
        ['Clinical Research Center','clinical_research_center'],
        ['Specialized Police Training Program','specialized_police_training_program'],
        ['Telecommunications Satellite','telecommunications_satellite'],
      ]],
      ['🏛️ Government',[
        ['Activity Center','activity_center'],['Advanced Engineering Corps','advanced_engineering_corps'],
        ['Arable Land Agency','arable_land_agency'],['Bureau of Domestic Affairs','bureau_of_domestic_affairs'],
        ['Center for Civil Engineering','center_for_civil_engineering'],
        ['Government Support Agency','government_support_agency'],
        ['Research & Development Center','research_and_development_center'],
      ]],
      ['👽 Alien',[['Moon Landing','moon_landing'],['Mars Landing','mars_landing']]],
    ];

    const projHTML = projectFields.map(([cat, items]) => {
      const rows = items.map(([label, field]) => {
        const count = active.filter(n => n[field]).length;
        const pct   = active.length ? ((count/active.length)*100).toFixed(0) : 0;
        const barW  = pct;
        return `<div class="ov-proj-row">
          <span class="ov-proj-label">${label}</span>
          <div class="ov-proj-bar-wrap">
            <div class="ov-proj-bar" style="width:${barW}%"></div>
          </div>
          <span class="ov-proj-count">${count} <span class="ov-proj-pct">(${pct}%)</span></span>
        </div>`;
      }).join('');
      return `<div class="ov-proj-group"><div class="ov-proj-group-title">${cat}</div>${rows}</div>`;
    }).join('');

    // City distribution
    const cityBuckets = {};
    active.forEach(n => {
      const c = n.num_cities || 0;
      const bucket = c <= 10 ? '1-10' : c <= 15 ? '11-15' : c <= 20 ? '16-20' :
                     c <= 25 ? '21-25' : c <= 30 ? '26-30' : c <= 35 ? '31-35' : '36+';
      cityBuckets[bucket] = (cityBuckets[bucket]||0) + 1;
    });
    const bucketOrder = ['1-10','11-15','16-20','21-25','26-30','31-35','36+'];
    const maxBucket = Math.max(...Object.values(cityBuckets), 1);
    const cityDistHTML = bucketOrder.map(b => {
      const count = cityBuckets[b] || 0;
      if (!count) return '';
      return `<div class="ov-dist-row">
        <span class="ov-dist-label">${b} cities</span>
        <div class="ov-dist-bar-wrap">
          <div class="ov-dist-bar" style="width:${(count/maxBucket*100).toFixed(0)}%"></div>
        </div>
        <span class="ov-dist-count">${count}</span>
      </div>`;
    }).join('');

    const nc = active.length || 1;

    return `<div class="ov-grid">

      <!-- Nation Status -->
      <div class="ov-card">
        <div class="ov-card-title">🌍 Nation Status</div>
        <div class="ov-kv-grid">
          <div class="ov-kv"><span>Total Members</span><strong>${nations.length}</strong></div>
          <div class="ov-kv"><span>Active</span><strong>${active.length}</strong></div>
          <div class="ov-kv"><span>Applicants</span><strong>${apps.length}</strong></div>
          <div class="ov-kv"><span>Vacation Mode</span><strong>${vm.length}</strong></div>
          <div class="ov-kv"><span>Grey</span><strong>${grey.length}</strong></div>
          <div class="ov-kv"><span>Beige</span><strong>${beige.length}</strong></div>
          <div class="ov-kv"><span>Total Score</span><strong>${fmt(Math.round(totalScore))}</strong></div>
          <div class="ov-kv"><span>Avg Score</span><strong>${fmt(Math.round(avg(totalScore,nc)))}</strong></div>
          <div class="ov-kv"><span>Total Cities</span><strong>${fmt(totalCities)}</strong></div>
          <div class="ov-kv"><span>Avg Cities</span><strong>${fmtF(avg(totalCities,nc))}</strong></div>
        </div>
      </div>

      <!-- Military -->
      <div class="ov-card">
        <div class="ov-card-title">⚔️ Military Totals</div>
        <div class="ov-kv-grid">
          <div class="ov-kv"><img src="/static/Emojis/Military/soldier.png" class="nat-icon-sm" alt=""><span>Soldiers</span><strong>${fmt(totalSoldiers)}</strong></div>
          <div class="ov-kv"><img src="/static/Emojis/Military/tank.png" class="nat-icon-sm" alt=""><span>Tanks</span><strong>${fmt(totalTanks)}</strong></div>
          <div class="ov-kv"><img src="/static/Emojis/Military/jet.png" class="nat-icon-sm" alt=""><span>Aircraft</span><strong>${fmt(totalAircraft)}</strong></div>
          <div class="ov-kv"><img src="/static/Emojis/Military/ship.png" class="nat-icon-sm" alt=""><span>Ships</span><strong>${fmt(totalShips)}</strong></div>
          <div class="ov-kv"><img src="/static/Emojis/Military/missile.png" class="nat-icon-sm" alt=""><span>Missiles</span><strong>${fmt(totalMissiles)}</strong></div>
          <div class="ov-kv"><img src="/static/Emojis/Military/bomb.png" class="nat-icon-sm" alt=""><span>Nukes</span><strong>${fmt(totalNukes)}</strong></div>
          <div class="ov-kv"><span>Wars Won</span><strong>${fmt(totalWarsWon)}</strong></div>
          <div class="ov-kv"><span>Wars Lost</span><strong>${fmt(totalWarsLost)}</strong></div>
          <div class="ov-kv"><span>W/L Ratio</span><strong>${totalWarsLost ? (totalWarsWon/totalWarsLost).toFixed(2) : '∞'}</strong></div>
        </div>
      </div>

      <!-- Infrastructure -->
      <div class="ov-card">
        <div class="ov-card-title">🏗️ Infrastructure & Land</div>
        <div class="ov-kv-grid">
          <div class="ov-kv"><span>Total Infra</span><strong>${fmtF(totalInfra)}</strong></div>
          <div class="ov-kv"><span>Avg Infra/City</span><strong>${fmtF(avg(totalInfra, totalCities))}</strong></div>
          <div class="ov-kv"><span>Total Land</span><strong>${fmtF(totalLand)}</strong></div>
          <div class="ov-kv"><span>Avg Land/City</span><strong>${fmtF(avg(totalLand, totalCities))}</strong></div>
          <div class="ov-kv"><span>Total Improvements</span><strong>${fmt(Math.round(totalImps))}</strong></div>
          <div class="ov-kv"><span>Avg Imps/City</span><strong>${fmtF(avg(totalImps, totalCities))}</strong></div>
          <div class="ov-kv"><span>Total Barracks</span><strong>${fmt(totalBarracks)}</strong></div>
          <div class="ov-kv"><span>Total Factories</span><strong>${fmt(totalFactories)}</strong></div>
          <div class="ov-kv"><span>Total Hangars</span><strong>${fmt(totalHangars)}</strong></div>
          <div class="ov-kv"><span>Total Drydocks</span><strong>${fmt(totalDrydocks)}</strong></div>
          <div class="ov-kv"><span>Total Projects</span><strong>${fmt(totalProjects)}</strong></div>
          <div class="ov-kv"><span>Avg Projects</span><strong>${fmtF(avg(totalProjects,nc))}</strong></div>
        </div>
      </div>

      <!-- City Distribution -->
      <div class="ov-card">
        <div class="ov-card-title">🏙️ City Distribution</div>
        <div class="ov-dist">${cityDistHTML}</div>
      </div>

      <!-- Alliance Revenue (moved below Infrastructure and City Distribution) -->
      <div class="ov-card ov-card-full" id="ov-rev-box">
        <div class="ov-card-title">💰 Alliance Revenue</div>
        <div id="ov-rev-content">Loading…</div>
      </div>

      <!-- Projects (full width) -->
      <div class="ov-card ov-card-full">
        <div class="ov-card-title">🔬 Project Counts (active members)</div>
        <div class="ov-proj-grid">${projHTML}</div>
      </div>

    </div>`;
  }

  // ── init ──────────────────────────────────────────────────────────────────
  document.addEventListener('dashboardPageLoaded', function(e) {
    if (e.detail.page !== 'nations.html') return;

    fetchNations();
    fetchRevenue();
    fetchLinkedNation();
    document.getElementById('nat-refresh').addEventListener('click', () => { fetchNations(); fetchRevenue(); });
    document.getElementById('nat-search').addEventListener('input', function() { _search=this.value; renderTable(); });

    // View tabs
    document.querySelectorAll('.nat-view-tab').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    // Simple column sort — MMR sorts ascending (0 deficit = full MMR first)
    document.querySelectorAll('#nat-table th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (_sortCol===col) _sortAsc=!_sortAsc;
        else { _sortCol=col; _sortAsc = col === 'city_agg.mmr_deficit'; }
        updateSortHeaders(); renderTable();
      });
    });

    // Dropdown sort groups
    ['units','infra','land','wars','imps','rev'].forEach(group => {
      const sel = document.getElementById(`${group}-select`);
      const btn = document.querySelector(`.nat-sort-dir[data-group="${group}"]`);
      sel.addEventListener('change', () => {
        _dropdowns[group] = sel.value;
        _sortCol = sel.value; _sortAsc = _dropdownAsc[group];
        // Update units emoji image when unit type changes
        if (group === 'units') {
          const img = sel.options[sel.selectedIndex].dataset.img;
          document.getElementById('units-emoji').src = '/static/Emojis/Military/' + img;
        }
        updateSortHeaders(); renderTable();
      });
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        _dropdownAsc[group] = !_dropdownAsc[group];
        btn.textContent = _dropdownAsc[group] ? '↑' : '↓';
        _sortCol = _dropdowns[group]; _sortAsc = _dropdownAsc[group];
        updateSortHeaders(); renderTable();
      });
      // Clicking the th also activates this group's sort
      document.querySelector(`.nat-dropdown-th[data-group="${group}"]`).addEventListener('click', (ev) => {
        if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'BUTTON') return;
        _sortCol = _dropdowns[group]; _sortAsc = _dropdownAsc[group];
        updateSortHeaders(); renderTable();
      });
    });
  });
})();
</script>
