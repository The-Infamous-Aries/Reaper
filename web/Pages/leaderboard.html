<meta charset="UTF-8">
<link rel="stylesheet" href="/css/leaderboard.css">

<!-- Tie Modal -->
    <div class="lb-tie-modal" id="lb-tie-modal" role="dialog" aria-modal="true" aria-labelledby="lb-tie-modal-title">
        <div class="lb-tie-content">
            <div class="lb-tie-header">
                <img class="lb-tie-rank-img" id="lb-tie-modal-img" src="" alt="">
                <div class="lb-tie-titles">
                    <p class="lb-tie-title" id="lb-tie-modal-title"></p>
                    <p class="lb-tie-subtitle" id="lb-tie-modal-subtitle"></p>
                </div>
                <button class="lb-tie-close" id="lb-tie-modal-close" aria-label="Close">✕</button>
            </div>
            <div class="lb-tie-body">
                <div class="lb-tie-list" id="lb-tie-modal-list"></div>
            </div>
        </div>
    </div>

    <div class="lb-shell">
        <div class="card">
            <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                <div>
                    <p style="margin:0; color:var(--gold-secondary); font-size:0.82rem; letter-spacing:0.08em; text-transform:uppercase;">War Ledger</p>
                    <p style="margin:0.2rem 0 0; color:var(--gold-primary); font-size:1.1rem; font-weight:700;"><img src="/static/Emojis/Menu/leaderboard.png" style="width:1.2rem;height:1.2rem;object-fit:contain;vertical-align:middle;margin-right:0.4rem;">Leaderboards</p>
                </div>
                <div class="lb-period-tabs">
                    <button class="lb-tab active" data-period="this_month">This Month</button>
                    <button class="lb-tab" data-period="this_week">This Week</button>
                    <div class="lb-tab-group" id="prev-months-group">
                        <button class="lb-tab" id="prev-months-btn">Previous Months <span class="lb-caret">▼</span></button>
                        <div class="lb-sub-menu" id="prev-months-menu"><div class="lb-sub-item" style="color:var(--text-secondary);cursor:default;">Loading…</div></div>
                    </div>
                    <div class="lb-tab-group" id="prev-weeks-group">
                        <button class="lb-tab" id="prev-weeks-btn">Previous Weeks <span class="lb-caret">▼</span></button>
                        <div class="lb-sub-menu" id="prev-weeks-menu"><div class="lb-sub-item" style="color:var(--text-secondary);cursor:default;">Loading…</div></div>
                    </div>
                    <button class="lb-tab" id="custom-range-btn">Custom Range</button>
                </div>
            </div>
            <div class="lb-custom-range" id="lb-custom-range">
                <label for="lb-start-date">From</label>
                <input type="date" id="lb-start-date" class="lb-date-input">
                <span class="lb-date-sep">→</span>
                <label for="lb-end-date">To</label>
                <input type="date" id="lb-end-date" class="lb-date-input">
                <button class="lb-apply-btn" id="lb-apply-range">Apply</button>
            </div>
            <div class="card-body" style="padding-top:0.5rem;">
                <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
                    <div>
                        <p class="lb-period-label">Period</p>
                        <p class="lb-period-value" id="lb-period-display">—</p>
                    </div>
                    <div>
                        <p class="lb-period-label">Wars in Range</p>
                        <p class="lb-period-value" id="lb-war-count">—</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="lb-status" role="status" aria-live="polite"></div>

        <div id="lb-loading" class="lb-loading-grid">
            <div class="lb-skeleton"></div><div class="lb-skeleton"></div>
            <div class="lb-skeleton"></div><div class="lb-skeleton"></div>
            <div class="lb-skeleton"></div><div class="lb-skeleton"></div>
        </div>

        <div id="lb-grid" class="lb-grid" style="display:none;"></div>
    </div>

    <script src="/js/access_guard.js"></script>
<script src="/js/leaderboard.js"></script>
