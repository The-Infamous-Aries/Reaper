<link rel="stylesheet" href="/css/petconnector.css">

<div class="container-fluid" id="pc-root">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div class="d-flex align-items-center gap-3">
            <h4 style="font-family:Orbitron,sans-serif;color:var(--gold-primary);text-shadow:0 0 10px var(--gold-glow);margin:0">
                🌍 Pet Connector
            </h4>
            <span class="pc-badge" id="pc-count-badge" style="display:none"></span>
        </div>
    </div>

    <hr class="pc-divider">

    <!-- Loading -->
    <div id="pc-loading" class="text-center py-5">
        <div class="spinner-border" style="color:var(--gold-primary)" role="status"></div>
        <p class="mt-2" style="color:var(--text-secondary)">Loading pets…</p>
    </div>

    <!-- Error -->
    <div id="pc-error" style="display:none" class="text-center py-5">
        <p style="color:#f44336" id="pc-error-msg"></p>
        <button class="pc-btn-sm" onclick="location.reload()">↺ Retry</button>
    </div>

    <!-- Cards grid -->
    <div id="pc-main" style="display:none">
        <div class="row g-3" id="pc-pets-grid"></div>
    </div>

</div>

<!-- ── Expanded pet detail panel (inline, not a Bootstrap modal) ───────────── -->
<div id="pc-detail-overlay" style="display:none">
    <div id="pc-detail-panel">
        <button class="pc-detail-close" onclick="closeDetail()">✕</button>
        <div id="pc-detail-inner"></div>
    </div>
</div>

<!-- ── Gift modal ──────────────────────────────────────────────────────────── -->
<div id="pc-gift-overlay" style="display:none">
    <div class="pc-gift-dialog">
        <div class="pc-gift-header">
            <span id="pc-gift-title">🎁 Gift Item</span>
            <button onclick="closeGiftOverlay()" style="background:none;border:none;color:var(--text-secondary);font-size:1.2rem;cursor:pointer;line-height:1">✕</button>
        </div>
        <div class="pc-gift-body">
            <label style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;display:block">Select Item</label>
            <select id="pc-gift-select" class="pc-select" style="width:100%;margin-bottom:12px" onchange="pcUpdateGiftQty()">
                <option value="">Choose an item…</option>
            </select>
            <label style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;display:block">Quantity</label>
            <input type="number" id="pc-gift-qty" class="pc-select" style="width:80px" min="1" max="1" value="1">
        </div>
        <div class="pc-gift-footer">
            <button class="pc-rel-btn" style="background:rgba(255,255,255,0.08)" onclick="closeGiftOverlay()">Cancel</button>
            <button class="pc-rel-btn pc-rel-active" id="pc-gift-send" onclick="pcSendGift()">Send Gift</button>
        </div>
    </div>
</div>

<script src="/js/petconnector.js"></script>
