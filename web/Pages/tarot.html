<div class="tarot-page" id="tarot-page">
    <section class="tarot-hero">
        <div class="tarot-hero-copy">
            <div class="tarot-kicker">Reaper's Oracle</div>
            <h1>Tarot Reading</h1>
            <p>The deck is shuffled from the same cards, images, spreads, reversals, meanings, and fortunes used by the Discord command.</p>
        </div>
        <div class="tarot-dealer" aria-live="polite">
            <img id="tarot-dealer-skull" src="/static/Emojis/Skulls/1.png" alt="Tarot Dealer">
            <div>
                <span>Tarot Dealer</span>
                <strong id="tarot-dealer-state">Awaiting the cut</strong>
            </div>
        </div>
    </section>

    <section class="tarot-controls" aria-label="Tarot controls">
        <div class="tarot-spread-tabs" role="tablist" aria-label="Spread">
            <button class="tarot-spread active" type="button" data-spread="1 Card">1 Card</button>
            <button class="tarot-spread" type="button" data-spread="3 Card (Past/Present/Future)">Past Present Future</button>
            <button class="tarot-spread" type="button" data-spread="5 Card (Traditional)">Traditional 5</button>
        </div>
        <button class="tarot-draw-btn" id="tarot-draw-btn" type="button">
            <i class="fa-solid fa-skull"></i>
            Draw Reading
        </button>
    </section>

    <section class="tarot-reading-shell" id="tarot-reading-shell">
        <div class="tarot-empty" id="tarot-empty">
            <div class="tarot-deck-stack" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
            <h2>The table is ready.</h2>
            <p>Select a spread and draw.</p>
        </div>

        <div class="tarot-reading" id="tarot-reading" hidden>
            <div class="tarot-reading-header">
                <div>
                    <span class="tarot-kicker">Spread</span>
                    <h2 id="tarot-reading-title">1 Card Reading</h2>
                </div>
                <div class="tarot-energy" id="tarot-energy" hidden></div>
            </div>
            <div class="tarot-card-grid" id="tarot-card-grid"></div>
            <article class="tarot-summary" id="tarot-summary" hidden>
                <span class="tarot-kicker">Oracle Summary</span>
                <p id="tarot-summary-text"></p>
            </article>
        </div>
    </section>
</div>
